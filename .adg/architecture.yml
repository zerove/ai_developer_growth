# ADG Architecture Configuration
# Defines layer architecture for dependency rule enforcement
# Based on tools/scripts/rules_engine/arch/layer_checker.py LayerConfig

config_version: '1.0'

# Layer definitions (outermost to innermost - dependencies must flow inward)
# Format: layer_name: [glob_patterns]
# A module in layer A can import from layer B only if B is "deeper" (to the right)
layers:
  - name: "external"
    patterns:
      - "**/test*.py"
      - "**/*_test.py"
      - "**/tests/**"
    description: "Test code - can import from anywhere"

  - name: "interface"
    patterns:
      - "**/api/**"
      - "**/routes/**"
      - "**/controllers/**"
      - "**/handlers/**"
      - "**/endpoints/**"
    description: "API/Interface layer - entry points"

  - name: "application"
    patterns:
      - "**/services/**"
      - "**/usecases/**"
      - "**/application/**"
      - "**/commands/**"
      - "**/queries/**"
    description: "Application/Use case layer - business logic orchestration"

  - name: "domain"
    patterns:
      - "**/domain/**"
      - "**/models/**"
      - "**/entities/**"
      - "**/value_objects/**"
      - "**/aggregates/**"
    description: "Domain layer - core business logic, rules, entities"

  - name: "infrastructure"
    patterns:
      - "**/repositories/**"
      - "**/persistence/**"
      - "**/database/**"
      - "**/orm/**"
      - "**/migrations/**"
    description: "Infrastructure - data access, external services"

  - name: "framework"
    patterns:
      - "**/framework/**"
      - "**/lib/**"
      - "**/shared/**"
      - "**/utils/**"
      - "**/helpers/**"
      - "**/common/**"
    description: "Framework/Shared utilities - lowest level"

  - name: "config"
    patterns:
      - "**/config/**"
      - "**/settings/**"
      - "**/conf/**"
    description: "Configuration - should not be imported by domain"

# Rules
rules:
  # Allow test layer to import from anywhere (default)
  - from: "test"
    to: "*"
    allow: true

  # Interface can call Application, Domain
  - from: "interface"
    to: ["application", "domain"]
    allow: true

  # Application can call Domain, Infrastructure
  - from: "application"
    to: ["domain", "infrastructure"]
    allow: true

  # Domain can call Framework, Config
  - from: "domain"
    to: ["framework", "config"]
    allow: true

  # Infrastructure can call Framework, Config
  - from: "infrastructure"
    to: ["framework", "config"]
    allow: true

  # Framework can call Config
  - from: "framework"
    to: ["config"]
    allow: true

  # Config should not import anything (leaf)
  - from: "config"
    to: "*"
    allow: false

# Default deny for undefined cross-layer imports
default_deny: true

# Exceptions (specific modules allowed to violate layer rules)
exceptions:
  - from: "legacy"
    to: "*"
    reason: "Legacy code migration in progress"
  - from: "scripts"
    to: "*"
    reason: "Operational scripts need full access"
  - from: "examples"
    to: "*"
    reason: "Example code for demonstration"

# Cycle detection
cycle_detection:
  enabled: true
  max_cycle_length: 10
  # 已登记的存量循环（逐条附原因，保持可见而非隐藏）。
  # 豁免判定: 环中**每个**模块都能被同一条豁免的某个模式匹配才算豁免，
  # 避免"沾边即豁免"；支持 glob。新增循环不在此列 → 直接报错。
  exemptions:
    - modules:
        - "tools/scripts/rules_engine/ast_parser.py"
        - "tools/scripts/rules_engine/_ast_walkers.py"
        - "tools/scripts/rules_engine/parsers/*.py"
      reason: "AST 节点类型定义与 walker/各语言 parser 互相依赖，待拆分节点类型模块（2026-11-12 登记）"
    - modules:
        - "tools/scripts/rules_engine/checker.py"
        - "tools/scripts/rules_engine/_checker_workers.py"
      reason: "worker 需要 checker 的检查入口，checker 需要 worker 执行器，待拆出共享执行层（2026-11-12 登记）"
    - modules:
        - "tools/scripts/validate_language_rules.py"
        - "tools/scripts/complexity_analyzer.py"
        - "tools/scripts/naming_analyzer.py"
      reason: "分析器反向引用校验入口的公共类型，待抽出共享模型层（2026-11-12 登记）"
    - modules:
        - "tools/scripts/adg_cli/core.py"
        - "tools/scripts/adg_cli/detect.py"
      reason: "detect 复用 core 的 Issue 模型，core 复用 detect 的语言识别，待上移共享层（2026-11-12 登记）"

# Hub detection
hub_detection:
  enabled: true
  # 阈值 25: 编排器/入口文件天然依赖较多模块（沿用代码内默认值的理由）
  threshold: 25
  exclude_patterns:
    - "**/__init__.py"
    - "**/conftest.py"
    - "**/migrations/**"
