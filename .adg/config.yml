config_version: '1.0'
project:
  name: ai_developer_growth
  description: AI Developer Growth - Governance Engine
  version: 2.15.0
  # 注：此文件是 v2.13 之前的旧配置源；当前运行时主要从 pyproject.toml
  # [tool.adg] 读取。多数字段（language/domains/architecture/frameworks/
  # context/feedback/output/performance/ci/notifications/lsp/marketplace/
  # skip_patterns/rules/project）实际不被运行时引用，仅作配置参考。
  # 真正被 get_setting() 读取的字段：llm_provider / llm_model /
  # openai_api_key / openai_api_base / exclude / jobs。
language:
  auto_detect: true
  primary: python
  include:
  - python
  - javascript
  - typescript
  - yaml
  exclude:
  - vendor
  - node_modules
  - .git
  - __pycache__
  - .cache
  - dist
  - build
domains:
- finance
- hipaa
- gaming
architecture:
  config_file: .adg/architecture.yml
  enabled: true
frameworks:
  auto_detect: true
  enabled:
  - fastapi
  - django
  - express
  - react
  - vue
  - nextjs
rules:
  severity_overrides:
    py-any-type: warning
    py-missing-all: info
    common-type-any: warning
  custom_rules_file: .adg/rules.yml
context:
  enabled: true
  role_markers_file: .adg/role_markers.yml
  role_severity: {}
  markers:
    tests/: test
    test/: test
    __tests__/: test
    spec/: test
    '*_test.py': test
    test_*.py: test
    examples/: demo
    demo/: demo
    scripts/: prototype
    bin/: prototype
    tools/: prototype
    config/: config
    '*.config.js': config
    '*.yml': config
    '*.yaml': config
    '*.json': config
    Dockerfile: config
    legacy/: legacy
    deprecated/: legacy
feedback:
  enabled: true
  db_path: ~/.cache/adg/feedback.json
  fp_downgrade_threshold: 0.6
  fp_min_reports: 5
output:
  default_format: human
  sarif_file: adg-results.sarif
  include_fix_hints: true
  include_explanations: true
performance:
  jobs: 4
  cache_enabled: true
  cache_dir: .cache/adg
  incremental: true
ci:
  mode: auto
  fail_on_error: true
  fail_on_warning: false
  trend_enabled: true
  trend_db: ~/.cache/adg/trend.db
notifications:
  webhook: ''
  on_new_errors: true
  on_trend_regression: true
lsp:
  enabled: true
  port: 0
marketplace:
  enabled: true
  rules_index: ~/.jcode/governance/rules_index.json
  auto_sync: true
  sync_interval_hours: 24
skip_patterns:
- '**/test_*.py'
- '**/*_test.py'
- '**/tests/**/*.py'
- '**/demo*.py'
- '**/*_demo.py'
- '**/demo-adg-workflow.py'
- 'examples/ai-growth-vscode/src/*.ts'
- 'examples/ai-growth-vscode/out/**'
- 'examples/ai-growth-slack/**'
