# .adg/config.yml — 薄覆盖层（thin override）
#
# 职责边界（唯一权威源）:
# - pyproject.toml [tool.adg] 是基础配置的唯一权威源（jobs / timeouts / exclude /
#   llm_provider / llm_model / openai_* 等 get_setting 消费键全部只在 pyproject）。
# - 本文件只保留被运行时"直接读取"的键（勿再往这里搬 pyproject 已有的值）:
#   1. skip_patterns   — tools/scripts/hooks/pre_push.py:42-46 直读。
#                        本文件是 skip_patterns 的唯一权威源；pyproject 中曾有的
#                        5 条历史副本无任何消费者，已随本次整合删除（并集未缩减，
#                        全部 9 条仍在本文件生效）。
#   2. domains         — tools/scripts/rules_engine/rule_loader.py:553,563 直读
#                        （按需加载 ai-dev-framework/domains/{domain}.yml 领域规则）。
#   3. context.markers — tools/scripts/rules_engine/context.py:159-161 直读
#                        （文件路径模式 → 角色映射，按 mtime 缓存）。
# - 已删除的历史死配置块（值均只在 pyproject 携带、无任何运行时读取方）:
#   project / language / architecture / frameworks / rules(severity_overrides +
#   custom_rules_file) / context.enabled+role_markers_file+role_severity /
#   feedback / output(sarif_file→pyproject 为 sarif_output) /
#   performance / ci(ci.mode→pyproject 为 ci_mode) / notifications / lsp /
#   marketplace / config_version。
# - 注意: app_config.get_settings() 仍会把本文件顶层键整体覆盖到 pyproject 之上
#   （同名顶层键 YAML 优先；env ADG_* 最高）。除非确实要覆盖 pyproject 值，
#   否则勿在此添加与 get_setting 消费键同名的顶层键。

skip_patterns:
- '**/test_*.py'
- '**/*_test.py'
- '**/tests/**/*.py'
- '**/demo*.py'
- '**/*_demo.py'
- '**/demo-adg-workflow.py'
- 'examples/ai-growth-vscode/src/*.ts'
- 'examples/ai-growth-vscode/out/**'
- 'examples/ai-growth-slack/**'

domains:
- finance
- hipaa
- gaming

context:
  markers:
    tests/: test
    test/: test
    __tests__/: test
    spec/: test
    '*_test.py': test
    test_*.py: test
    examples/: demo
    demo/: demo
    scripts/: prototype
    bin/: prototype
    tools/: prototype
    config/: config
    '*.config.js': config
    '*.yml': config
    '*.yaml': config
    '*.json': config
    Dockerfile: config
    legacy/: legacy
    deprecated/: legacy
