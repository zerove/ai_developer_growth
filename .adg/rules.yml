custom_rules:
- category: security
  fix_hint: Review function usage
  id: sec-001
  language: python
  message: Dangerous function call detected
  pattern: \b\w+\s*\([^)]*\)
  severity: error
- category: security
  fix_hint: Use subprocess.run() with shell=False
  id: sec-002
  language: python
  message: os.system() is vulnerable to command injection
  pattern: \bos\.system\s*\(
  severity: error
- category: security
  fix_hint: Use json or messagepack for serialization
  id: sec-003
  language: python
  message: pickle deserialization can be exploited
  pattern: import\s+pickle
  severity: warning
- category: security
  fix_hint: Use yaml.safe_load()
  id: sec-004
  language: python
  message: yaml.load() without Loader is unsafe
  pattern: yaml\.load\s*\([^)]*\)
  severity: warning
- category: security
  fix_hint: Use subprocess.run()
  id: sec-005
  language: python
  message: subprocess.call() should use shell=False
  pattern: subprocess\.call\s*\(
  severity: info
- category: security
  fix_hint: Avoid dynamic code execution
  id: sec-101
  language: javascript
  message: Function constructor is dangerous
  pattern: \bFunction\s*\(
  severity: error
- category: security
  fix_hint: Use textContent or sanitize input
  id: sec-102
  language: javascript
  message: innerHTML can lead to XSS
  pattern: \.innerHTML\s*=
  severity: warning
- category: security
  fix_hint: Use DOM manipulation methods
  id: sec-103
  language: javascript
  message: document.write() is dangerous
  pattern: document\.write\s*\(
  severity: warning
installed_packs:
- security-essentials

# ──────────────────────────────────────────────────────────
# Severity overrides: project-wide rule降级
# ──────────────────────────────────────────────────────────
# py-log-print: CLI 入口 (jcode_cli / hooks_runner / phase_runner / supply_runner
#   / rule_author / docker_build / etc.) 面向用户的格式化输出 (含 emoji/缩进)
#   是有意为之, 非内部日志; 内部库仍保留 loguru 风格
severity_overrides:
  py-log-print: info
  # common-empty-except-block: 54 个空 except 块分布在 27 个文件, 多为 OSError/
  # JSONDecodeError/ImportError 等"best effort" 模式 (文件/缓存/插件失败时
  # 静默兜底). 全面审计+修复需在 Phase 27 单独进行, 暂按已知模式降为 info.
  common-empty-except-block: info
  # py-no-input-validation: 40 个, 集中于 exception_manager (内部 helper)
  # 与 jcode_ai_native_workflow (本地 CLI 调用). 规则基于方法名/参数启发式
  # 误判率高, 暂按已知误报降为 info.
  py-no-input-validation: info
  # py-pip-audit-missing: 24 个, CI 已启用 pip-audit, 本地工具无强制依赖
  py-pip-audit-missing: info
  # py-test-sleep: 2 个, 测试内 sleep 用于等待异步/限流, 合法用法
  py-test-sleep: info
  # common-debugger: 4 个, pdb 调试器调用, 出现在测试/异常路径非阻塞
  common-debugger: info
