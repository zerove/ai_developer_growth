custom_rules:
- category: security
  fix_hint: Use ast.literal_eval() or specific functions
  id: sec-001
  language: python
  message: eval() executes arbitrary code
  pattern: \beval\s*\(
  severity: error
- category: security
  fix_hint: Avoid dynamic code execution
  id: sec-002
  language: python
  message: exec() executes arbitrary code
  pattern: \bexec\s*\(
  severity: error
- category: security
  fix_hint: Use subprocess.run() with shell=False
  id: sec-003
  language: python
  message: os.system() is vulnerable to command injection
  pattern: \bos\.system\s*\(
  severity: error
- category: security
  fix_hint: Use subprocess.Popen()
  id: sec-004
  language: python
  message: os.popen() is insecure
  pattern: \bos\.popen\s*\(
  severity: warning
- category: security
  fix_hint: Use json or messagepack for serialization
  id: sec-005
  language: python
  message: pickle deserialization can be exploited
  pattern: import\s+pickle
  severity: warning
- category: security
  fix_hint: Use yaml.safe_load()
  id: sec-006
  language: python
  message: yaml.load() without Loader is unsafe
  pattern: yaml\.load\s*\([^)]*\)
  severity: warning
- category: security
  fix_hint: Use subprocess.run()
  id: sec-007
  language: python
  message: subprocess.call() should use shell=False
  pattern: subprocess\.call\s*\(
  severity: info
- category: security
  fix_hint: Use JSON.parse() or specific functions
  id: sec-101
  language: javascript
  message: eval() executes arbitrary code
  pattern: \beval\s*\(
  severity: error
- category: security
  fix_hint: Avoid dynamic code execution
  id: sec-102
  language: javascript
  message: new Function() is equivalent to eval()
  pattern: \bnew\s+Function\s*\(
  severity: error
- category: security
  fix_hint: Use textContent or sanitize input
  id: sec-103
  language: javascript
  message: innerHTML can lead to XSS
  pattern: \.innerHTML\s*=
  severity: warning
- category: security
  fix_hint: Use DOM manipulation methods
  id: sec-104
  language: javascript
  message: document.write() is dangerous
  pattern: document\.write\s*\(
  severity: warning
installed_packs:
- security-essentials
