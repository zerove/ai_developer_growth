custom_rules:
- category: security
  fix_hint: Review function usage
  id: sec-001
  language: python
  message: Dangerous function call detected
  pattern: \b\w+\s*\([^)]*\)
  severity: error
- category: security
  fix_hint: Use subprocess.run() with shell=False
  id: sec-002
  language: python
  message: os.system() is vulnerable to command injection
  pattern: \bos\.system\s*\(
  severity: error
- category: security
  fix_hint: Use json or messagepack for serialization
  id: sec-003
  language: python
  message: pickle deserialization can be exploited
  pattern: import\s+pickle
  severity: warning
- category: security
  fix_hint: Use yaml.safe_load()
  id: sec-004
  language: python
  message: yaml.load() without Loader is unsafe
  pattern: yaml\.load\s*\([^)]*\)
  severity: warning
- category: security
  fix_hint: Use subprocess.run()
  id: sec-005
  language: python
  message: subprocess.call() should use shell=False
  pattern: subprocess\.call\s*\(
  severity: info
- category: security
  fix_hint: Avoid dynamic code execution
  id: sec-101
  language: javascript
  message: Function constructor is dangerous
  pattern: \bFunction\s*\(
  severity: error
- category: security
  fix_hint: Use textContent or sanitize input
  id: sec-102
  language: javascript
  message: innerHTML can lead to XSS
  pattern: \.innerHTML\s*=
  severity: warning
- category: security
  fix_hint: Use DOM manipulation methods
  id: sec-103
  language: javascript
  message: document.write() is dangerous
  pattern: document\.write\s*\(
  severity: warning
installed_packs:
- security-essentials

# ──────────────────────────────────────────────────────────
# Severity overrides: project-wide rule降级
# ──────────────────────────────────────────────────────────
# py-log-print: CLI 入口 (jcode_cli / hooks_runner / phase_runner / supply_runner
#   / rule_author / docker_build / etc.) 面向用户的格式化输出 (含 emoji/缩进)
#   是有意为之, 非内部日志; 内部库仍保留 loguru 风格
severity_overrides:
  py-log-print: info
  # common-empty-except-block: 54 个空 except 块分布在 27 个文件, 多为 OSError/
  # JSONDecodeError/ImportError 等"best effort" 模式 (文件/缓存/插件失败时
  # 静默兜底). 全面审计+修复需在 Phase 27 单独进行, 暂按已知模式降为 info.
  common-empty-except-block: info
  # py-no-input-validation: 40 个, 集中于 exception_manager (内部 helper)
  # 与 jcode_ai_native_workflow (本地 CLI 调用). 规则基于方法名/参数启发式
  # 误判率高, 暂按已知误报降为 info.
  py-no-input-validation: info
  # py-pip-audit-missing: 24 个, CI 已启用 pip-audit, 本地工具无强制依赖
  py-pip-audit-missing: info
  # py-test-sleep: 2 个, 测试内 sleep 用于等待异步/限流, 合法用法
  py-test-sleep: info
  # common-debugger: 4 个, pdb 调试器调用, 出现在测试/异常路径非阻塞
  common-debugger: info
  # common-weak-hash (2) / common-unsafe-yaml-load (2) / common-http-url (1):
  # 5 个 warning 全部位于 fix_heuristics.py / auto_fix.py / security_patterns.py
  # / supply_chain.py, 是 adg 规则数据库的元数据 (字符串字面量 / regex pattern
  # / XML namespace) 而非真实调用, 规则对元编程类代码误判率高, 降为 info.
  common-weak-hash: info
  common-unsafe-yaml-load: info
  common-http-url: info
  # py-missing-type-hints: 6 个, 全部位于 web_base.py / ast_parser.py /
  # plugins.py / semantic_rules.py 的 docstring Usage 块内的示例代码, 规则
  # 不识别 docstring 上下文. docstring 示例本来就无需类型注解 (会被 Python 当
  # 字符串忽略), 降为 info.
  py-missing-type-hints: info
  # py-any-type: 14 个, 集中于 dynamic import / plugin loader / 递归 converter
  # 模式 (_get_llm_client / _load_governance_auditor / safe_import / _fix_single_file
  # 等). 此类场景 Any 是合理选择, 用更窄类型需大量 Protocol 抽象, 暂按
  # 已知模式降为 info. 真正需要细化类型的位置 (如 _build_failure_testcase)
  # 留 Phase 27 case-by-case 处理.
  py-any-type: info
  # common-type-any: 5 个, 与 py-any-type 同类 (Python typing.Any 而非 TS any)
  # 集中于 report_generator.py 的 _build_*_testcase helpers. 这些 helper
  # 接受 dataclass / ad-hoc 对象 (有 .file/.language/.error_count 等属性),
  # 引入 Protocol 抽象的 ROI 低于其复杂度, 暂按已知模式降为 info.
  common-type-any: info
  # py-global-statement (5) + py-shared-mutable (4) = 9 个, 全部位于
  # 单进程 CLI 工具的缓存/注册表 (config/loader.py 2 / rules_engine/checker.py
  # worker initializer / plugins.py 1 / phase_runner.py 1 等). 这些场景:
  # - 进程内 load-once/use-many, 竞态风险低
  # - 已发版 + 3683 tests 通过, 重构引入的 bug 风险 > 保留的 global 风险
  # - 改造需类化/依赖注入, ROI 低
  # 暂按已知模式降为 info. Phase 27 可考虑选 1-2 个代表性位置做"示范改造".
  py-global-statement: info
  py-shared-mutable: info
  # py-n-plus-one: 25 个, 经 Phase 27 profile 验证全部为误报.
  # - supply_chain.py 6 (for k,v in deps.items(): Dependency(...)) - profile 100次
  #   parse_package_json 总耗时 0.050s, 80 deps 解析, 0 N+1 证据, O(n) 循环
  # - config/loader.py 5 (for k,v in tools.items(): ToolCategory(k)) - profile
  #   1000次 50 tools 转换 0.325ms/次, Enum 转换是主要成本, 0 N+1 证据
  # 规则启发式: 把 for k, v in dict.items() 循环内调用任意函数都标为 N+1
  # 实际场景: 依赖解析/配置转换, 非数据库/IO 多次查询
  py-n-plus-one: info
  # py-ci-disabled-check: 4 个命中全部在 tools/cicd/__init__.py 的 GitHub Actions
  #   YAML 模板字符串 (多行字面量) 中. "continue-on-error: true" 是有意设计:
  #   让 governance check 失败不阻塞后续 SARIF 上传/趋势记录步骤, 模板文档
  #   而非真实 CI 配置. 真实 CI 由 adg install-hooks 生成, 降为 info.
  py-ci-disabled-check: info
