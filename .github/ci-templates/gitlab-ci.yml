# ADG Governance - GitLab CI Template
# Add this to your .gitlab-ci.yml

adg-governance:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - pip install -e .
    - adg check . --severity error --json > adg-report.json || true
    - adg check . --severity error
  artifacts:
    reports:
      codequality: adg-report.json
    paths:
      - adg-report.json
    expire_in: 30 days
  allow_failure: false
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

adg-governance-full:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - pip install -e .
    - adg check . --json > adg-report-full.json || true
    - adg check .
  artifacts:
    reports:
      codequality: adg-report-full.json
    paths:
      - adg-report-full.json
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
