name: ADG Governance Check

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: adg-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ADG
        run: pip install -e .

      - name: Detect Language
        id: detect
        run: |
          LANG=$(adg detect tools/scripts --json | jq -r '.language')
          echo "language=$LANG" >> $GITHUB_OUTPUT

      # 已验证该命令会真实报错（对故意写坏的文件 exit 1 / 3 errors），
      # 当前 tools/scripts 在 warning 阈值下为 0 issue，因此可以恢复为真门禁。
      - name: Run ADG Check
        id: check
        run: adg check tools/scripts --lang ${{ steps.detect.outputs.language }} --severity warning --json > adg-report.json

      - name: Generate SARIF
        id: sarif
        run: adg check tools/scripts --lang ${{ steps.detect.outputs.language }} --severity warning --sarif > results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.sarif.outcome == 'success'
        with:
          sarif_file: results.sarif

      - name: Quality Gate
        if: steps.check.outcome == 'success'
        run: |
          ERRORS=$(cat adg-report.json | jq '.summary.error')
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Quality gate failed: $ERRORS errors found"
            exit 1
          fi
          echo "✅ Quality gate passed"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adg-governance-report
          path: adg-report.json
