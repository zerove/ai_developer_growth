name: "JCode Advanced Governance Pipeline"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      skip-supply-chain:
        description: "Skip supply chain analysis"
        type: boolean
        default: false
      skip-policy:
        description: "Skip policy evaluation"
        type: boolean
        default: false
      skip-dependency-graph:
        description: "Skip dependency graph analysis"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────
  # Setup - 复用于所有下游 job
  # ──────────────────────────────────────────────────────
  setup:
    uses: ./.github/workflows/jobs/setup.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Exception Manager - Check for expired exceptions
  # ──────────────────────────────────────────────────────
  check-exceptions:
    needs: setup
    uses: ./.github/workflows/jobs/exception-manager.yml
    with:
      action: "check-expirations"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # SBOM Generation (供后续 job 使用)
  # ──────────────────────────────────────────────────────
  sbom:
    needs: setup
    uses: ./.github/workflows/jobs/supply-chain.yml
    with:
      action: "sbom"
      format: "json"
      output: "sbom.json"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Dependency Graph Analysis (并行)
  # ──────────────────────────────────────────────────────
  dep-graph-analyze:
    if: github.event.inputs.skip-dependency-graph != 'true'
    needs: [setup, sbom]
    uses: ./.github/workflows/jobs/dependency-graph.yml
    with:
      action: "analyze"
      sbom-path: "sbom.json"
      format: "json"
      output: "dep-graph-analysis.json"
    secrets: inherit

  dep-graph-circular:
    if: github.event.inputs.skip-dependency-graph != 'true'
    needs: [setup, sbom]
    uses: ./.github/workflows/jobs/dependency-graph.yml
    with:
      action: "circular"
      sbom-path: "sbom.json"
      format: "json"
      output: "dep-graph-circular.json"
    secrets: inherit

  dep-graph-conflicts:
    if: github.event.inputs.skip-dependency-graph != 'true'
    needs: [setup, sbom]
    uses: ./.github/workflows/jobs/dependency-graph.yml
    with:
      action: "conflicts"
      sbom-path: "sbom.json"
      format: "json"
      output: "dep-graph-conflicts.json"
    secrets: inherit

  dep-graph-export-mermaid:
    if: github.event.inputs.skip-dependency-graph != 'true'
    needs: [setup, sbom]
    uses: ./.github/workflows/jobs/dependency-graph.yml
    with:
      action: "export"
      sbom-path: "sbom.json"
      format: "mermaid"
      output: "dep-graph.mmd"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Multi-language Supply Chain (并行)
  # ──────────────────────────────────────────────────────
  supply-chain-scan:
    if: github.event.inputs.skip-supply-chain != 'true'
    needs: setup
    uses: ./.github/workflows/jobs/supply-chain.yml
    with:
      action: "scan"
      format: "json"
      output: "supply-chain-scan.json"
    secrets: inherit

  supply-chain-compliance:
    if: github.event.inputs.skip-supply-chain != 'true'
    needs: setup
    uses: ./.github/workflows/jobs/supply-chain.yml
    with:
      action: "compliance"
      format: "json"
      output: "supply-chain-compliance.json"
      policy-file: ".jcode/policies/supply-chain-policy.yaml"
    secrets: inherit

  supply-chain-freshness:
    if: github.event.inputs.skip-supply-chain != 'true'
    needs: setup
    uses: ./.github/workflows/jobs/supply-chain.yml
    with:
      action: "freshness"
      max-age-days: "90"
      format: "json"
      output: "supply-chain-freshness.json"
    secrets: inherit

  supply-chain-verify:
    if: github.event.inputs.skip-supply-chain != 'true'
    needs: setup
    uses: ./.github/workflows/jobs/supply-chain.yml
    with:
      action: "verify"
      format: "json"
      output: "supply-chain-verify.json"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Policy as Code (OPA/Rego)
  # ──────────────────────────────────────────────────────
  policy-eval:
    if: github.event.inputs.skip-policy != 'true'
    needs: [setup, sbom, dep-graph-analyze, supply-chain-scan, check-exceptions]
    uses: ./.github/workflows/jobs/policy-as-code.yml
    with:
      action: "eval"
      policy-dir: ".jcode/policies"
      input-data: ""
      output-format: "json"
      fail-on-violation: true
      bundles: ""
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Existing Jobs (保持原有)
  # ──────────────────────────────────────────────────────
  adg-governance:
    needs: setup
    uses: ./.github/workflows/jobs/adg-governance.yml
    secrets: inherit

  governance-audit:
    needs: setup
    uses: ./.github/workflows/jobs/governance-audit.yml
    with:
      languages: "python,typescript,javascript,go,rust,java,cpp,csharp,ruby,php"
      timeout-minutes: 20
    secrets: inherit

  pre-commit:
    needs: setup
    uses: ./.github/workflows/jobs/pre-commit.yml
    secrets: inherit

  lint:
    needs: setup
    uses: ./.github/workflows/jobs/lint.yml
    secrets: inherit

  type-check:
    needs: setup
    uses: ./.github/workflows/jobs/type-check.yml
    secrets: inherit

  test-311:
    needs: setup
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
    secrets: inherit

  test-312:
    needs: setup
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.12"
    secrets: inherit

  test-313:
    needs: setup
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.13"
    secrets: inherit

  test-sharded-1:
    needs: setup
    if: github.repository == 'zerove/ai_developer_growth'
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
      shard: "1"
    secrets: inherit

  test-sharded-2:
    needs: setup
    if: github.repository == 'zerove/ai_developer_growth'
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
      shard: "2"
    secrets: inherit

  test-sharded-3:
    needs: setup
    if: github.repository == 'zerove/ai_developer_growth'
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
      shard: "3"
    secrets: inherit

  test-sharded-4:
    needs: setup
    if: github.repository == 'zerove/ai_developer_growth'
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
      shard: "4"
    secrets: inherit

  combine-coverage:
    needs: [test-311, test-312, test-313, test-sharded-1, test-sharded-2, test-sharded-3, test-sharded-4]
    uses: ./.github/workflows/jobs/combine-coverage.yml
    secrets: inherit

  quality-gates:
    needs: setup
    uses: ./.github/workflows/jobs/quality-gates.yml
    secrets: inherit

  security:
    needs: setup
    uses: ./.github/workflows/jobs/security.yml
    secrets: inherit

  secret-scan:
    needs: setup
    uses: ./.github/workflows/jobs/secret-scan.yml
    secrets: inherit

  license-scan:
    needs: setup
    uses: ./.github/workflows/jobs/license-scan.yml
    secrets: inherit

  test-examples:
    needs: setup
    uses: ./.github/workflows/jobs/example-tests.yml
    secrets: inherit

  dependency-review:
    needs: setup
    uses: ./.github/workflows/jobs/dependency-review.yml
    secrets: inherit

  docs-check:
    needs: setup
    uses: ./.github/workflows/jobs/docs.yml
    secrets: inherit

  agent-validation:
    needs: setup
    uses: ./.github/workflows/jobs/agent-validation.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # CI Summary
  # ──────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: [
      setup, check-exceptions, sbom,
      dep-graph-analyze, dep-graph-circular, dep-graph-conflicts, dep-graph-export-mermaid,
      supply-chain-scan, supply-chain-compliance, supply-chain-freshness, supply-chain-verify,
      policy-eval,
      adg-governance, governance-audit, pre-commit, lint, type-check,
      test-311, test-312, test-313,
      test-sharded-1, test-sharded-2, test-sharded-3, test-sharded-4,
      combine-coverage, quality-gates, security, secret-scan, license-scan,
      test-examples, dependency-review, docs-check, agent-validation
    ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: CI Complete
        run: |
          echo "✅ All CI jobs completed"
          echo "Check individual job statuses above"
          echo ""
          echo "=== New Phase 2 Jobs ==="
          echo "Exception Manager: check-exceptions"
          echo "Dependency Graph: dep-graph-analyze, dep-graph-circular, dep-graph-conflicts, dep-graph-export-mermaid"
          echo "Supply Chain: supply-chain-scan, supply-chain-compliance, supply-chain-freshness, supply-chain-verify"
          echo "Policy as Code: policy-eval"
