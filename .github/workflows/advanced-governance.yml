name: "JCode Advanced Governance Pipeline"

on:
  workflow_dispatch:
    inputs:
      skip-supply-chain:
        description: "Skip supply chain analysis"
        type: boolean
        default: false
      skip-policy:
        description: "Skip policy evaluation"
        type: boolean
        default: false
      skip-dependency-graph:
        description: "Skip dependency graph analysis"
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 03:00 UTC (after mutation-testing)

concurrency:
  group: advanced-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  # Exception Manager - Check for expired exceptions
  # ──────────────────────────────────────────────────────
  check-exceptions:
    uses: ./.github/workflows/jobs-exception-manager.yml
    with:
      action: "check-expirations"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # SBOM Generation (供后续 job 使用)
  # ──────────────────────────────────────────────────────
  sbom:
    uses: ./.github/workflows/jobs-supply-chain.yml
    with:
      action: "sbom"
      format: "json"
      output: "sbom.json"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Dependency Graph Analysis (并行)
  # ──────────────────────────────────────────────────────
  dep-graph-analyze:
    if: github.event.inputs.skip-dependency-graph != 'true'
    needs: sbom
    uses: ./.github/workflows/jobs-dependency-graph.yml
    with:
      action: "analyze"
      sbom-path: "sbom.json"
      format: "json"
      output: "dep-graph-analysis.json"
    secrets: inherit

  dep-graph-circular:
    if: github.event.inputs.skip-dependency-graph != 'true'
    needs: sbom
    uses: ./.github/workflows/jobs-dependency-graph.yml
    with:
      action: "circular"
      sbom-path: "sbom.json"
      format: "json"
      output: "dep-graph-circular.json"
    secrets: inherit

  dep-graph-conflicts:
    if: github.event.inputs.skip-dependency-graph != 'true'
    needs: sbom
    uses: ./.github/workflows/jobs-dependency-graph.yml
    with:
      action: "conflicts"
      sbom-path: "sbom.json"
      format: "json"
      output: "dep-graph-conflicts.json"
    secrets: inherit

  dep-graph-export-mermaid:
    if: github.event.inputs.skip-dependency-graph != 'true'
    needs: sbom
    uses: ./.github/workflows/jobs-dependency-graph.yml
    with:
      action: "export"
      sbom-path: "sbom.json"
      format: "mermaid"
      output: "dep-graph.mmd"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Multi-language Supply Chain (并行)
  # ──────────────────────────────────────────────────────
  supply-chain-scan:
    if: github.event.inputs.skip-supply-chain != 'true'
    uses: ./.github/workflows/jobs-supply-chain.yml
    with:
      action: "scan"
      format: "json"
      output: "supply-chain-scan.json"
    secrets: inherit

  supply-chain-compliance:
    if: github.event.inputs.skip-supply-chain != 'true'
    uses: ./.github/workflows/jobs-supply-chain.yml
    with:
      action: "compliance"
      format: "json"
      output: "supply-chain-compliance.json"
      policy-file: ".jcode/policies/supply-chain-policy.yaml"
    secrets: inherit

  supply-chain-freshness:
    if: github.event.inputs.skip-supply-chain != 'true'
    uses: ./.github/workflows/jobs-supply-chain.yml
    with:
      action: "freshness"
      max-age-days: "90"
      format: "json"
      output: "supply-chain-freshness.json"
    secrets: inherit

  supply-chain-verify:
    if: github.event.inputs.skip-supply-chain != 'true'
    uses: ./.github/workflows/jobs-supply-chain.yml
    with:
      action: "verify"
      format: "json"
      output: "supply-chain-verify.json"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Policy as Code (OPA/Rego)
  # ──────────────────────────────────────────────────────
  policy-eval:
    if: github.event.inputs.skip-policy != 'true'
    needs: [sbom, dep-graph-analyze, supply-chain-scan, check-exceptions]
    uses: ./.github/workflows/jobs-policy-as-code.yml
    with:
      action: "eval"
      policy-dir: ".jcode/policies"
      input-data: ""
      output-format: "json"
      fail-on-violation: true
      bundles: ""
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Advanced Governance Summary
  # ──────────────────────────────────────────────────────
  advanced-summary:
    name: Advanced Governance Summary
    needs: [
      check-exceptions, sbom,
      dep-graph-analyze, dep-graph-circular, dep-graph-conflicts, dep-graph-export-mermaid,
      supply-chain-scan, supply-chain-compliance, supply-chain-freshness, supply-chain-verify,
      policy-eval
    ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Advanced Governance Complete
        run: |
          echo "✅ Advanced Governance Pipeline completed"
          echo "Check individual job statuses above"
          echo ""
          echo "=== Phase 2 Jobs ==="
          echo "Exception Manager: check-exceptions"
          echo "SBOM: sbom"
          echo "Dependency Graph: dep-graph-analyze, dep-graph-circular, dep-graph-conflicts, dep-graph-export-mermaid"
          echo "Supply Chain: supply-chain-scan, supply-chain-compliance, supply-chain-freshness, supply-chain-verify"
          echo "Policy as Code: policy-eval"