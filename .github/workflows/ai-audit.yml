name: AI-Context-Sync Audit + Agent Dev Quality Gates

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Gate 2: Code Quality Checks
  # ──────────────────────────────────────────────────────────────
  gate2-code-quality:
    name: "Gate 2: Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check no unwrap/expect in production code
        run: |
          echo "=== Gate 2.1: No unwrap() in production code ==="
          MATCHES=$(grep -rn "unwrap()" src/ --include="*.py" --include="*.rs" --include="*.ts" --include="*.js" 2>/dev/null | grep -v test | grep -v "# " || true)
          if [ -n "$MATCHES" ]; then
            echo "FAIL: Found unwrap() in production code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "PASS: No unwrap() found"

      - name: Check no expect in production code
        run: |
          echo "=== Gate 2.2: No expect() in production code ==="
          MATCHES=$(grep -rn "\.expect(" src/ --include="*.py" --include="*.rs" --include="*.ts" --include="*.js" 2>/dev/null | grep -v test | grep -v "# " || true)
          if [ -n "$MATCHES" ]; then
            echo "FAIL: Found expect() in production code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "PASS: No expect() found"

      - name: Check file size limits
        run: |
          echo "=== Gate 2.6: File size < 300 lines ==="
          OVERSIZED=$(find src/ -type f \( -name "*.py" -o -name "*.rs" -o -name "*.ts" -o -name "*.js" \) -exec wc -l {} + 2>/dev/null | awk '$1 > 300 && !/total$/ {print}' || true)
          if [ -n "$OVERSIZED" ]; then
            echo "WARN: Files exceeding 300 lines:"
            echo "$OVERSIZED"
            # Soft warning for now, not blocking
          fi
          echo "PASS: File size check complete"

  # ──────────────────────────────────────────────────────────────
  # Gate 3: Automated Audit
  # ──────────────────────────────────────────────────────────────
  gate3-automated-audit:
    name: "Gate 3: Automated Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install typer unidiff watchdog pytest ruff
          pip install -e .

      - name: Run AI Audit (strict mode)
        env:
          AI_SYNC_KEY: ${{ secrets.AI_SYNC_KEY }}
        run: |
          echo "=== Gate 3.3: AI Audit ==="
          cd examples/ai-context-sync
          python3 -m src.cli audit --strict --config .ai-sync.json

      - name: Run unit tests
        run: |
          echo "=== Gate 3.4: Unit Tests ==="
          cd examples/ai-context-sync
          python -m pytest tests/ -v --tb=short
          echo "Tests complete"

      - name: Run linting (ruff)
        run: |
          echo "=== Gate 3.5: Linting ==="
          ruff check src/ || true
          echo "Lint check complete"

      - name: Verify CONTEXT.md exists and is current
        run: |
          echo "=== Gate 4.1: CONTEXT.md check ==="
          if [ ! -f CONTEXT.md ]; then
            echo "FAIL: CONTEXT.md not found"
            exit 1
          fi
          MODIFIED=$(stat -c %Y CONTEXT.md 2>/dev/null || stat -f %m CONTEXT.md 2>/dev/null)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - MODIFIED) / 86400 ))
          if [ "$AGE_DAYS" -gt 30 ]; then
            echo "WARN: CONTEXT.md is $AGE_DAYS days old, consider updating"
          fi
          echo "PASS: CONTEXT.md exists (last modified $AGE_DAYS days ago)"

      - name: Verify agent definitions exist
        run: |
          echo "=== Gate 4.3: AGENTS.md check ==="
          if [ -f AGENTS.md ]; then
            echo "PASS: AGENTS.md exists"
          else
            echo "INFO: AGENTS.md not found (optional but recommended)"
          fi
