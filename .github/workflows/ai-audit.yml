name: AI-Context-Sync Audit + Agent Dev Quality Gates

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Gate 2: Code Quality Checks
  # ──────────────────────────────────────────────────────────────
  gate2-code-quality:
    name: "Gate 2: Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check no unwrap/expect in production code
        run: |
          echo "=== Gate 2.1: No unwrap() in production code ==="
          MATCHES=$(grep -rn "unwrap()" examples/ai-context-sync/src/ --include="*.py" 2>/dev/null | grep -v test | grep -v "# " || true)
          if [ -n "$MATCHES" ]; then
            echo "FAIL: Found unwrap() in production code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "PASS: No unwrap() found"

      - name: Check no expect in production code
        run: |
          echo "=== Gate 2.2: No expect() in production code ==="
          MATCHES=$(grep -rn "\.expect(" examples/ai-context-sync/src/ --include="*.py" 2>/dev/null | grep -v test | grep -v "# " || true)
          if [ -n "$MATCHES" ]; then
            echo "FAIL: Found expect() in production code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "PASS: No expect() found"

      - name: Check no as any / ts-ignore
        run: |
          echo "=== Gate 2.3: No type suppression ==="
          TS_MATCHES=$(grep -rn "as any\|@ts-ignore\|@ts-expect-error" examples/ --include="*.ts" --include="*.tsx" --include="*.js" 2>/dev/null | grep -v test | grep -v node_modules || true)
          if [ -n "$TS_MATCHES" ]; then
            echo "FAIL: Found type suppression in production code:"
            echo "$TS_MATCHES"
            exit 1
          fi
          echo "PASS: No type suppression found"

      - name: Check file size limits
        run: |
          echo "=== Gate 2.6: File size < 300 lines ==="
          OVERSIZED=$(find examples/ai-context-sync/src/ -type f -name "*.py" -exec wc -l {} + 2>/dev/null | awk '$1 > 300 && !/total$/ {print}' || true)
          if [ -n "$OVERSIZED" ]; then
            echo "WARN: Files exceeding 300 lines:"
            echo "$OVERSIZED"
            # Soft warning for now, not blocking
          fi
          echo "PASS: File size check complete"

  # ──────────────────────────────────────────────────────────────
  # Gate 3: Automated Audit
  # ──────────────────────────────────────────────────────────────
  gate3-automated-audit:
    name: "Gate 3: Automated Audit"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            examples/ai-context-sync/requirements.txt

      - name: Install root dependencies
        run: |
          pip install -r requirements.txt

      - name: Install ai-context-sync dependencies
        run: |
          cd examples/ai-context-sync
          pip install -r requirements.txt

      - name: Run AI Audit (strict mode)
        env:
          AI_SYNC_KEY: ${{ secrets.AI_SYNC_KEY }}
        run: |
          echo "=== Gate 3.3: AI Audit ==="
          cd examples/ai-context-sync
          python3 -m src.cli audit --strict --config .ai-sync.json

      - name: Run ai-context-sync unit tests
        run: |
          echo "=== Gate 3.4: ai-context-sync Tests ==="
          cd examples/ai-context-sync
          python -m pytest tests/ -v --tb=short
          echo "ai-context-sync tests complete"

      - name: Check test coverage (≥70%)
        run: |
          echo "=== Gate 3.4b: Coverage Enforcement ==="
          cd examples/ai-context-sync
          python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=70 --tb=short
          echo "Coverage check complete"

      - name: Run self-correction-loop tests
        run: |
          echo "=== Gate 3.4c: self-correction-loop Tests ==="
          cd examples/self-correction-loop
          PYTHONPATH=src python -m pytest tests/ -v --tb=short
          echo "self-correction-loop tests complete"

      - name: Run multi-agent-orch tests
        run: |
          echo "=== Gate 3.4d: multi-agent-orch Tests ==="
          cd examples/multi-agent-orch
          PYTHONPATH=src python -m pytest tests/ -v --tb=short
          echo "multi-agent-orch tests complete"

      - name: Run root-level tests
        run: |
          echo "=== Gate 3.5: Root Tests ==="
          python -m pytest tests/ -v --tb=short
          echo "Root tests complete"

      - name: Run linting (ruff)
        run: |
          echo "=== Gate 3.6: Linting ==="
          ruff check src/ tools/ tests/ examples/ai-context-sync/src/ examples/self-correction-loop/src/ examples/multi-agent-orch/src/ --exit-non-zero-on-fix
          echo "Lint check complete"

      - name: Verify CONTEXT.md exists and is current
        run: |
          echo "=== Gate 4.1: CONTEXT.md check ==="
          if [ ! -f CONTEXT.md ]; then
            echo "FAIL: CONTEXT.md not found"
            exit 1
          fi
          MODIFIED=$(stat -c %Y CONTEXT.md 2>/dev/null || stat -f %m CONTEXT.md 2>/dev/null)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - MODIFIED) / 86400 ))
          if [ "$AGE_DAYS" -gt 30 ]; then
            echo "WARN: CONTEXT.md is $AGE_DAYS days old, consider updating"
          fi
          echo "PASS: CONTEXT.md exists (last modified $AGE_DAYS days ago)"

      - name: Verify AGENTS.md exists
        run: |
          echo "=== Gate 4.3: AGENTS.md check ==="
          if [ -f AGENTS.md ]; then
            echo "PASS: AGENTS.md exists"
          else
            echo "FAIL: AGENTS.md not found (required by CLAUDE.md)"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────
  # Gate 4: Case Study Validation
  # ──────────────────────────────────────────────────────────────
  gate4-case-study-validation:
    name: "Gate 4: Case Study Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            tools/scripts/validate_case_study.py

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate all case studies
        run: |
          echo "=== Gate 4: Case Study Validation ==="
          python tools/scripts/validate_case_study.py --all --strict
