name: AI-Native SDLC Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ai-native-sdlc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-native-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 完整历史: 本作业会跑完整 pytest 套件, test_release 依赖 git log 条数与既有 tag。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: python -m pytest tests/ -q

      - name: Build Semantic Code Knowledge Graph
        run: python -m tools.scripts.jcode_cross_platform_runner semantic-graph

      - name: Run Architecture Drift Guard
        run: python -m tools.scripts.jcode_cross_platform_runner architecture-guard

      - name: Collect Metrics Telemetry
        run: python -m tools.scripts.jcode_cross_platform_runner metrics-telemetry

      - name: Run Master AI-Native Workflow Pipeline
        run: python -m tools.scripts.jcode_cross_platform_runner workflow-ai-native
