name: AI-Native SDLC Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  ai-native-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
          pip install -e .
          pip install -r requirements-dev.txt || true

      - name: Run Unit Tests
        run: python -m pytest tests/ -q

      - name: Build Semantic Code Knowledge Graph
        run: python tools/scripts/jcode_cross_platform_runner.py semantic-graph

      - name: Run Architecture Drift Guard
        run: python tools/scripts/jcode_cross_platform_runner.py architecture-guard

      - name: Collect Metrics Telemetry
        run: python tools/scripts/jcode_cross_platform_runner.py metrics-telemetry

      - name: Run Master AI-Native Workflow Pipeline
        run: python tools/scripts/jcode_cross_platform_runner.py workflow-ai-native
