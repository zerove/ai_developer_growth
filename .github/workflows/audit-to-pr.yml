name: Governance Audit to PR

on:
  schedule:
    # 每周一 10:00 UTC 运行（在 scheduled-governance 之后）
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      create_pr:
        description: "是否创建 PR"
        required: true
        default: "true"
        type: boolean
  workflow_run:
    workflows: ["Scheduled Governance Audit"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit-to-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-pr:
    name: 'Run Audit & Create PR'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # 必须装齐测试相关 extras: 本步骤跑的是 **完整** pytest 套件
          # (`audit_to_pr -> governance-audit -> pytest`), base deps 只有
          # pyyaml/loguru → 5 个测试模块在 collection 阶段即 ModuleNotFoundError
          # → 整轮审计失败(exit 1)。与 jobs-governance-audit.yml 口径对齐。
          pip install -e ".[dev-core,dev-semantic,search,dev-integration]"
          pip install ruff mypy pytest pytest-cov pyyaml bandit pip-audit

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 'Run Governance Audit & Create PR'
        if: github.event.inputs.create_pr == 'true' || github.event.schedule != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/audit_to_pr.py --run-audit --create-pr --title "chore: weekly governance audit report"

      - name: Run Quick Audit (without PR)
        if: github.event.inputs.create_pr == 'false'
        run: |
          python tools/scripts/audit_to_pr.py --run-audit --no-full --output governance-report.md

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-audit-report
          path: |
            governance-report.md
            *.json
