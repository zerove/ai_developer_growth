name: Case Study Validation & Auto-Triage

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, master]
    paths:
      - "case-studies/**"
      - ".github/workflows/case-study-validation.yml"
      - "tools/scripts/validate_case_study.py"
      - "tools/scripts/create_case_study.py"

jobs:
  validate-case-study:
    name: "Validate Case Study"
    runs-on: ubuntu-latest
    if: github.event.pull_request.labels.*.name contains 'case-study'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Find case study directories
        id: find-cases
        run: |
          # Find new/modified case study directories
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} -- "case-studies/*/README.md" | sed 's|/README.md||' | sort -u)
          echo "changed_cases<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed cases: $CHANGED"

      - name: Validate each case study
        if: steps.find-cases.outputs.changed_cases != ''
        run: |
          for case in ${{ steps.find-cases.outputs.changed_cases }}; do
            if [ -d "$case" ]; then
              echo "::group::Validating $case"
              python tools/scripts/validate_case_study.py "$case" || {
                echo "::error file=$case/README.md::Case study validation failed"
                exit 1
              }
              echo "::endgroup::"
            fi
          done

      - name: Check efficiency data consistency
        if: steps.find-cases.outputs.changed_cases != ''
        run: |
          for case in ${{ steps.find-cases.outputs.changed_cases }}; do
            if [ -d "$case" ]; then
              echo "Checking efficiency data in $case"
              python -c "
import re
content = open('$case/README.md').read()
# Verify efficiency table has total row
if '| **总计**' not in content and '| 总计 ' not in content:
    print('::warning file=$case/README.md::Missing 总计 row in efficiency table')
# Verify boost calculations
table_match = re.search(r'\| 阶段 \| 传统.*?\|(.*?)\n\n', content, re.DOTALL)
if table_match:
    print('Efficiency table found')
"
            fi
          done

  auto-label:
    name: "Auto Label & Triage"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-label case study PRs
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      - name: Check case study completeness
        if: github.event.pull_request.labels.*.name contains 'case-study'
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          # Check title format
          if [[ ! "$PR_TITLE" =~ ^\[Case\ Study\] ]]; then
            echo "::warning::PR title should start with '[Case Study] '"
          fi
          
          # Check for draft PR
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "PR is draft, skipping full review"
            exit 0
          fi
          
          echo "Case study PR detected: $PR_TITLE"

  notify-reviewers:
    name: "Notify Reviewers"
    runs-on: ubuntu-latest
    needs: [validate-case-study, auto-label]
    if: always() && github.event.pull_request.labels.*.name contains 'case-study'
    steps:
      - name: Check validation result
        if: needs.validate-case-study.result == 'failure'
        run: |
          echo "::error::Case study validation failed. Please check the workflow logs."
          exit 1
      
      - name: Post review reminder
        if: needs.validate-case-study.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `## ✅ Case Study PR Ready for Review
              
              **Automated checks passed:**
              - ✅ Structure validation
              - ✅ Efficiency table format
              - ✅ Required sections present
              - ✅ Wikilinks verified
              
              **Next steps for reviewers:**
              1. Verify efficiency data authenticity (Git commits / timing records)
              2. Check AI collaboration process specificity
              3. Validate key insights reusability
              4. Confirm applicability tags
              5. Update label: \`needs-review\` → \`in-review\` → \`approved\` or \`needs-revision\`
              
              /assign @${{ github.actor }} /label \`in-review\``
            });

  update-index-on-merge:
    name: "Update INDEX.md on Merge"
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.labels.*.name contains 'case-study'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Extract case study info
        id: extract
        run: |
          # Find the case study directory from PR
          CASE_DIR=$(git diff --name-only HEAD^..HEAD -- "case-studies/*/README.md" | head -1 | cut -d'/' -f1,2)
          if [ -z "$CASE_DIR" ]; then
            echo "No case study found in this PR"
            exit 0
          fi
          
          echo "case_dir=$CASE_DIR" >> $GITHUB_OUTPUT
          
          # Extract metadata from README
          TITLE=$(grep -m1 '^# ' "$CASE_DIR/README.md" | sed 's/^# //')
          EFFICIENCY=$(grep -A1 '效率提升' "$CASE_DIR/README.md" | tail -1 | sed -E 's/.*\| *([^|]+) *\|.*/\1/')
          TOOLS=$(grep -A1 'AI 工具栈' "$CASE_DIR/README.md" | tail -1 | sed -E 's/.*\| *([^|]+) *\|.*/\1/')
          
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "efficiency=$EFFICIENCY" >> $GITHUB_OUTPUT
          echo "tools=$TOOLS" >> $GITHUB_OUTPUT

      - name: Update INDEX.md
        if: steps.extract.outputs.case_dir != ''
        run: |
          CASE_DIR="${{ steps.extract.outputs.case_dir }}"
          TITLE="${{ steps.extract.outputs.title }}"
          EFFICIENCY="${{ steps.extract.outputs.efficiency }}"
          TOOLS="${{ steps.extract.outputs.tools }}"
          
          # Create the new row
          NEW_ROW="| [[${CASE_DIR}/README.md|${TITLE}]] | ${TITLE} | ${EFFICIENCY} | ${TOOLS} |"
          
          # Check if already exists in INDEX.md
          if grep -q "${TITLE}" INDEX.md; then
            echo "Case already in INDEX.md, skipping"
          else
            # Find the case studies table and insert new row before the closing ---
            # Look for the last row before the closing ---
            sed -i "/^| \\[\\\[.*case-studies.*\\]\]/ { N; /\\n|---/! s/\\n/\\n${NEW_ROW}\\n/; }" INDEX.md
            echo "Added to INDEX.md: $NEW_ROW"
          fi
          
          # Also update MOC.md coverage count
          CASE_COUNT=$(find case-studies -name "README.md" | wc -l)
          sed -i "s/| 案例库 | [0-9]* |/| 案例库 | ${CASE_COUNT} |/" MOC.md
          sed -i "s/| 案例库 | [0-9]* |/| 案例库 | ${CASE_COUNT} |/" INDEX.md
          
          git add INDEX.md MOC.md
          git commit -m "docs: auto-update case study index - ${TITLE}"
          git push

      - name: Create release note
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `🎉 **Case Study Merged!**
              
              The case study has been automatically added to:
              - \`INDEX.md\` (knowledge map)
              - \`MOC.md\` (coverage stats updated)
              
              Thank you for contributing to the AI Developer Growth knowledge base! 📚`
            });