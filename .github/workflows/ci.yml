name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - 'docs/case-studies/**'
      - '*.md'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - 'docs/case-studies/**'
      - '*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────
  # 基础设置 - 复用于所有下游 job
  # ──────────────────────────────────────────────────────
  setup:
    uses: ./.github/workflows/jobs/setup.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # ADG Governance Check
  # ──────────────────────────────────────────────────────
  adg-governance:
    needs: setup
    uses: ./.github/workflows/jobs/adg-governance.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Governance Audit (完整审计：lint + typecheck + test + security + governance-docs + AI-SDLC + AI质量门禁)
  # ──────────────────────────────────────────────────────
  governance-audit:
    needs: setup
    uses: ./.github/workflows/jobs/governance-audit.yml
    with:
      languages: "python,shell"
      timeout-minutes: 20
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Pre-commit
  # ──────────────────────────────────────────────────────
  pre-commit:
    needs: setup
    uses: ./.github/workflows/jobs/pre-commit.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Gate Doctor (跨平台环境自检 + 基线防篡改 + 台账完整性)
  # ──────────────────────────────────────────────────────
  doctor-gate:
    needs: setup
    uses: ./.github/workflows/jobs/doctor-gate.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Lint & Type Check (并行)
  # ──────────────────────────────────────────────────────
  lint:
    needs: setup
    uses: ./.github/workflows/jobs/lint.yml
    secrets: inherit

  type-check:
    needs: setup
    uses: ./.github/workflows/jobs/type-check.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Tests - 矩阵并行
  # ──────────────────────────────────────────────────────
  test-311:
    needs: setup
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
    secrets: inherit

  test-312:
    needs: setup
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.12"
    secrets: inherit

  test-313:
    needs: setup
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.13"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Test Sharding (仅主仓库)
  # ──────────────────────────────────────────────────────
  test-sharded-1:
    needs: setup
    if: github.repository == 'zerove/ai_developer_growth'
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
      shard: "1"
    secrets: inherit

  test-sharded-2:
    needs: setup
    if: github.repository == 'zerove/ai_developer_growth'
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
      shard: "2"
    secrets: inherit

  test-sharded-3:
    needs: setup
    if: github.repository == 'zerove/ai_developer_growth'
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
      shard: "3"
    secrets: inherit

  test-sharded-4:
    needs: setup
    if: github.repository == 'zerove/ai_developer_growth'
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
      shard: "4"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Combine Coverage
  # ──────────────────────────────────────────────────────
  combine-coverage:
    needs: [test-311, test-312, test-313, test-sharded-1, test-sharded-2, test-sharded-3, test-sharded-4]
    uses: ./.github/workflows/jobs/combine-coverage.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Quality Gates
  # ──────────────────────────────────────────────────────
  quality-gates:
    needs: setup
    uses: ./.github/workflows/jobs/quality-gates.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────────────
  security:
    needs: setup
    uses: ./.github/workflows/jobs/security.yml
    secrets: inherit

  secret-scan:
    needs: setup
    uses: ./.github/workflows/jobs/secret-scan.yml
    secrets: inherit

  sbom:
    needs: setup
    uses: ./.github/workflows/jobs/sbom.yml
    secrets: inherit

  license-scan:
    needs: setup
    uses: ./.github/workflows/jobs/license-scan.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Example Tests (并行矩阵)
  # ──────────────────────────────────────────────────────
  test-examples:
    needs: setup
    uses: ./.github/workflows/jobs/example-tests.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Dependency Review
  # ──────────────────────────────────────────────────────
  dependency-review:
    needs: setup
    uses: ./.github/workflows/jobs/dependency-review.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Docs
  # ──────────────────────────────────────────────────────
  docs-check:
    needs: setup
    uses: ./.github/workflows/jobs/docs.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Agent Validation
  # ──────────────────────────────────────────────────────
  agent-validation:
    needs: setup
    uses: ./.github/workflows/jobs/agent-validation.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # 最终汇总
  # ──────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: [adg-governance, governance-audit, pre-commit, lint, type-check, test-311, test-312, test-313, test-sharded-1, test-sharded-2, test-sharded-3, test-sharded-4, combine-coverage, quality-gates, security, secret-scan, sbom, license-scan, test-examples, dependency-review, docs-check, agent-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: CI Complete
        run: |
          echo "✅ All CI jobs completed"
          echo "Check individual job statuses above"
