name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main, master, develop]
    # 刻意不设 paths-ignore: 分支保护把 "CI Summary" 设为必需检查, 而 paths
    # 过滤会让纯文档 PR 根本不触发本工作流 → 该检查永远等不到结果, PR 卡死
    # 在 "Expected — Waiting for status to be reported"。push 侧保留过滤,
    # 避免文档合并后重复跑一遍完整矩阵。
  schedule:
    # nightly full: 覆盖全矩阵与完整门禁（UTC 02:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  # ADG Governance Check
  # ──────────────────────────────────────────────────────
  adg-governance:
    uses: ./.github/workflows/jobs-adg-governance.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Governance Audit (完整审计：lint + typecheck + test + security + governance-docs + AI-SDLC + AI质量门禁)
  # ──────────────────────────────────────────────────────
  governance-audit:
    uses: ./.github/workflows/jobs-governance-audit.yml
    with:
      languages: '["python","shell"]'
      timeout-minutes: 20
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Pre-commit
  # ──────────────────────────────────────────────────────
  pre-commit:
    uses: ./.github/workflows/jobs-pre-commit.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Gate Doctor (跨平台环境自检 + 基线防篡改 + 台账完整性)
  # ──────────────────────────────────────────────────────
  doctor-gate:
    uses: ./.github/workflows/jobs-doctor-gate.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Lint & Type Check (并行)
  # ──────────────────────────────────────────────────────
  lint:
    uses: ./.github/workflows/jobs-lint.yml
    secrets: inherit

  type-check:
    uses: ./.github/workflows/jobs-type-check.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Tests - 矩阵并行
  # ──────────────────────────────────────────────────────
  # PR fast: 仅 3.11；push/schedule/dispatch: 全矩阵
  test-311:
    uses: ./.github/workflows/jobs-tests.yml
    with:
      python-version: "3.11"
    secrets: inherit

  test-312:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/jobs-tests.yml
    with:
      python-version: "3.12"
    secrets: inherit

  test-313:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/jobs-tests.yml
    with:
      python-version: "3.13"
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Combine Coverage
  # ──────────────────────────────────────────────────────
  combine-coverage:
    if: github.event_name != 'pull_request'
    needs: [test-311, test-312, test-313]
    uses: ./.github/workflows/jobs-combine-coverage.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Quality Gates
  # ──────────────────────────────────────────────────────
  quality-gates:
    uses: ./.github/workflows/jobs-quality-gates.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────────────
  security:
    uses: ./.github/workflows/jobs-security.yml
    secrets: inherit

  secret-scan:
    uses: ./.github/workflows/jobs-secret-scan.yml
    secrets: inherit

  sbom:
    uses: ./.github/workflows/jobs-sbom.yml
    secrets: inherit

  license-scan:
    uses: ./.github/workflows/jobs-license-scan.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Example Tests (并行矩阵)
  # ──────────────────────────────────────────────────────
  test-examples:
    uses: ./.github/workflows/jobs-example-tests.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Dependency Review
  # ──────────────────────────────────────────────────────
  dependency-review:
    uses: ./.github/workflows/jobs-dependency-review.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Docs
  # ──────────────────────────────────────────────────────
  docs-check:
    uses: ./.github/workflows/jobs-docs.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # Agent Validation
  # ──────────────────────────────────────────────────────
  agent-validation:
    uses: ./.github/workflows/jobs-agent-validation.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────
  # 最终汇总
  # ──────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: [adg-governance, governance-audit, pre-commit, lint, type-check, test-311, test-312, test-313, combine-coverage, quality-gates, security, secret-scan, sbom, license-scan, test-examples, dependency-review, docs-check, agent-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: CI Complete
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "✅ CI 汇总（skipped 在 PR fast 分层下可能为预期）"
          echo "$NEEDS_JSON" | python3 -c "
          import json,sys
          needs=json.load(sys.stdin)
          failed=[k for k,v in needs.items() if v.get('result')=='failure']
          cancelled=[k for k,v in needs.items() if v.get('result')=='cancelled']
          for k,v in sorted(needs.items()):
            print(f\"{v.get('result','?'):>10}  {k}\")
          if failed or cancelled:
            print('::error::CI has failed/cancelled jobs: '+', '.join(failed+cancelled))
            raise SystemExit(1)
          "
