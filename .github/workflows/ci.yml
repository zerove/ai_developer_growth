name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy type check
        run: mypy tools/scripts/ --ignore-missing-imports

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=tools/scripts --cov-report=xml --cov-report=term-missing --timeout=30

      - name: Check coverage threshold
        run: |
          python -c "
import xml.etree.ElementTree as ET
tree = ET.parse('coverage.xml')
root = tree.getroot()
coverage = float(root.attrib.get('line-rate', 0)) * 100
print(f'Coverage: {coverage:.1f}%')
if coverage < 70:
    print(f'::error::Coverage {coverage:.1f}% is below 70% threshold')
    exit(1)
print('Coverage check passed!')
"

  link-audit:
    name: Link Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Run link auditor
        run: python tools/scripts/link_auditor.py . --check-all --fail-on-broken

  case-study-validation:
    name: Case Study Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Run case study validator
        run: python tools/scripts/validate_case_study.py --all --strict

  governance-audit:
    name: Governance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Run governance audit
        run: python tools/scripts/audit_to_pr.py --check-all

  build-docs:
    name: Build Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify docs structure
        run: |
          # Check required docs exist
          test -f README.md || exit 1
          test -f INDEX.md || exit 1
          test -f MOC.md || exit 1
          test -f GOVERNANCE.md || exit 1
          test -f CONTRIBUTING.md || exit 1
          test -f ROADMAP.md || exit 1
          test -d docs/ || exit 1
          test -d case-studies/ || exit 1
          test -d examples/ || exit 1
          echo "All required docs and directories exist"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install pip-audit bandit

      - name: Run pip-audit
        run: pip-audit --desc

      - name: Run bandit
        run: bandit -r tools/scripts/ examples/ -f json -o bandit-report.json || true

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, link-audit, case-study-validation, governance-audit, build-docs, security-scan]
    if: failure()
    steps:
      - name: Send failure notification
        run: echo "CI pipeline failed. Check GitHub Actions for details."