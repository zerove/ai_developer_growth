name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────
  # ADG Governance Check (anti-patterns, security, naming)
  # ──────────────────────────────────────────────────────
  adg-governance:
    name: ADG Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install pyyaml
      - name: Detect language
        run: python -m tools.scripts.adg_cli detect .
      - name: Check anti-patterns (error only)
        run: |
          python -m tools.scripts.adg_cli check tools/scripts/ --lang python --severity error --json > adg-report.json
          ERROR_COUNT=$(python -c "import json; print(json.load(open('adg-report.json'))['summary']['error'])")
          echo "Errors found: $ERROR_COUNT"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::ADG governance check found $ERROR_COUNT errors"
            python -m tools.scripts.adg_cli check tools/scripts/ --lang python --severity error
            exit 1
          fi
      - name: Upload ADG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adg-governance-report
          path: adg-report.json

  # ──────────────────────────────────────────────────────
  # Pre-commit checks
  # ──────────────────────────────────────────────────────
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pre-commit/action@v3.0.1

  # ──────────────────────────────────────────────────────
  # Lint & Type Check
  # ──────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml', 'uv.lock', 'ruff.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      - run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-
      - run: pip install mypy
      - name: Mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('tools/scripts/**/*.py') }}
          restore-keys: mypy-${{ runner.os }}-
      - name: Mypy (strict)
        run: mypy tools/scripts/ --ignore-missing-imports --strict

  # ──────────────────────────────────────────────────────
  # Tests (optimized with caching and parallel matrix)
  # ──────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - run: pip install pytest pytest-cov pyyaml pytest-xdist
      - name: Run tests with coverage
        run: pytest tests/ -v -n auto --cov=tools --cov-report=xml --cov-report=term-missing --tb=short
      - name: Coverage check
        if: matrix.python-version == '3.11'
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          branch_coverage = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'Line coverage: {coverage:.1f}%')
          print(f'Branch coverage: {branch_coverage:.1f}%')
          if coverage < 85:
              print(f'::error::Line coverage {coverage:.1f}% is below 85% threshold')
              exit(1)
          "
      - name: Coverage Report
        if: matrix.python-version == '3.11' && always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          branch_coverage = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'Line coverage: {coverage:.1f}%')
          print(f'Branch coverage: {branch_coverage:.1f}%')
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage data
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage

  # ──────────────────────────────────────────────────────
  # Test Sharding (for large test suites - optional)
  # ──────────────────────────────────────────────────────
  test-sharded:
    name: Tests Sharded (Python ${{ matrix.python-version }} - Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.repository == 'zerove/ai_developer_growth'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - run: pip install pytest pytest-cov pyyaml pytest-xdist pytest-split
      - name: Run tests with sharding
        run: |
          pytest tests/ -v -n auto --cov=tools --cov-report=xml --cov-report=term-missing --tb=short \
            --split=${{ matrix.shard }}/4 --group-by=duration
      - name: Upload shard coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-shard-${{ matrix.shard }}
          path: .coverage
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Combine Coverage
  # ──────────────────────────────────────────────────────
  combine-coverage:
    name: Combine Coverage Reports
    runs-on: ubuntu-latest
    needs: [test, test-sharded]
    if: always() && github.repository == 'zerove/ai_developer_growth'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download full-suite coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: coverage-artifacts/main/
      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-shard-*
          path: coverage-artifacts/shards/
          merge-multiple: false
      - name: Combine coverage
        run: |
          pip install coverage
          coverage combine coverage-artifacts/main/.coverage coverage-artifacts/shards/*/.coverage
          coverage xml -o combined-coverage.xml
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('combined-coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          branch_coverage = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'Combined Line coverage: {coverage:.1f}%')
          print(f'Combined Branch coverage: {branch_coverage:.1f}%')
          if coverage < 85:
              print(f'::error::Combined line coverage {coverage:.1f}% is below 85% threshold')
              exit(1)
          "
      - name: Upload combined coverage
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: combined-coverage.xml
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # Quality Gates (复用 hooks_runner.py)
  # ──────────────────────────────────────────────────────
  link-audit:
    name: Link Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check links
        run: python tools/scripts/hooks_runner.py quality-gate --path . --check-annotation --check-security --check-type --check-error --check-structure --format json

  case-study-validation:
    name: Case Study Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate all cases
        run: python tools/scripts/validate_case_study.py --path case-studies/

  governance-audit:
    name: Governance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Governance docs validation
        run: python tools/scripts/hooks_runner.py governance-audit --validate-docs
      - name: AI-SDLC compliance
        run: python tools/scripts/hooks_runner.py governance-audit --check-ai-sdlc
      - name: Hallucination risk audit
        run: python tools/scripts/hooks_runner.py governance-audit --audit-hallucination || true
      - name: Language rules check
        run: python tools/scripts/hooks_runner.py language-rules --path tools/scripts

  # ──────────────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-security-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-
      - name: Security scan (bandit + pip-audit)
        run: python tools/scripts/hooks_runner.py security
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ──────────────────────────────────────────────────────
  # Secret Scanning
  # ──────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - name: Run trufflehog
        run: |
          trufflehog git file://. --since-commit=HEAD~10 --json > trufflehog-results.json || true
          FINDINGS=$(cat trufflehog-results.json | jq -s 'flatten | length')
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::Found $FINDINGS potential secrets"
            cat trufflehog-results.json | jq -r '.[] | "\(.DetectorType): \(.Decoder).\(.Verified)"' | head -20
            exit 1
          else
            echo "No secrets found"
          fi
      - name: Upload secret scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: trufflehog-results.json
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # SBOM Generation
  # ──────────────────────────────────────────────────────
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-sbom-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-sbom-
      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom
      - name: Generate SBOM
        run: |
          cyclonedx-py -o sbom.json --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # License Scanning
  # ──────────────────────────────────────────────────────
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-license-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-license-
      - name: Install pip-licenses
        run: pip install pip-licenses
      - name: Scan licenses
        run: |
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=plain-vertical --with-system --with-urls | head -100
      - name: Check for disallowed licenses
        run: |
          python -c "
          import json
          disallowed = ['GPL-3.0', 'AGPL-3.0', 'SSPL-1.0', 'BSL-1.0', 'ELv2']
          with open('licenses.json') as f:
              licenses = json.load(f)
          violations = []
          for pkg in licenses:
              license_name = pkg.get('License', '')
              if any(d in license_name for d in disallowed):
                  violations.append(f\"{pkg['Name']}: {license_name}\")
          if violations:
              print('::error::Disallowed licenses found:')
              for v in violations:
                  print(f'  {v}')
              exit(1)
          else:
              print('All licenses are allowed')
          "
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # Example Tests (parallel matrix)
  # ──────────────────────────────────────────────────────
  test-examples:
    name: Example Tests (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - ai-context-sync
          - multi-agent-orch
          - self-correction-loop
          - ai-task-prioritizer
          - capability-radar
          - prompt-optimizer
          - ai-navigation
          - ai-navigation-web
          - ai-growth-slack
          - ai-growth-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-example-${{ matrix.example }}-${{ hashFiles('examples/${{ matrix.example }}/pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-example-${{ matrix.example }}-
      - run: pip install -e examples/${{ matrix.example }} pytest
      - name: Run ${{ matrix.example }} tests
        continue-on-error: true
        run: |
          cd examples/${{ matrix.example }} && python -m pytest tests/ -v --tb=short
      - name: Collect result
        if: always()
        run: |
          count=$(cd examples/${{ matrix.example }} && python -m pytest tests/ --co -q 2>/dev/null | grep "test" | wc -l || echo "0")
          echo "| ${{ matrix.example }} | $count |" >> $GITHUB_STEP_SUMMARY

  validate-examples:
    name: Validate Example Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest
      - name: Validate example structure
        run: python tools/scripts/validate_example_projects.py
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docs-check:
    name: Docs Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          for f in README.md INDEX.md MOC.md GOVERNANCE.md CONTRIBUTING.md ROADMAP.md LICENSE SECURITY.md CODE_OF_CONDUCT.md; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          for d in docs case-studies examples tools agents; do
            test -d "$d" || { echo "Missing dir: $d"; exit 1; }
          done
          echo "All required files and directories exist"

  docs-build:
    name: MkDocs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ runner.os }}-pip-docs-${{ hashFiles('mkdocs.yml', 'requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-
      - run: pip install mkdocs-material
      - name: Build docs (strict)
        run: mkdocs build --strict

  governance-docs-check:
    name: Governance Docs Validation
    runs-on: ubuntu-latest
    needs: [governance-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate governance docs format
        run: python tools/scripts/hooks_runner.py governance-audit --validate-docs
      - name: Check index references
        run: python tools/scripts/hooks_runner.py governance-audit --check-index

  # ──────────────────────────────────────────────────────
  # Agent & Enforcement Validation (复用 jcode scripts)
  # ──────────────────────────────────────────────────────
  agent-validation:
    name: Agent Definition Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate agent definitions
        run: python tools/scripts/validate_agent_definition.py --path agents/

  enforcement-check:
    name: Enforcement Scripts Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: AI annotation check
        run: python tools/scripts/hooks_runner.py quality-gate --path tools/scripts --check-annotation
      - name: Quality gate
        run: python tools/scripts/hooks_runner.py governance-audit --full || true