name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────
  # Pre-commit checks
  # ──────────────────────────────────────────────────────
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pre-commit/action@v3.0.1

  # ──────────────────────────────────────────────────────
  # Lint & Type Check
  # ──────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install mypy
      - name: Mypy
        run: mypy tools/scripts/ --ignore-missing-imports

  # ──────────────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --cov=tools/scripts --cov-report=xml --cov-report=term-missing --timeout=30
      - name: Coverage check
        if: matrix.python-version == '3.11'
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Coverage: {coverage:.1f}%')
          if coverage < 80:
              print(f'::error::Coverage {coverage:.1f}% is below 80% threshold')
              exit(1)
          "
      - name: Coverage Report
        if: matrix.python-version == '3.11' && always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Line coverage: {coverage:.1f}%')
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────
  # Quality Gates
  # ──────────────────────────────────────────────────────
  link-audit:
    name: Link Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check links
        run: python tools/scripts/link_auditor.py . --check-all --fail-on-broken

  case-study-validation:
    name: Case Study Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate all cases
        run: python tools/scripts/validate_case_study.py --all --strict

  governance-audit:
    name: Governance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Audit
        run: python tools/scripts/audit_to_pr.py --check-all

  # ──────────────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit bandit
      - name: pip-audit
        run: pip-audit --desc
      - name: bandit
        run: bandit -r tools/scripts/ -f json -o bandit-report.json -ll
      - name: bandit fail on high severity
        run: |
          if [ -f bandit-report.json ]; then
            python -c "
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          high = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']
          if high:
              print(f'::error::{len(high)} HIGH severity issues found')
              for r in high:
                  print(f\"  {r['filename']}:{r['line_number']} - {r['issue_text']}\")
              sys.exit(1)
          print('No HIGH severity issues')
          "
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ──────────────────────────────────────────────────────
  # Example Tests
  # ──────────────────────────────────────────────────────
  test-examples:
    name: Example Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e examples/ai-context-sync -e examples/multi-agent-orch -e examples/self-correction-loop -e examples/ai-task-prioritizer -e examples/ai-navigation -e examples/capability-radar -e examples/prompt-optimizer -e examples/ai-navigation-web pytest pytest-cov
      - name: Validate example structure
        run: python tools/scripts/validate_example_projects.py
      - name: Run example tests
        run: |
          cd examples/ai-context-sync && python -m pytest tests/ -v --tb=short
          cd ../multi-agent-orch && python -m pytest tests/ -v --tb=short
          cd ../self-correction-loop && python -m pytest tests/ -v --tb=short
          cd ../ai-task-prioritizer && python -m pytest tests/ -v --tb=short
          cd ../capability-radar && python -m pytest tests/ -v --tb=short
          cd ../prompt-optimizer && python -m pytest tests/ -v --tb=short
          cd ../ai-navigation && python -m pytest tests/ -v --tb=short
          cd ../ai-navigation-web && python -m pytest tests/ -v --tb=short
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Example | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          for d in ai-context-sync multi-agent-orch self-correction-loop ai-task-prioritizer capability-radar prompt-optimizer ai-navigation ai-navigation-web; do
            count=$(cd examples/$d && python -m pytest tests/ --co -q 2>/dev/null | grep "test" | wc -l || echo "0")
            echo "| $d | $count |" >> $GITHUB_STEP_SUMMARY
          done
  docs-check:
    name: Docs Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          for f in README.md INDEX.md MOC.md GOVERNANCE.md CONTRIBUTING.md ROADMAP.md LICENSE SECURITY.md CODE_OF_CONDUCT.md; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          for d in docs case-studies examples tools agents; do
            test -d "$d" || { echo "Missing dir: $d"; exit 1; }
          done
          echo "All required files and directories exist"

  governance-docs-check:
    name: Governance Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate governance docs
        run: python .jcode/scripts/governance-docs-validator.py check-index
      - name: Validate AI-SDLC compliance
        run: python .jcode/scripts/governance-auditor.py check-ai-sdlc-compliance

  # ──────────────────────────────────────────────────────
  # Agent & Enforcement Validation
  # ──────────────────────────────────────────────────────
  agent-validation:
    name: Agent Definition Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate agent definitions
        run: python tools/scripts/validate_agent_definition.py --path agents/

  enforcement-check:
    name: Enforcement Scripts Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: AI annotation check
        run: python tools/scripts/check_ai_annotation.py --path tools/scripts/
      - name: Quality gate check
        run: python tools/scripts/ai_quality_gate.py --check-patterns --path tools/scripts/ || true
