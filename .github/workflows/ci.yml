name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────
  # ADG Governance Check (anti-patterns, security, naming)
  # ──────────────────────────────────────────────────────
  adg-governance:
    name: ADG Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install pyyaml
      - name: Detect language
        run: python -m tools.scripts.adg_cli detect .
      - name: Check anti-patterns (error only)
        run: |
          python -m tools.scripts.adg_cli check tools/scripts/ --lang python --severity error --json > adg-report.json
          ERROR_COUNT=$(python -c "import json; print(json.load(open('adg-report.json'))['summary']['error'])")
          echo "Errors found: $ERROR_COUNT"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::ADG governance check found $ERROR_COUNT errors"
            python -m tools.scripts.adg_cli check tools/scripts/ --lang python --severity error
            exit 1
          fi
      - name: Upload ADG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adg-governance-report
          path: adg-report.json

  # ──────────────────────────────────────────────────────
  # Pre-commit checks
  # ──────────────────────────────────────────────────────
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pre-commit/action@v3.0.1

  # ──────────────────────────────────────────────────────
  # Lint & Type Check
  # ──────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install mypy
      - name: Mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('tools/scripts/**/*.py') }}
          restore-keys: mypy-${{ runner.os }}-
      - name: Mypy (strict)
        run: mypy tools/scripts/ --ignore-missing-imports --strict

  # ──────────────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install pytest pytest-cov pyyaml
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=tools --cov-report=xml --cov-report=term-missing --tb=short
      - name: Coverage check
        if: matrix.python-version == '3.11'
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          branch_coverage = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'Line coverage: {coverage:.1f}%')
          print(f'Branch coverage: {branch_coverage:.1f}%')
          if coverage < 85:
              print(f'::error::Line coverage {coverage:.1f}% is below 85% threshold')
              exit(1)
          "
      - name: Coverage Report
        if: matrix.python-version == '3.11' && always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          branch_coverage = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'Line coverage: {coverage:.1f}%')
          print(f'Branch coverage: {branch_coverage:.1f}%')
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────────────────
  # Quality Gates (复用 hooks_runner.py)
  # ──────────────────────────────────────────────────────
  link-audit:
    name: Link Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check links
        run: python tools/scripts/hooks_runner.py quality-gate --path . --check-annotation --check-security --check-type --check-error --check-structure --format json

  case-study-validation:
    name: Case Study Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate all cases
        run: python tools/scripts/validate_case_study.py --path case-studies/

  governance-audit:
    name: Governance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Governance docs validation
        run: python tools/scripts/hooks_runner.py governance-audit --validate-docs
      - name: AI-SDLC compliance
        run: python tools/scripts/hooks_runner.py governance-audit --check-ai-sdlc
      - name: Hallucination risk audit
        run: python tools/scripts/hooks_runner.py governance-audit --audit-hallucination || true
      - name: Language rules check
        run: python tools/scripts/hooks_runner.py language-rules --path tools/scripts

  # ──────────────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Security scan (bandit + pip-audit)
        run: python tools/scripts/hooks_runner.py security
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ──────────────────────────────────────────────────────
  # Example Tests
  # ──────────────────────────────────────────────────────
  test-examples:
    name: Example Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e examples/ai-context-sync -e examples/multi-agent-orch -e examples/self-correction-loop -e examples/ai-task-prioritizer -e examples/ai-navigation -e examples/capability-radar -e examples/prompt-optimizer -e examples/ai-navigation-web -e examples/ai-growth-slack -e examples/ai-growth-vscode pytest pytest-cov
      - name: Validate example structure
        run: python tools/scripts/validate_example_projects.py
      - name: Run example tests
        run: |
          cd examples/ai-context-sync && python -m pytest tests/ -v --tb=short
          cd ../multi-agent-orch && python -m pytest tests/ -v --tb=short
          cd ../self-correction-loop && python -m pytest tests/ -v --tb=short
          cd ../ai-task-prioritizer && python -m pytest tests/ -v --tb=short
          cd ../capability-radar && python -m pytest tests/ -v --tb=short
          cd ../prompt-optimizer && python -m pytest tests/ -v --tb=short
          cd ../ai-navigation && python -m pytest tests/ -v --tb=short
          cd ../ai-navigation-web && python -m pytest tests/ -v --tb=short
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Example | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          for d in ai-context-sync multi-agent-orch self-correction-loop ai-task-prioritizer capability-radar prompt-optimizer ai-navigation ai-navigation-web ai-growth-slack ai-growth-vscode; do
            count=$(cd examples/$d && python -m pytest tests/ --co -q 2>/dev/null | grep "test" | wc -l || echo "0")
            echo "| $d | $count |" >> $GITHUB_STEP_SUMMARY
          done
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docs-check:
    name: Docs Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          for f in README.md INDEX.md MOC.md GOVERNANCE.md CONTRIBUTING.md ROADMAP.md LICENSE SECURITY.md CODE_OF_CONDUCT.md; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          for d in docs case-studies examples tools agents; do
            test -d "$d" || { echo "Missing dir: $d"; exit 1; }
          done
          echo "All required files and directories exist"

  docs-build:
    name: MkDocs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install mkdocs-material
      - name: Build docs (strict)
        run: mkdocs build --strict

  governance-docs-check:
    name: Governance Docs Validation
    runs-on: ubuntu-latest
    needs: [governance-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate governance docs format
        run: python tools/scripts/hooks_runner.py governance-audit --validate-docs
      - name: Check index references
        run: python tools/scripts/hooks_runner.py governance-audit --check-index

  # ──────────────────────────────────────────────────────
  # Agent & Enforcement Validation (复用 jcode scripts)
  # ──────────────────────────────────────────────────────
  agent-validation:
    name: Agent Definition Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate agent definitions
        run: python tools/scripts/validate_agent_definition.py --path agents/

  enforcement-check:
    name: Enforcement Scripts Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: AI annotation check
        run: python tools/scripts/hooks_runner.py quality-gate --path tools/scripts --check-annotation
      - name: Quality gate
        run: python tools/scripts/hooks_runner.py governance-audit --full || true
