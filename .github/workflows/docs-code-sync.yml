name: Documentation-Code Sync Check

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  docs-code-sync:
    name: "Docs-Code Sync Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Check README case count matches INDEX.md
        run: |
          echo "=== Check: README case count ==="
          README_COUNT=$(grep -c "case-studies/" README.md || true)
          INDEX_COUNT=$(grep -c "case-studies/" INDEX.md || true)
          ACTUAL_COUNT=$(ls case-studies/*.md 2>/dev/null | wc -l)
          echo "README.md mentions: $README_COUNT cases"
          echo "INDEX.md lists: $INDEX_COUNT cases"
          echo "Actual files: $ACTUAL_COUNT cases"
          if [ "$README_COUNT" -ne "$ACTUAL_COUNT" ]; then
            echo "FAIL: README.md case count ($README_COUNT) != actual ($ACTUAL_COUNT)"
            exit 1
          fi
          if [ "$INDEX_COUNT" -ne "$ACTUAL_COUNT" ]; then
            echo "FAIL: INDEX.md case count ($INDEX_COUNT) != actual ($ACTUAL_COUNT)"
            exit 1
          fi
          echo "PASS: Case counts consistent"

      - name: Check MOC.md coverage stats match actual
        run: |
          echo "=== Check: MOC.md coverage stats ==="
          # Extract numbers from MOC.md tables
          MOC_MINDSET=$(grep "| 认知层 " MOC.md | sed -E 's/.*\| *([0-9]+) *\|.*/\1/')
          MOC_LEARNING=$(grep "| 学习层 " MOC.md | sed -E 's/.*\| *([0-9]+) *\|.*/\1/')
          MOC_EFFICIENCY=$(grep "| 效率层 " MOC.md | sed -E 's/.*\| *([0-9]+) *\|.*/\1/')
          MOC_TOOLING=$(grep "| 工具层 " MOC.md | sed -E 's/.*\| *([0-9]+) *\|.*/\1/')
          MOC_CASES=$(grep "| 案例库 " MOC.md | sed -E 's/.*\| *([0-9]+) *\|.*/\1/')
          MOC_EXAMPLES=$(grep "| 代码示例 " MOC.md | sed -E 's/.*\| *([0-9]+) *\|.*/\1/')
          
          # Count actual files
          ACTUAL_MINDSET=$(ls docs/mindset/*.md 2>/dev/null | wc -l)
          ACTUAL_LEARNING=$(ls docs/learning/*.md 2>/dev/null | wc -l)
          ACTUAL_EFFICIENCY=$(ls docs/efficiency/*.md 2>/dev/null | wc -l)
          ACTUAL_TOOLING=$(ls docs/tools/*.md 2>/dev/null | wc -l)
          ACTUAL_CASES=$(ls case-studies/*.md 2>/dev/null | wc -l)
          ACTUAL_EXAMPLES=$(ls -d examples/*/ 2>/dev/null | grep -v "\.egg-info\|__pycache__\|\.venv" | wc -l)
          
          echo "MOC: Mindset=$MOC_MINDSET, Learning=$MOC_LEARNING, Efficiency=$MOC_EFFICIENCY, Tooling=$MOC_TOOLING, Cases=$MOC_CASES, Examples=$MOC_EXAMPLES"
          echo "Actual: Mindset=$ACTUAL_MINDSET, Learning=$ACTUAL_LEARNING, Efficiency=$ACTUAL_EFFICIENCY, Tooling=$ACTUAL_TOOLING, Cases=$ACTUAL_CASES, Examples=$ACTUAL_EXAMPLES"
          
          if [ "$MOC_MINDSET" -ne "$ACTUAL_MINDSET" ]; then echo "FAIL: Mindset count mismatch"; exit 1; fi
          if [ "$MOC_LEARNING" -ne "$ACTUAL_LEARNING" ]; then echo "FAIL: Learning count mismatch"; exit 1; fi
          if [ "$MOC_EFFICIENCY" -ne "$ACTUAL_EFFICIENCY" ]; then echo "FAIL: Efficiency count mismatch"; exit 1; fi
          if [ "$MOC_TOOLING" -ne "$ACTUAL_TOOLING" ]; then echo "FAIL: Tooling count mismatch"; exit 1; fi
          if [ "$MOC_CASES" -ne "$ACTUAL_CASES" ]; then echo "FAIL: Cases count mismatch"; exit 1; fi
          if [ "$MOC_EXAMPLES" -ne "$ACTUAL_EXAMPLES" ]; then echo "FAIL: Examples count mismatch"; exit 1; fi
          echo "PASS: MOC.md coverage stats match actual files"

      - name: Check link consistency in docs
        run: |
          echo "=== Check: Link format consistency ==="
          # Check for inconsistent link formats
          INCONSISTENT=$(grep -r "\[\[.*\]\]" docs/ --include="*.md" | grep -v "docs/governance" | head -20)
          if [ -n "$INCONSISTENT" ]; then
            echo "WARN: Found wikilink format in docs/ (should use relative paths):"
            echo "$INCONSISTENT"
          fi
          
          # Check INDEX.md and README.md link format consistency
          INDEX_LINKS=$(grep -c "\[\[docs/" INDEX.md || true)
          README_LINKS=$(grep -c "\[\[docs/" README.md || true)
          echo "INDEX.md wikilinks: $INDEX_LINKS"
          echo "README.md wikilinks: $README_LINKS"
          
          # Check for broken internal links
          python tools/scripts/link_auditor.py --check docs/ INDEX.md MOC.md --internal-only || true

      - name: Check CONTEXT.md and AGENTS.md are updated
        run: |
          echo "=== Check: Context files freshness ==="
          for file in CONTEXT.md AGENTS.md UBIQUITOUS_LANGUAGE.md; do
            if [ ! -f "$file" ]; then
              echo "FAIL: $file not found"
              exit 1
            fi
            MODIFIED=$(stat -c %Y "$file" 2>/dev/null || stat -f %m "$file" 2>/dev/null)
            NOW=$(date +%s)
            AGE_DAYS=$(( (NOW - MODIFIED) / 86400 ))
            if [ "$AGE_DAYS" -gt 30 ]; then
              echo "WARN: $file is $AGE_DAYS days old, consider updating"
            fi
            echo "PASS: $file exists (age: $AGE_DAYS days)"
          done

      - name: Check AGENTS.md indexes all agent definitions
        run: |
          echo "=== Check: AGENTS.md completeness ==="
          AGENT_FILES=$(find agents/ -name "*.md" 2>/dev/null | wc -l)
          AGENT_INDEXED=$(grep -c "agents/" AGENTS.md || true)
          echo "Agent definition files: $AGENT_FILES"
          echo "Agent indexed in AGENTS.md: $AGENT_INDEXED"
          if [ "$AGENT_FILES" -gt 0 ] && [ "$AGENT_INDEXED" -lt "$AGENT_FILES" ]; then
            echo "FAIL: Not all agent definitions indexed in AGENTS.md"
            exit 1
          fi
          echo "PASS: All agent definitions indexed"

      - name: Verify UBIQUITOUS_LANGUAGE.md terms used in docs
        run: |
          echo "=== Check: Terminology consistency ==="
          # Extract terms from UBIQUITOUS_LANGUAGE.md
          TERMS=$(grep "| " UBIQUITOUS_LANGUAGE.md | grep -v "^| 术语" | grep -v "^|---" | awk -F'|' '{print $2}' | sed 's/^ *//;s/ *$//')
          MISSING=0
          for term in $TERMS; do
            if [ -n "$term" ] && [ "$term" != "英文" ] && [ "$term" != "定义" ] && [ "$term" != "使用场景" ] && [ "$term" != "来源" ]; then
              COUNT=$(grep -r "$term" docs/ --include="*.md" | wc -l)
              if [ "$COUNT" -eq 0 ]; then
                echo "WARN: Term '$term' defined but not used in docs/"
                MISSING=1
              fi
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "PASS: All terms referenced in docs"
          fi

      - name: Check ADR.md updated for architecture decisions
        run: |
          echo "=== Check: ADR.md existence ==="
          if [ -f "docs/adr/ADR.md" ]; then
            echo "PASS: docs/adr/ADR.md exists"
          else
            echo "WARN: docs/adr/ADR.md not found"
          fi

      - name: Check example projects have required files
        run: |
          echo "=== Check: Example project completeness ==="
          for example in examples/*/; do
            if [ -d "$example" ] && [[ ! "$example" =~ __pycache__|\.egg-info|\.venv ]]; then
              name=$(basename "$example")
              echo "Checking $name..."
              if [ ! -f "$example/README.md" ]; then
                echo "FAIL: $example missing README.md"
                exit 1
              fi
              if [ ! -f "$example/pyproject.toml" ] && [ ! -f "$example/Cargo.toml" ] && [ ! -f "$example/package.json" ] && [ ! -f "$example/go.mod" ]; then
                echo "WARN: $example missing project config (pyproject.toml/Cargo.toml/package.json/go.mod)"
              fi
              if [ ! -d "$example/tests" ] && [ ! -d "$example/test" ]; then
                echo "WARN: $example missing tests/ directory"
              fi
            fi
          done
          echo "PASS: All examples have basic structure"

      - name: Check governance framework completeness
        run: |
          echo "=== Check: Governance framework ==="
          LANG_COUNT=$(ls ai-dev-framework/languages/ 2>/dev/null | wc -l)
          FRAMEWORK_COUNT=$(ls ai-dev-framework/frameworks/ 2>/dev/null | wc -l)
          echo "Languages: $LANG_COUNT (expected 13)"
          echo "Frameworks: $FRAMEWORK_COUNT (expected 11)"
          if [ "$LANG_COUNT" -lt 13 ]; then
            echo "WARN: Language rules incomplete ($LANG_COUNT/13)"
          fi
          if [ "$FRAMEWORK_COUNT" -lt 11 ]; then
            echo "WARN: Framework rules incomplete ($FRAMEWORK_COUNT/11)"
          fi
          echo "PASS: Governance framework structure valid"

EOF