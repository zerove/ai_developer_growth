name: Docs Governance

# ci.yml 用 paths-ignore 排除了 docs/** 与 *.md，导致文档/案例/索引改动
# 不触发任何门禁——本项目恰恰是靠文档传递方法论，漂移却是隐形的。
#
# 这里为文档改动单独开一条轻量流水线：只跑文档相关门禁，不烧 ci.yml 那 22 个
# job 的配额（私有仓库 Actions 配额曾耗尽 23 天，见 ADR-057）。
# 不使用 scheduled（同样会与被监测对象一起死亡），而是随 push/PR 触发。

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'templates/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'templates/**'

concurrency:
  group: docs-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-structure:
    name: Docs Structure & MkDocs Build
    uses: ./.github/workflows/jobs-docs.yml

  docs-governance:
    name: Docs Governance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # 依赖集必须与其他作业一致: update_stats 的"测试用例数"来自
      # `pytest --collect-only`, 而缺少可选依赖的测试模块会被整模块跳过 →
      # 收集数随环境变化 → README 统计在不同作业里对不上（CI 报漂移）。
      # 这里装齐测试相关 extras, 使统计口径与仓库标准环境一致。
      - name: Install dependencies
        run: pip install -e ".[dev-core,dev-semantic,search,dev-integration]"

      - name: Stats drift check (README vs update_stats)
        # P2.6: README 统计表与 update_stats 实际计数漂移即失败，不放行
        run: python -m tools.scripts.update_stats --check

      # 以下门禁一律不得加 `|| true`：那正是 scheduled-governance 的失效模式
      # ——失败被吞掉，作业显示绿色，问题永远不暴露。

      - name: Governance docs format
        run: python .jcode/scripts/governance-docs-validator.py validate

      - name: Governance docs index references
        run: python .jcode/scripts/governance-docs-validator.py check-index

      - name: Context docs validation (CONTEXT.md/ADR.md)
        run: python .jcode/scripts/context-sync.py validate --context-file CONTEXT.md --adr-file ADR.md

      - name: Broken links
        run: python -m tools.scripts.link_auditor . --check-all

      - name: Doc code refs
        # D-02: 正文中仓库代码路径引用必须真实存在（不只校验 markdown 链接可达）
        run: python -m tools.scripts.check_doc_code_refs

      - name: Case study format
        run: python -m tools.scripts.validate_case_study --all --strict

      - name: Tool matrix consistency
        run: python -m tools.scripts.update_ai_tool_matrix --check
