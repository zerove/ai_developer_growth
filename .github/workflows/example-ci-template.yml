name: Example CI

on:
  # 模板：供示例仓库（examples/*）复制使用。主仓库不自动运行，
  # 避免在主仓库根目录执行针对示例项目结构的 lint/test 检查。
  workflow_dispatch:

concurrency:
  group: example-ci-template-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────
  # Lint & Format
  # ──────────────────────────────────────────────────────
  lint:
    name: 'Lint & Format'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ──────────────────────────────────────────────────────
  # Type Check
  # ──────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install mypy
      - name: Mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('**/*.py') }}
          restore-keys: mypy-${{ runner.os }}-
      - name: Mypy (strict)
        run: mypy .
        # mypy 配置统一由 pyproject.toml [tool.mypy] 提供（strict, ignore_missing_imports 等）
        # 不要在此处加 --ignore-missing-imports / --strict 等命令行级参数（避免配置漂移）

  # ──────────────────────────────────────────────────────
  # Tests (with coverage)
  # ──────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-cov pytest-asyncio
      - name: Run tests with coverage
        run: pytest tests/ -v -n auto --cov=src --cov-report=xml --cov-report=term-missing --tb=short
      - name: Coverage check
        if: matrix.python-version == '3.11'
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import tomllib

          # Read coverage threshold from pyproject.toml
          with open('pyproject.toml', 'rb') as f:
              config = tomllib.load(f)
          fail_under = config.get('tool', {}).get('coverage', {}).get('report', {}).get('fail_under', 70)

          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          branch_coverage = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'Line coverage: {coverage:.1f}%')
          print(f'Branch coverage: {branch_coverage:.1f}%')
          print(f'Required threshold: {fail_under}%')
          if coverage < fail_under:
              print(f'::error::Line coverage {coverage:.1f}% is below {fail_under}% threshold')
              exit(1)
          "
      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.repository.name }}
          path: coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Security Scan
  # ──────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Security scan (bandit + pip-audit)
        run: |
          pip install bandit pip-audit
          bandit -r src/ -f json -o bandit-report.json || true
          pip-audit --format=json --output=pip-audit-report.json || true
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.event.repository.name }}
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # ADG Governance Check
  # ──────────────────────────────────────────────────────
  adg-governance:
    name: ADG Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install pyyaml ai-developer-growth
      - name: Check anti-patterns (error only)
        run: |
          adg check src/ --lang python --severity error --json > adg-report.json
          ERROR_COUNT=$(python -c "import json; print(json.load(open('adg-report.json'))['summary']['error'])")
          echo "Errors found: $ERROR_COUNT"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::ADG governance check found $ERROR_COUNT errors"
            adg check src/ --lang python --severity error
            exit 1
          fi
      - name: Upload ADG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adg-report-${{ github.event.repository.name }}
          path: adg-report.json
          retention-days: 7
