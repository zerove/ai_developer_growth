name: Combine Coverage Reusable
on:
  workflow_call: {}
jobs:
  combine-coverage:
    name: Combine Coverage
    if: always() && github.repository == 'zerove/ai_developer_growth'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Read coverage threshold from pyproject.toml
      id: coverage-config
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import tomllib

        with open("pyproject.toml", "rb") as f:
            cfg = tomllib.load(f)

        adg = cfg.get("tool", {}).get("adg", {})
        print(f"fail_under={adg.get('cov_min', 80)}")
        print(f"branch_fail_under={adg.get('branch_cov_min', 75)}")
        PY
    - name: Download coverage data
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-data*
        path: coverage-artifacts/
        merge-multiple: false
    - name: Combine
      run: |
        pip install coverage
        coverage combine coverage-artifacts/**/.coverage
        coverage xml -o combined-coverage.xml
        python - <<'PY'
        import xml.etree.ElementTree as ET

        root = ET.parse("combined-coverage.xml").getroot()
        line_rate = float(root.attrib.get("line-rate", 0)) * 100
        branch_rate = float(root.attrib.get("branch-rate", 0)) * 100
        line_min = float("${{ steps.coverage-config.outputs.fail_under }}")
        branch_min = float("${{ steps.coverage-config.outputs.branch_fail_under }}")
        print(
            f"Combined: Line {line_rate:.1f}% (min {line_min:.1f}%), "
            f"Branch {branch_rate:.1f}% (min {branch_min:.1f}%)"
        )
        failed = False
        if line_rate < line_min:
            print(f"::error::Combined line coverage {line_rate:.1f}% < {line_min:.1f}%")
            failed = True
        if branch_rate < branch_min:
            print(f"::error::Combined branch coverage {branch_rate:.1f}% < {branch_min:.1f}%")
            failed = True
        raise SystemExit(1 if failed else 0)
        PY
    - name: Upload combined
      uses: actions/upload-artifact@v4
      with:
        name: combined-coverage
        path: combined-coverage.xml
        retention-days: 30
    - name: Diff Cover report (PR only, non-blocking)
      if: github.event_name == 'pull_request'
      run: |
        pip install diff-cover
        BASE_BRANCH=${{ github.base_ref }}
        git fetch origin $BASE_BRANCH --depth=1
        diff-cover combined-coverage.xml --compare-branch=origin/$BASE_BRANCH --fail-under=${{ steps.coverage-config.outputs.fail_under }} --html-report diff-cover-report.html || true
    - name: Upload Diff Cover Report
      if: github.event_name == 'pull_request' && always()
      uses: actions/upload-artifact@v4
      with:
        name: diff-cover-report
        path: diff-cover-report.html
        retention-days: 7
