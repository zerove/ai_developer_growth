name: Dependency Graph Analysis Reusable
on:
  workflow_call:
    inputs:
      action:
        description: Dependency graph action to perform
        type: string
        required: true
      sbom-path:
        description: Path to SBOM file (JSON/SPDX/CycloneDX)
        type: string
        required: false
      package:
        description: Package name for impact analysis
        type: string
        required: false
      new-version:
        description: New version for impact analysis
        type: string
        required: false
      format:
        description: Output format (json, dot, mermaid, tree)
        type: string
        required: false
        default: json
      output:
        description: Output file path
        type: string
        required: false
jobs:
  dependency-graph:
    name: Dependency Graph Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Upgrade setuptools
      run: pip install -U "setuptools>=83.0.0"
    - name: Install JCode
      run: pip install -e .
    # SBOM 必须在本作业内生成: 上游 sbom 作业的产物不会被自动带进本作业,
    # 而 dep-graph 的 CLI 契约是消费 --sbom 指定的文件 (不指定则扫描项目)。
    - name: Generate SBOM
      id: sbom
      shell: bash
      run: |
        set -eo pipefail
        SBOM_PATH="${{ inputs.sbom-path }}"
        if [[ -z "$SBOM_PATH" ]]; then
          SBOM_PATH="sbom.json"
        fi
        python -m tools.scripts.hooks_runner supply-chain sbom \
          --path . \
          --format json \
          --output "$SBOM_PATH"
        echo "sbom-path=$SBOM_PATH" >> $GITHUB_OUTPUT
    - name: Run Dependency Graph Analysis
      id: dep-graph
      shell: bash
      run: |
        set -eo pipefail
        ACTION="${{ inputs.action }}"
        SBOM="${{ steps.sbom.outputs.sbom-path }}"
        FORMAT="${{ inputs.format }}"
        OUTPUT="${{ inputs.output }}"

        output_args=()
        if [[ -n "$OUTPUT" ]]; then
          output_args=(--output "$OUTPUT")
        fi

        case "$ACTION" in
          analyze)
            python -m tools.scripts.hooks_runner dep-graph analyze \
              --sbom "$SBOM" \
              --format "$FORMAT" \
              "${output_args[@]}"
            ;;
          circular)
            python -m tools.scripts.hooks_runner dep-graph circular \
              --sbom "$SBOM" \
              --format "$FORMAT" \
              "${output_args[@]}"
            ;;
          conflicts)
            python -m tools.scripts.hooks_runner dep-graph conflicts \
              --sbom "$SBOM" \
              --format "$FORMAT" \
              "${output_args[@]}"
            ;;
          impact)
            python -m tools.scripts.hooks_runner dep-graph impact \
              --sbom "$SBOM" \
              --package "${{ inputs.package }}" \
              --new-version "${{ inputs.new-version }}" \
              "${output_args[@]}"
            ;;
          export)
            # export 只支持 mermaid / graphviz; 通用默认 (json) 归一到 mermaid
            export_format="$FORMAT"
            if [[ "$export_format" == "json" ]]; then
              export_format="mermaid"
            fi
            python -m tools.scripts.hooks_runner dep-graph export \
              --sbom "$SBOM" \
              --format "$export_format" \
              "${output_args[@]}"
            ;;
          *)
            echo "Unknown action: $ACTION"
            exit 1
            ;;
        esac
    - name: Upload dependency graph results
      if: inputs.output != '' && always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-graph-output
        path: ${{ inputs.output }}
        retention-days: 30
