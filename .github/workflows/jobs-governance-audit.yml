name: Governance Audit Reusable
on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of languages to audit, e.g. ["python","shell"]
        type: string
        default: '["python"]'
      timeout-minutes:
        description: Timeout in minutes per language
        type: number
        default: 15
jobs:
  governance-audit:
    name: Governance Audit (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.languages) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Setup TypeScript
      if: matrix.language == 'typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: package.json
    - name: Setup Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
    - name: Setup Rust
      if: matrix.language == 'rust'
      uses: dtolnay/rust-toolchain@stable
    - name: Install Python deps
      # 最小化安装：governance-auditor(Python) 委托 ruff/mypy/pytest 等由 tool_runner 执行，dev-core 覆盖；
      # bandit 单独安装。避免拉入 dev 全量(tree-sitter/otel/hypothesis/k8s 等)导致 CI 过重。
      # 若后续审计依赖语义/集成能力，按需补充 dev-semantic/dev-integration 并验证 collect/audit 不降。
      # 注意: 不能按 matrix.language == 'python' 条件安装 —— 审计器本身是 Python
      # 脚本(shell/go/rust 审计同样由它执行), 缺 loguru 会直接 ModuleNotFoundError。
      # 审计作业会跑**完整** pytest 套件, 因此测试所需的可选依赖同样要装
      # (AST 语义 tree-sitter / dashboard fastapi / chaos kubernetes /
      #  property hypothesis), 否则 collection ImportError 会让审计失败。
      run: pip install -e ".[dev-core,dev-semantic,search,dev-integration]"
    - name: Install bandit
      run: pip install bandit
      if: matrix.language == 'python'
    - name: Install shell toolchain
      # shell 审计需要 shellcheck + shfmt: 工具缺失时检查会显式失败(exit 127),
      # 不会静默跳过。shfmt 走 Go 安装(runner 自带 Go)。
      if: matrix.language == 'shell'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq shellcheck
        go install mvdan.cc/sh/v3/cmd/shfmt@latest
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Install TypeScript deps
      if: matrix.language == 'typescript'
      run: 'npm ci 2>/dev/null || npm install

        npm install -D eslint prettier typescript vitest @vitest/coverage-v8

        '
    - name: Install Go deps
      if: matrix.language == 'go'
      run: 'go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

        go install github.com/securego/gosec/v2/cmd/gosec@latest

        '
    - name: Install Rust deps
      if: matrix.language == 'rust'
      run: 'rustup component add rustfmt clippy

        cargo install cargo-audit

        '
    - name: Run governance audit
      id: audit
      run: 'python .jcode/scripts/governance-auditor.py full --lang ${{ matrix.language
        }}

        '
    - name: Upload audit artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: governance-audit-report-${{ matrix.language }}
        path: 'bandit-report.json

          '
        retention-days: 7
  governance-audit-summary:
    name: Governance Audit Summary
    needs: governance-audit
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check all languages passed
      env:
        RESULT: ${{ needs.governance-audit.result }}
      run: |
        echo "governance-audit result: $RESULT"
        if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
          echo "::error::governance-audit did not succeed: $RESULT"
          exit 1
        fi
        echo "✅ governance-audit summary OK ($RESULT)"
