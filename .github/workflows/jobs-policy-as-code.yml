name: Policy as Code (OPA/Rego) Reusable
on:
  workflow_call:
    inputs:
      action:
        description: Policy action to perform
        type: string
        required: true
      policy-dir:
        description: Directory containing Rego policies
        type: string
        required: false
        default: .jcode/policies
      input-data:
        description: JSON/YAML input data file for policy evaluation
        type: string
        required: false
      input-format:
        description: Input data format (json, yaml)
        type: string
        required: false
        default: json
      output-format:
        description: Output format (json, text, github)
        type: string
        required: false
        default: json
      fail-on-violation:
        description: Fail workflow on policy violation
        type: boolean
        required: false
        default: true
      bundles:
        description: Comma-separated OPA bundle URLs
        type: string
        required: false
jobs:
  policy-as-code:
    name: Policy as Code (OPA/Rego)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup OPA
      uses: open-policy-agent/setup-opa@v2
      with:
        version: latest
        download-url: https://openpolicyagent.org/downloads
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Upgrade setuptools
      run: pip install -U "setuptools>=83.0.0"
    - name: Install JCode
      run: pip install -e .
    - name: Install OPA Python SDK
      run: pip install opa-wasm
    - name: Generate input data if not provided
      if: inputs.input-data == ''
      id: generate-input
      run: "python -m tools.scripts.hooks_runner supply-chain sbom --output opa-input.json\
        \ --format json\npython -m tools.scripts.hooks_runner dep-graph analyze --sbom\
        \ opa-input.json --output opa-deps.json --format json\npython -m tools.scripts.hooks_runner\
        \ exception list --format json --output opa-exceptions.json\n\n# Combine all\
        \ data\npython -c \"\nimport json\nwith open('opa-input.json') as f: sbom\
        \ = json.load(f)\nwith open('opa-deps.json') as f: deps = json.load(f)\nwith\
        \ open('opa-exceptions.json') as f: exc = json.load(f)\n\ncombined = {\n \
        \ 'sbom': sbom,\n  'dependencies': deps,\n  'exceptions': exc,\n  'repository':\
        \ '${{ github.repository }}',\n  'branch': '${{ github.ref_name }}',\n  'commit':\
        \ '${{ github.sha }}',\n  'actor': '${{ github.actor }}'\n}\nwith open('opa-combined-input.json',\
        \ 'w') as f:\n  json.dump(combined, f, indent=2)\n\"\necho \"input-data=opa-combined-input.json\"\
        \ >> $GITHUB_OUTPUT\n"
    - name: Download policy bundles
      if: inputs.bundles != ''
      run: "IFS=',' read -ra BUNDLES <<< \"${{ inputs.bundles }}\"\nfor bundle in\
        \ \"\\${BUNDLES[@]}\"; do\n  echo \"Downloading bundle: \\$bundle\"\n  opa\
        \ download --bundle \"\\$bundle\" -o \"bundle_\\${RANDOM}.tar.gz\"\ndone\n"
    - name: Evaluate Policies
      id: policy-eval
      run: "set -e\nPOLICY_DIR=\"${{ inputs.policy-dir }}\"\nINPUT=\"${{ inputs.input-data\
        \ != '' && inputs.input-data || steps.generate-input.outputs.input-data }}\"\
        \nFORMAT=\"${{ inputs.output-format }}\"\n\nif [ ! -d \"\\$POLICY_DIR\" ];\
        \ then\n  echo \"Policy directory \\$POLICY_DIR does not exist\"\n  exit 1\n\
        fi\n\n# Run OPA eval\nopa eval \\\n  --data \"\\$POLICY_DIR\" \\\n  --input\
        \ \"\\$INPUT\" \\\n  --format \"\\$FORMAT\" \\\n  \"data.jcode.governance\"\
        \ > policy-results.json\n\n# Check for violations\nVIOLATIONS=$(cat policy-results.json\
        \ | jq -r '.result[0].expressions[0].value.violations // [] | length')\necho\
        \ \"Violations found: \\$VIOLATIONS\"\necho \"violations=\\$VIOLATIONS\" >>\
        \ \\$GITHUB_OUTPUT\n"
    - name: Upload policy results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: policy-evaluation-results
        path: policy-results.json
        retention-days: 30
    - name: Fail on violations
      if: inputs.fail-on-violation == 'true' && steps.policy-eval.outputs.violations
        != '0'
      run: 'echo "❌ Policy violations detected:"

        cat policy-results.json | jq -r ''.result[0].expressions[0].value.violations[]
        | "\(.rule): \(.message) [\(.severity)]"''

        exit 1

        '
    - name: Comment on PR with violations
      if: github.event_name == 'pull_request' && steps.policy-eval.outputs.violations
        != '0'
      uses: actions/github-script@v7
      with:
        script: "const fs = require('fs');\nconst results = JSON.parse(fs.readFileSync('policy-results.json',\
          \ 'utf8'));\nconst violations = results.result[0].expressions[0].value.violations\
          \ || [];\n\nlet body = '## ⚠️ Policy Violations Detected\\n\\n';\nbody +=\
          \ '| Rule | Message | Severity |\\n';\nbody += '|------|---------|----------|\\\
          n';\nfor (const v of violations) {\n  body += `| ${v.rule} | ${v.message}\
          \ | ${v.severity} |\\n`;\n}\n\ngithub.rest.issues.createComment({\n  issue_number:\
          \ context.issue.number,\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n\
          \  body: body\n});\n"
