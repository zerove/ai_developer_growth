name: Policy as Code (OPA/Rego) Reusable
on:
  workflow_call:
    inputs:
      action:
        description: Policy action to perform
        type: string
        required: true
      policy-dir:
        description: Directory containing Rego policies
        type: string
        required: false
        default: .jcode/policies
      input-data:
        description: JSON/YAML input data file for policy evaluation
        type: string
        required: false
      input-format:
        description: Input data format (json, yaml)
        type: string
        required: false
        default: json
      output-format:
        description: Output format (json, text, github)
        type: string
        required: false
        default: json
      fail-on-violation:
        description: Fail workflow on policy violation
        type: boolean
        required: false
        default: true
      bundles:
        description: Comma-separated OPA bundle URLs
        type: string
        required: false
jobs:
  policy-as-code:
    name: Policy as Code (OPA/Rego)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup OPA
      uses: open-policy-agent/setup-opa@v2
      with:
        version: latest
        download-url: https://openpolicyagent.org/downloads
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Upgrade setuptools
      run: pip install -U "setuptools>=83.0.0"
    - name: Install JCode
      run: pip install -e .
    - name: Install OPA Python SDK
      run: pip install opa-wasm
    # 说明: 之前这些步骤写成 YAML 双引号单行 + `\$VAR` 转义, bash 收到的是字面量
    # `$POLICY_DIR` (反斜杠转义掉了变量展开) → 策略目录检查必然失败, 作业必红。
    # 改用块脚本, 变量按 shell 语义正常展开。
    - name: Generate input data if not provided
      if: inputs.input-data == ''
      id: generate-input
      shell: bash
      run: |
        set -eo pipefail
        python -m tools.scripts.hooks_runner supply-chain sbom --output opa-input.json --format json
        python -m tools.scripts.hooks_runner dep-graph analyze --sbom opa-input.json --output opa-deps.json --format json
        python -m tools.scripts.hooks_runner exception list --format json --output opa-exceptions.json

        python - <<'PY'
        import json

        with open("opa-input.json") as f:
            sbom = json.load(f)
        with open("opa-deps.json") as f:
            deps = json.load(f)
        with open("opa-exceptions.json") as f:
            exceptions = json.load(f)

        combined = {
            "sbom": sbom,
            "dependencies": deps,
            "exceptions": exceptions,
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
        }
        with open("opa-combined-input.json", "w") as f:
            json.dump(combined, f, indent=2)
        PY

        echo "input-data=opa-combined-input.json" >> $GITHUB_OUTPUT
    - name: Download policy bundles
      if: inputs.bundles != ''
      shell: bash
      run: |
        set -eo pipefail
        IFS=',' read -ra BUNDLES <<< "${{ inputs.bundles }}"
        for bundle in "${BUNDLES[@]}"; do
          echo "Downloading bundle: $bundle"
          opa download --bundle "$bundle" -o "bundle_${RANDOM}.tar.gz"
        done
    - name: Evaluate Policies
      id: policy-eval
      shell: bash
      run: |
        set -eo pipefail
        POLICY_DIR="${{ inputs.policy-dir }}"
        INPUT="${{ inputs.input-data != '' && inputs.input-data || steps.generate-input.outputs.input-data }}"
        FORMAT="${{ inputs.output-format }}"

        if [ ! -d "$POLICY_DIR" ]; then
          echo "Policy directory $POLICY_DIR does not exist"
          exit 1
        fi

        # Run OPA eval
        opa eval \
          --data "$POLICY_DIR" \
          --input "$INPUT" \
          --format "$FORMAT" \
          "data.jcode.governance" > policy-results.json

        # Check for violations
        VIOLATIONS=$(jq -r '.result[0].expressions[0].value.violations // [] | length' policy-results.json)
        echo "Violations found: $VIOLATIONS"
        echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
    - name: Policy evaluation summary
      if: always()
      shell: bash
      run: |
        set -eo pipefail
        INPUT="${{ inputs.input-data != '' && inputs.input-data || steps.generate-input.outputs.input-data }}"
        POLICY_DIR="${{ inputs.policy-dir }}"

        POLICY_COUNT="0"
        if [ -d "$POLICY_DIR" ]; then
          POLICY_COUNT="$(find "$POLICY_DIR" -type f -name '*.rego' | wc -l | tr -d ' ')"
        fi

        EXC_COUNT="n/a"
        REVIEW_COUNT="n/a"
        if [ -f "$INPUT" ]; then
          EXC_COUNT="$(jq -r '(.exceptions // []) | length' "$INPUT" 2>/dev/null || echo "n/a")"
          # license_review: 许可证待复核(元数据不可得/无法归一化), 需人工盘点而非静默忽略
          REVIEW_COUNT="$(jq -r '[.. | objects | select(.review == "license_review" or .license == "REVIEW")] | length' "$INPUT" 2>/dev/null || echo "n/a")"
        fi

        VIOLATIONS="n/a"
        if [ -f policy-results.json ]; then
          VIOLATIONS="$(jq -r '.result[0].expressions[0].value.violations // [] | length' policy-results.json 2>/dev/null || echo "n/a")"
        fi

        {
          echo "## Policy 评估摘要"
          echo "- 已加载策略文件数: $POLICY_COUNT"
          echo "- 输入例外条数: $EXC_COUNT"
          echo "- 许可证待复核(license_review/REVIEW)计数: $REVIEW_COUNT"
          echo "- 违规总数: $VIOLATIONS"
          if [ "$POLICY_COUNT" = "0" ]; then
            echo "- ⚠️ 未加载任何策略文件：请确认 policy-dir 与仓库跟踪状态（规则可能未生效）"
          fi
          if [ "$VIOLATIONS" = "0" ]; then
            echo "- 提示: 0 违规不等同于规则已生效，请结合策略文件数与各规则命中分布判断"
          fi
          if [ "$EXC_COUNT" = "0" ]; then
            echo "- 提示: 输入例外为 0（无豁免）；如预期存在豁免请检查 exception list 来源"
          fi
          echo "- 按规则命中计数:"
          if [ -f policy-results.json ]; then
            jq -r '
              .result[0].expressions[0].value.violations // [] as $v
              | ["no-critical-vulns","license-compliance","dependency-freshness","exception-expiration","exception-expiring-soon"] as $known
              | ($v | group_by(.rule) | map({(.[0].rule): length}) | add // {}) as $hits
              | $known[] as $r | "  - \($r): \($hits[$r] // 0)"
            ' policy-results.json 2>/dev/null || echo "  - (无法解析 policy-results.json)"
          else
            echo "  - n/a (未生成 policy-results.json)"
          fi
        } | tee policy-summary.md

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat policy-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload policy results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: policy-evaluation-results
        path: |
          policy-results.json
          opa-combined-input.json
          opa-input.json
          opa-deps.json
          opa-exceptions.json
        if-no-files-found: ignore
        retention-days: 30
    - name: Fail on violations
      if: inputs.fail-on-violation == 'true' && steps.policy-eval.outputs.violations != '0'
      shell: bash
      run: |
        echo "❌ Policy violations detected:"
        jq -r '.result[0].expressions[0].value.violations[] | "\(.rule): \(.message) [\(.severity)]"' policy-results.json
        exit 1
    - name: Comment on PR with violations
      if: github.event_name == 'pull_request' && steps.policy-eval.outputs.violations != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('policy-results.json', 'utf8'));
          const violations = results.result[0].expressions[0].value.violations || [];

          let body = '## ⚠️ Policy Violations Detected\n\n';
          body += '| Rule | Message | Severity |\n';
          body += '|------|---------|----------|\n';
          for (const v of violations) {
            body += `| ${v.rule} | ${v.message} | ${v.severity} |\n`;
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
