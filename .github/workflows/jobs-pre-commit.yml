name: Pre-commit Hooks Reusable
on:
  workflow_call: {}
jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    # pre-commit 的 local 钩子(language: system)直接用本作业的 python:
    # 必须装 ruff/mypy(AI Quality Gate / lint 钩子要用), AST 语义检查要
    # tree-sitter; uv-lock-sync 钩子还要 uv(GitHub runner 默认没有)。
    - run: pip install -e ".[dev-core,dev-semantic]"
    - run: pip install uv
    - uses: pre-commit/action@v3.0.1
