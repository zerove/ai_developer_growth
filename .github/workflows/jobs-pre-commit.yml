name: Pre-commit Hooks Reusable
on:
  workflow_call: {}
jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    # pre-commit 的 local 钩子(language: system)直接用本作业的 python:
    # 必须装 ruff/mypy(AI Quality Gate / lint 钩子要用), AST 语义检查要
    # tree-sitter; 统计检查需要与标准测试环境一致的可选依赖(否则 collect-only
    # 会跳过部分测试模块, 导致测试用例数口径漂移); uv-lock-sync 钩子还要 uv。
    - run: pip install -e ".[dev-core,dev-semantic,search,dev-integration]"
    - run: pip install uv
    # README 统计在 docs-only 变更走 docs-governance, 但“新增/删除测试”只改 .py
    # 时 docs-governance 不触发; 在此补检可在代码 PR 上尽早发现统计漂移。
    - name: Stats drift check (README vs update_stats)
      run: python tools/scripts/update_stats.py --check
    - uses: pre-commit/action@v3.0.1
