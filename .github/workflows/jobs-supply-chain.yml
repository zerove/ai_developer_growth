name: Multi-language Supply Chain Reusable
on:
  workflow_call:
    inputs:
      action:
        description: Supply chain action to perform
        type: string
        required: true
      project-path:
        description: Path to project root (auto-detects languages)
        type: string
        required: false
        default: .
      format:
        description: Output format (json, spdx, cyclonedx)
        type: string
        required: false
        default: json
      output:
        description: Output file path
        type: string
        required: false
      policy-file:
        description: Path to policy file for compliance check
        type: string
        required: false
      severity:
        description: Minimum severity for vulnerability scan
        type: string
        required: false
        default: medium
      max-age-days:
        description: Maximum age in days for dependency freshness
        type: string
        required: false
        default: '90'
jobs:
  supply-chain:
    name: Multi-language Supply Chain
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        # 本仓库没有 Go 模块 (go.mod/go.sum), setup-go v5 默认开启缓存会去找
        # go.sum 并报 "Dependencies file is not found" —— 显式关掉。
        cache: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        rust-version: stable
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Upgrade setuptools
      run: pip install -U "setuptools>=83.0.0"
    - name: Install JCode
      run: pip install -e .
    - name: Run Supply Chain Action
      id: supply-chain
      shell: bash
      run: |
        set -eo pipefail
        ACTION="${{ inputs.action }}"
        PROJECT="${{ inputs.project-path }}"
        FORMAT="${{ inputs.format }}"
        OUTPUT="${{ inputs.output }}"
        POLICY_FILE="${{ inputs.policy-file }}"

        # 参数用数组拼装: 之前写成 `${policy-file:+--policy-file "..."}` 是错的 ——
        # bash 参数展开只认合法变量名, "policy-file" 带连字符会被解析成 `${policy`
        # 加字面量 "file:+--policy-file ..."，最终把 "file:+--policy-file" 当成 CLI
        # 参数传进去 → argparse 报 "unrecognized arguments"。
        output_args=()
        if [[ -n "$OUTPUT" ]]; then
          output_args=(--output "$OUTPUT")
        fi
        policy_args=()
        if [[ -n "$POLICY_FILE" ]]; then
          policy_args=(--policy-file "$POLICY_FILE")
        fi

        case "$ACTION" in
          sbom)
            python -m tools.scripts.hooks_runner supply-chain sbom \
              --path "$PROJECT" \
              --format "$FORMAT" \
              "${output_args[@]}"
            ;;
          scan)
            python -m tools.scripts.hooks_runner supply-chain scan \
              --path "$PROJECT" \
              --format "$FORMAT" \
              "${output_args[@]}" \
              "${policy_args[@]}"
            ;;
          compliance)
            python -m tools.scripts.hooks_runner supply-chain compliance \
              --path "$PROJECT" \
              --format "$FORMAT" \
              "${output_args[@]}" \
              "${policy_args[@]}"
            ;;
          freshness)
            python -m tools.scripts.hooks_runner supply-chain freshness \
              --path "$PROJECT" \
              --max-age-days "${{ inputs.max-age-days }}" \
              --format "$FORMAT" \
              "${output_args[@]}"
            ;;
          verify)
            python -m tools.scripts.hooks_runner supply-chain verify \
              --path "$PROJECT" \
              --format "$FORMAT" \
              "${output_args[@]}"
            ;;
          *)
            echo "Unknown action: $ACTION"
            exit 1
            ;;
        esac
    - name: Upload supply chain output
      if: inputs.output != '' && always()
      uses: actions/upload-artifact@v4
      with:
        name: supply-chain-output
        path: ${{ inputs.output }}
        retention-days: 30
