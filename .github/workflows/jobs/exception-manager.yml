name: Exception Manager Reusable
on:
  workflow_call:
    inputs:
      action:
        description: Exception action to perform
        type: string
        required: true
      request-id:
        description: Exception request ID
        type: string
        required: false
      rule-id:
        description: Rule ID for new exception
        type: string
        required: false
      paths:
        description: Comma-separated paths for exception
        type: string
        required: false
      reason:
        description: Reason for exception
        type: string
        required: false
      severity:
        description: Original severity
        type: string
        required: false
      requested-severity:
        description: Requested severity after exception
        type: string
        required: false
      expires:
        description: Expiration date (ISO format)
        type: string
        required: false
      created-by:
        description: Requester
        type: string
        required: false
      reviewer:
        description: Reviewer name
        type: string
        required: false
      comment:
        description: Approval/rejection comment
        type: string
        required: false
      status:
        description: Filter by status
        type: string
        required: false
jobs:
  exception-manager:
    name: Exception Manager
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Upgrade setuptools
      run: pip install -U "setuptools>=83.0.0"
    - name: Install JCode
      run: pip install -e .
    - name: Run Exception Manager
      id: exception
      run: "set -e\nACTION=\"${{ inputs.action }}\"\n\ncase \"$ACTION\" in\n  request)\n\
        \    python -m tools.scripts.hooks_runner exception request \\\n      --rule-id\
        \ \"${{ inputs.rule-id }}\" \\\n      --paths \"${{ inputs.paths }}\" \\\n\
        \      --reason \"${{ inputs.reason }}\" \\\n      --severity \"${{ inputs.severity\
        \ }}\" \\\n      --requested-severity \"${{ inputs.requested-severity }}\"\
        \ \\\n      --expires \"${{ inputs.expires }}\" \\\n      --created-by \"\
        ${{ inputs.created-by }}\"\n    ;;\n  approve)\n    python -m tools.scripts.hooks_runner\
        \ exception approve \\\n      --request-id \"${{ inputs.request-id }}\" \\\
        \n      --reviewer \"${{ inputs.reviewer }}\" \\\n      --comment \"${{ inputs.comment\
        \ }}\"\n    ;;\n  reject)\n    python -m tools.scripts.hooks_runner exception\
        \ reject \\\n      --request-id \"${{ inputs.request-id }}\" \\\n      --reviewer\
        \ \"${{ inputs.reviewer }}\" \\\n      --comment \"${{ inputs.comment }}\"\
        \n    ;;\n  revoke)\n    python -m tools.scripts.hooks_runner exception revoke\
        \ \\\n      --request-id \"${{ inputs.request-id }}\"\n    ;;\n  list)\n \
        \   python -m tools.scripts.hooks_runner exception list \\\n      --status\
        \ \"${{ inputs.status }}\"\n    ;;\n  check-expirations)\n    python -m tools.scripts.hooks_runner\
        \ exception check-expirations\n    ;;\n  audit)\n    python -m tools.scripts.hooks_runner\
        \ exception audit\n    ;;\n  sync-gitops)\n    python -m tools.scripts.hooks_runner\
        \ exception sync-gitops\n    ;;\n  *)\n    echo \"Unknown action: $ACTION\"\
        \n    exit 1\n    ;;\nesac\n"
    - name: Upload exception audit
      if: inputs.action == 'audit' && always()
      uses: actions/upload-artifact@v4
      with:
        name: exception-audit
        path: exception-audit.json
        retention-days: 30
