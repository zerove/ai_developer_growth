on:
  workflow_call: {}
name: Governance Audit Reusable
true:
  workflow_call:
    inputs:
      languages:
        description: Comma-separated languages to audit (python,typescript,go,rust)
        type: string
        default: python
      timeout-minutes:
        description: Timeout in minutes per language
        type: number
        default: 15
jobs:
  governance-audit:
    name: Governance Audit (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(format('["{0}"]', replace(inputs.languages, ',', '","')))
          }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Setup TypeScript
      if: matrix.language == 'typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: package.json
    - name: Setup Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
    - name: Setup Rust
      if: matrix.language == 'rust'
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    - name: Install Python deps
      run: pip install -e ".[dev,tools]"
      if: matrix.language == 'python'
    - name: Install bandit
      run: pip install bandit
      if: matrix.language == 'python'
    - name: Install TypeScript deps
      if: matrix.language == 'typescript'
      run: 'npm ci 2>/dev/null || npm install

        npm install -D eslint prettier typescript vitest @vitest/coverage-v8

        '
    - name: Install Go deps
      if: matrix.language == 'go'
      run: 'go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

        go install github.com/securego/gosec/v2/cmd/gosec@latest

        '
    - name: Install Rust deps
      if: matrix.language == 'rust'
      run: 'rustup component add rustfmt clippy

        cargo install cargo-audit

        '
    - name: Run governance audit
      id: audit
      run: 'python .jcode/scripts/governance-auditor.py full --lang ${{ matrix.language
        }}

        '
    - name: Upload audit artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: governance-audit-report-${{ matrix.language }}
        path: 'bandit-report.json

          .jcode/mode_decision.conf

          '
        retention-days: 7
  governance-audit-summary:
    name: Governance Audit Summary
    needs: governance-audit
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check all languages passed
      run: "for lang in ${{ inputs.languages }}; do\n  echo \"Checking $lang...\"\n\
        \  # In practice, GitHub Actions sets job status via needs.<job>.result\n\
        done\n# If any language failed, this will fail\necho \"${{ needs.governance-audit.result\
        \ }}\" | grep -q failure && exit 1 || exit 0\n"
'on':
  workflow_call: {}
