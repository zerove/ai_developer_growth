name: License Scan Reusable
on:
  workflow_call: {}
jobs:
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: pip install pip-licenses
    - run: pip-licenses --format=json --output-file=licenses.json
    - run: "python -c \"\nimport json\ndisallowed = ['GPL-3.0', 'AGPL-3.0', 'SSPL-1.0',\
        \ 'BSL-1.0', 'ELv2']\nwith open('licenses.json') as f: licenses = json.load(f)\n\
        violations = [f\\\"{p['Name']}: {p['License']}\\\" for p in licenses if any(d\
        \ in p.get('License','') for d in disallowed)]\nif violations:\n    print('::error::Disallowed\
        \ licenses:')\n    for v in violations: print(f'  {v}')\n    exit(1)\nprint('All\
        \ licenses allowed')\n\"\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: license-report
        path: licenses.json
        retention-days: 30
