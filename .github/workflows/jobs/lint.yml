name: 'Lint & Format Reusable'
on:
  workflow_call: {}
jobs:
  lint:
    name: 'Lint & Format'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Read ruff version from pyproject.toml
      id: ruff-version
      run: "python -c \"\nimport tomllib\nimport re\nwith open('pyproject.toml', 'rb')\
        \ as f:\n    data = tomllib.load(f)\n# Find ruff version in dev dependencies\n\
        dev_deps = data.get('project', {}).get('optional-dependencies', {}).get('dev',\
        \ [])\nruff_version = '0.15.17'  # fallback\nfor dep in dev_deps:\n    if\
        \ dep.startswith('ruff'):\n        # Extract version specifier (==, >=, etc.)\n\
        \        ruff_version = dep[4:]  # remove 'ruff'\n        break\nprint(f'ruff_version={ruff_version}')\n\
        \" >> $GITHUB_OUTPUT\n"
    - run: pip install ruff${{ steps.ruff-version.outputs.ruff_version }}
    - name: Ruff check
      run: ruff check .
    - name: Ruff format check
      run: ruff format --check .
