name: "Policy as Code (OPA/Rego) Reusable"

on:
  workflow_call:
    inputs:
      action:
        description: "Policy action to perform"
        type: string
        required: true
      policy-dir:
        description: "Directory containing Rego policies"
        type: string
        required: false
        default: ".jcode/policies"
      input-data:
        description: "JSON/YAML input data file for policy evaluation"
        type: string
        required: false
      input-format:
        description: "Input data format (json, yaml)"
        type: string
        required: false
        default: "json"
      output-format:
        description: "Output format (json, text, github)"
        type: string
        required: false
        default: "json"
      fail-on-violation:
        description: "Fail workflow on policy violation"
        type: boolean
        required: false
        default: true
      bundles:
        description: "Comma-separated OPA bundle URLs"
        type: string
        required: false

jobs:
  policy-as-code:
    name: Policy as Code (OPA/Rego)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v3
        with:
          version: "latest"
          download-url: https://openpolicyagent.org/downloads

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade setuptools
        run: pip install -U "setuptools>=83.0.0"

      - name: Install JCode
        run: pip install -e .

      - name: Install OPA Python SDK
        run: pip install opa-wasm

      - name: Generate input data if not provided
        if: inputs.input-data == ''
        id: generate-input
        run: |
          python -m tools.scripts.hooks_runner supply-chain sbom --output opa-input.json --format json
          python -m tools.scripts.hooks_runner dep-graph analyze --sbom opa-input.json --output opa-deps.json --format json
          python -m tools.scripts.hooks_runner exception list --format json --output opa-exceptions.json

          # Combine all data
          python -c "
          import json
          with open('opa-input.json') as f: sbom = json.load(f)
          with open('opa-deps.json') as f: deps = json.load(f)
          with open('opa-exceptions.json') as f: exc = json.load(f)

          combined = {
            'sbom': sbom,
            'dependencies': deps,
            'exceptions': exc,
            'repository': '${{ github.repository }}',
            'branch': '${{ github.ref_name }}',
            'commit': '${{ github.sha }}',
            'actor': '${{ github.actor }}'
          }
          with open('opa-combined-input.json', 'w') as f:
            json.dump(combined, f, indent=2)
          "
          echo "input-data=opa-combined-input.json" >> $GITHUB_OUTPUT

      - name: Download policy bundles
        if: inputs.bundles != ''
        run: |
          IFS=',' read -ra BUNDLES <<< "${{ inputs.bundles }}"
          for bundle in "\${BUNDLES[@]}"; do
            echo "Downloading bundle: \$bundle"
            opa download --bundle "\$bundle" -o "bundle_\${RANDOM}.tar.gz"
          done

      - name: Evaluate Policies
        id: policy-eval
        run: |
          set -e
          POLICY_DIR="${{ inputs.policy-dir }}"
          INPUT="${{ inputs.input-data != '' && inputs.input-data || steps.generate-input.outputs.input-data }}"
          FORMAT="${{ inputs.output-format }}"

          if [ ! -d "\$POLICY_DIR" ]; then
            echo "Policy directory \$POLICY_DIR does not exist"
            exit 1
          fi

          # Run OPA eval
          opa eval \
            --data "\$POLICY_DIR" \
            --input "\$INPUT" \
            --format "\$FORMAT" \
            "data.jcode.governance" > policy-results.json

          # Check for violations
          VIOLATIONS=$(cat policy-results.json | jq -r '.result[0].expressions[0].value.violations // [] | length')
          echo "Violations found: \$VIOLATIONS"
          echo "violations=\$VIOLATIONS" >> \$GITHUB_OUTPUT

      - name: Upload policy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-evaluation-results
          path: policy-results.json
          retention-days: 30

      - name: Fail on violations
        if: inputs.fail-on-violation == 'true' && steps.policy-eval.outputs.violations != '0'
        run: |
          echo "❌ Policy violations detected:"
          cat policy-results.json | jq -r '.result[0].expressions[0].value.violations[] | "\(.rule): \(.message) [\(.severity)]"'
          exit 1

      - name: Comment on PR with violations
        if: github.event_name == 'pull_request' && steps.policy-eval.outputs.violations != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('policy-results.json', 'utf8'));
            const violations = results.result[0].expressions[0].value.violations || [];

            let body = '## ⚠️ Policy Violations Detected\n\n';
            body += '| Rule | Message | Severity |\n';
            body += '|------|---------|----------|\n';
            for (const v of violations) {
              body += `| ${v.rule} | ${v.message} | ${v.severity} |\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
