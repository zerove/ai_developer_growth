name: "Quality Gates Reusable"

on:
  workflow_call:
    inputs:
      target-path:
        description: "Path to check"
        type: string
        default: "tools/scripts"

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Link audit
        run: python tools/scripts/hooks_runner.py quality-gate --path . --check-annotation --check-security --check-type --check-error
      - name: Case study validation
        run: python tools/scripts/validate_case_study.py --all
      - name: Governance docs validation
        run: python tools/scripts/hooks_runner.py governance-audit --validate-docs
      - name: AI-SDLC compliance
        run: python tools/scripts/hooks_runner.py governance-audit --check-ai-sdlc
      - name: Hallucination risk audit
        run: python tools/scripts/hooks_runner.py governance-audit --audit-hallucination || true
      - name: Language rules check
        run: python tools/scripts/hooks_runner.py language-rules --path ${{ inputs.target-path }}
      - name: Agent validation
        run: python tools/scripts/validate_agent_definition.py --path agents/
      - name: Enforcement check
        run: python tools/scripts/hooks_runner.py quality-gate --path ${{ inputs.target-path }} --check-annotation
