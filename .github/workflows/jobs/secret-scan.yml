name: Secret Scanning Reusable
on:
  workflow_call: {}
jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install trufflehog
      run: 'curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh
        | sh -s -- -b /usr/local/bin

        '
    - name: Run trufflehog
      run: "trufflehog git https://github.com/${{ github.repository }} --since_commit\
        \ HEAD~10 --json --exclude_paths .trufflehogignore > trufflehog-results.json\
        \ || true\nFINDINGS=$(cat trufflehog-results.json | jq -s 'flatten | length')\n\
        if [ \"$FINDINGS\" -gt 0 ]; then\n  echo \"::error::Found $FINDINGS secrets\"\
        \n  cat trufflehog-results.json | jq -r '.[] | \"\\(.DetectorType): \\(.Decoder).\\\
        (.Verified)\"' | head -20\n  exit 1\nfi\n"
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: secret-scan
        path: trufflehog-results.json
        retention-days: 30
