name: Secret Scanning Reusable
on:
  workflow_call: {}
jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install trufflehog
      run: 'curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh
        | sh -s -- -b /usr/local/bin

        '
    - name: Run trufflehog
      run: |
        set -euo pipefail
        TOOL_OK=1
        trufflehog git "https://github.com/${{ github.repository }}" --since_commit HEAD~10 --json --exclude_paths .trufflehogignore > trufflehog-results.json || TOOL_OK=0
        if [ "$TOOL_OK" -ne 0 ] && [ ! -s trufflehog-results.json ]; then
          echo "::error::trufflehog 执行失败且无可用结果，扫描不可信（fail-closed）"
          exit 1
        fi
        if ! FINDINGS=$(jq -s 'flatten | length' trufflehog-results.json 2>/dev/null); then
          echo "::error::无法解析 trufflehog-results.json，扫描结果不可信"
          exit 1
        fi
        if [ "${FINDINGS:-0}" -gt 0 ]; then
          echo "::error::Found $FINDINGS secrets"
          jq -r '.[] | "\(.DetectorType): \(.Decoder).\(.Verified)"' trufflehog-results.json 2>/dev/null | head -20 || true
          exit 1
        fi
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: secret-scan
        path: trufflehog-results.json
        retention-days: 30
