name: "Secret Scanning Reusable"

on:
  workflow_call:

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - name: Run trufflehog
        run: |
          trufflehog git https://github.com/${{ github.repository }} --since_commit HEAD~10 --json --exclude_paths .trufflehogignore > trufflehog-results.json || true
          FINDINGS=$(cat trufflehog-results.json | jq -s 'flatten | length')
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::Found $FINDINGS secrets"
            cat trufflehog-results.json | jq -r '.[] | "\(.DetectorType): \(.Decoder).\(.Verified)"' | head -20
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan
          path: trufflehog-results.json
          retention-days: 30
