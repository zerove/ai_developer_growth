on:
  workflow_call: {}
name: Security Scan Reusable
true:
  workflow_call: null
jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Upgrade setuptools
      run: pip install -U "setuptools>=83.0.0"
    - run: pip install bandit pip-audit
    - name: Bandit scan
      run: bandit -r tools/scripts/ -f json -o bandit-report.json || true
    - name: Pip-audit
      run: pip-audit --desc
    - name: Upload bandit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
'on':
  workflow_call: {}
