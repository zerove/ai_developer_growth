name: Security Scan Reusable
on:
  workflow_call: {}
jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Upgrade setuptools
      run: pip install -U "setuptools>=83.0.0"
    - run: pip install bandit pip-audit
    # -ll = 只在 medium 及以上severity 时失败。当前仓库有 171 条 low
    # （多为 assert / subprocess 之类信息项），默认阈值会让门禁永远红；
    # 真正的信号是 medium/high。原先 `|| true` 把结果整个丢掉，等于没有门禁。
    - name: Bandit scan
      run: bandit -r tools/scripts/ -ll -f json -o bandit-report.json
    - name: Pip-audit
      run: pip-audit --desc
    - name: Upload bandit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
