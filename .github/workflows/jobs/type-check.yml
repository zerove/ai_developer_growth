name: Type Check Reusable
on:
  workflow_call: {}
jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml
    - run: pip install mypy
    - name: Restore mypy cache
      uses: actions/cache@v4
      with:
        path: .mypy_cache
        key: ${{ github.repository }}-mypy-${{ hashFiles('tools/**/*.py', '.jcode/scripts/**/*.py', 'ai-dev-framework/src/**/*.py', 'pyproject.toml') }}
        restore-keys: |
          ${{ github.repository }}-mypy-
    - name: Mypy (strict)
      # 与本地/pyproject 口径对齐：覆盖 tools 全包 + .jcode/scripts + ai-dev-framework/src
      run: mypy tools .jcode ai-dev-framework/src
