name: Language Rules Enhanced CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────
  # Full Validation + PR Comment
  # ──────────────────────────────────────────────────────
  validate-and-comment:
    name: Validate & Comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run full validation
        id: validate
        run: |
          python tools/scripts/validate_language_rules.py \
            --all --format json --format sarif \
            -o results.json -o results.sarif \
            --health-score 2>&1 | tee validate-output.txt || true

          # Extract health score
          HEALTH=$(python -c "
          import json
          try:
              with open('results.json') as f:
                  data = json.load(f)
              print(data.get('health_score', {}).get('score', 'N/A'))
          except: print('N/A')
          " 2>/dev/null || echo "N/A")

          # Count issues
          ERRORS=$(python -c "
          import json
          try:
              with open('results.json') as f:
                  data = json.load(f)
              total = sum(len(r.get('issues', [])) for r in data.get('results', []))
              print(total)
          except: print(0)
          " 2>/dev/null || echo "0")

          echo "health=$HEALTH" >> $GITHUB_OUTPUT
          echo "issues=$ERRORS" >> $GITHUB_OUTPUT

      - name: Generate badge
        run: |
          HEALTH="${{ steps.validate.outputs.health }}"
          if [ "$HEALTH" != "N/A" ] && [ -n "$HEALTH" ]; then
            # Determine color based on score
            if [ "$HEALTH" -ge 90 ]; then COLOR="brightgreen"
            elif [ "$HEALTH" -ge 70 ]; then COLOR="green"
            elif [ "$HEALTH" -ge 50 ]; then COLOR="yellow"
            elif [ "$HEALTH" -ge 30 ]; then COLOR="orange"
            else COLOR="red"
            fi

            curl -s "https://img.shields.io/badge/health%20score-${HEALTH}%2F100-${COLOR}" > badge.svg
            echo "Badge generated: health=$HEALTH"
          fi

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const health = '${{ steps.validate.outputs.health }}';
            const issues = '${{ steps.validate.outputs.issues }}';

            let badge = '';
            if (health !== 'N/A' && health !== '') {
              const score = parseInt(health);
              let color = 'red';
              if (score >= 90) color = 'brightgreen';
              else if (score >= 70) color = 'green';
              else if (score >= 50) color = 'yellow';
              else if (score >= 30) color = 'orange';

              badge = `![Health Score](https://img.shields.io/badge/health%20score-${health}%2F100-${color})`;
            }

            const body = `## 🔍 AI Language Rules - Code Quality Report

            ${badge}

            ### Summary
            | Metric | Value |
            |--------|-------|
            | Health Score | **${health}**/100 |
            | Total Issues | **${issues}** |
            | Languages | 26 |
            | Rules | 262+ |

            ### Details
            - SARIF results uploaded to GitHub Code Scanning
            - Full JSON report available as workflow artifact

            <details>
            <summary>📊 Quick Commands</summary>

            \`\`\`bash
            # Validate locally
            python tools/scripts/validate_language_rules.py --all

            # With health score
            python tools/scripts/validate_language_rules.py --all --health-score

            # Auto-fix
            python tools/scripts/validate_language_rules.py --all --fix
            \`\`\`
            </details>

            ---
            *Generated by [AI Language Rules](https://github.com/1jehuang/jcode) CI*`;

            // Find and update or create comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = 'AI Language Rules - Code Quality Report';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-rules-results
          path: |
            results.json
            results.sarif
            badge.svg
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # Trend Tracking
  # ──────────────────────────────────────────────────────
  trend:
    name: Record Trend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run validation and record
        run: |
          python tools/scripts/validate_language_rules.py \
            --all --format json -o results.json --health-score 2>&1 || true

          python tools/scripts/rule_tracker.py record \
            --file results.json \
            --project "${{ github.repository }}" 2>&1 || true

      - name: Commit trend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ~/.ai-rules-tracking/records.jsonl || true
          git diff --cached --quiet || git commit -m "chore: update rule effectiveness tracking [skip ci]" && git push || true
