name: Mutation Testing (Nightly)

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    name: Mutation Testing (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install "mutmut>=2.4.0,<3"

      - name: Run mutation testing
        run: |
          # `--max-runtime` 是 mutmut 3.x 的选项, 2.x 没有 → 必须去掉.
          # 超时用 shell 的 `timeout`(超时返回码 124)处理, job 级 timeout-minutes: 120 兜底.
          timeout 1500 mutmut run --paths-to-mutate tools/scripts/rules_engine --runner "python -m pytest tests/ -x --tb=short -q" --no-progress

      - name: Generate mutation report
        run: |
          mutmut results > mutation-report.txt
          cat mutation-report.txt

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.txt
          retention-days: 30
