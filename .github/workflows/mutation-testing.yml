name: Mutation Testing (Nightly)

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC (只读报告，不阻断 PR)
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    name: Mutation Testing (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          # 必须加引号: bash 会把未加引号的 `>=2.4.0,<3` 当成重定向
          pip install "mutmut>=2.4.0,<3"

      # mutmut 2.x 把变异状态缓存进 SQLite (.mutmut-cache): 主进程与变异 worker
      # 进程并发写同一个库文件, 默认 journal 模式下必然 "database is locked",
      # 作业会在检查阶段直接崩溃 (表现为大量 mutant 未测试 + 进程挂死)。
      # 先用 WAL 模式建库, 读写不再互相阻塞。
      - name: Prepare mutmut cache database
        run: |
          python -c "import sqlite3; con = sqlite3.connect('.mutmut-cache'); con.execute('PRAGMA journal_mode=WAL'); con.close()"

      - name: Run mutation testing
        run: |
          # 变异范围限定在有专属测试的小模块: 每个 mutant 都要重跑一次测试,
          # 对整个 rules_engine 做变异测试是数小时的量级, 夜间作业必然超时。
          # --CI: 存活变异体不阻断作业 (结论写进报告 artifact), 致命错误仍失败。
          # 超时用 shell 的 `timeout`(超时返回码 124)处理, job 级 timeout-minutes 兜底。
          timeout 2400 mutmut run \
            --paths-to-mutate tools/scripts/_sc_pypi.py \
            --runner "python -m pytest tests/test_supply_chain_compliance_policy.py tests/test_sc_pypi_mutant_hardening.py -x -q -p no:cacheprovider" \
            --CI \
            --no-progress

      # 扩面 2: license_review 复核流核心路径 (supply_runner)。
      # runner 限定为该路径的专属契约测试 (归因/台账/diff/ratchet/allowlist/处置流转),
      # 与上方 pypi 目标共用同一个 WAL 缓存库 (mutmut 按源文件区分, 互不串扰)。
      - name: Run mutation testing (supply_runner)
        run: |
          timeout 3000 mutmut run \
            --paths-to-mutate tools/scripts/hooks/supply_runner.py \
            --runner "python -m pytest tests/test_supply_license_review.py tests/test_supply_license_review_flow.py tests/test_supply_runner_round2.py tests/test_supply_chain_compliance_policy.py -x -q -p no:cacheprovider" \
            --CI \
            --no-progress

      # 扩面 3: _sc_scanners / _sc_models 扫描器与数据模型核心逻辑。
      # mutmut 2.x 的 --paths-to-mutate 支持逗号分隔多目标; _sc_models 属纯逻辑
      # (枚举/数据类序列化), _sc_scanners 属扫描决策逻辑 (OSV/GHSA/License/Signature/
      # SupplyChain), 与既有两个目标共用同一个 WAL 缓存库 (按源文件区分, 互不串扰)。
      - name: Run mutation testing (scanners_and_models)
        run: |
          timeout 1800 mutmut run \
            --paths-to-mutate tools/scripts/_sc_scanners.py,tools/scripts/_sc_models.py \
            --runner "python -m pytest tests/test_supply_chain_compliance_policy.py tests/test_supply_chain_unit.py -x -q -p no:cacheprovider" \
            --CI \
            --no-progress

      - name: Generate mutation report
        run: |
          mutmut results > mutation-report.txt
          cat mutation-report.txt

      - name: Generate supply runner mutation report
        run: |
          # results 只列出未击杀变异体; 按目标文件过滤, 避免混入 pypi 目标结论。
          # grep 无匹配 (全部击杀) 时报告为空, 由得分门禁按缓存计数兜底判定。
          mutmut results | grep "supply_runner" > mutation-supply-report.txt || true
          cat mutation-supply-report.txt

      - name: Generate scanners_and_models mutation report
        run: |
          # results 只列出未击杀变异体; 按目标文件过滤, 避免混入既有目标结论。
          mutmut results | grep -e "_sc_scanners" -e "_sc_models" > mutation-scanners-report.txt || true
          cat mutation-scanners-report.txt

      - name: Check mutation score (scanners_and_models)
        # 基准阈值 0.1（2026-11-22 本地实测击杀率 ~13.2%, 低于阈值即判定通过；
        # 低于实测值的保守值, 避免 nightly 报告自动变红成假绿; 后续提升
        # 扫描器/模型覆盖杀伤力时可逐步回调）。
        continue-on-error: true
        run: |
          python -m tools.scripts.mutation_score \
            --cache .mutmut-cache \
            --paths tools/scripts/_sc_scanners.py tools/scripts/_sc_models.py \
            --min-rate 0.1 \
            --report mutation-scanners-report.txt

      - name: Upload scanners_and_models mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-scanners-report
          path: mutation-scanners-report.txt
          retention-days: 30

      # 夜间只读基线：击杀率阈值告警但不阻断 PR/merge（报告已上传 artifact）。
      # --paths: 只统计对应目标的变异体, 两个目标共用缓存时不能混合计分。
      - name: Check mutation score
        continue-on-error: true
        run: |
          python -m tools.scripts.mutation_score \
            --cache .mutmut-cache \
            --paths tools/scripts/_sc_pypi.py \
            --min-rate 0.6 \
            --report mutation-report.txt

      - name: Check mutation score (supply_runner)
        # 基准阈值 0.4（2026-11-22 测得当前 supply_runner 击杀率 40.9%，
        # 更高阈值（如 0.5）会让 nightly 生报告自动变红成假绿；未来提升
        # 击杀率时可逐步回调阈值）。
        continue-on-error: true
        run: |
          python -m tools.scripts.mutation_score \
            --cache .mutmut-cache \
            --paths tools/scripts/hooks/supply_runner.py \
            --min-rate 0.4 \
            --report mutation-supply-report.txt

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.txt
          retention-days: 30

      - name: Upload supply runner mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-supply-report
          path: mutation-supply-report.txt
          retention-days: 30
