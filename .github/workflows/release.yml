name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v2.4.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────
  # Pre-release validation — 复用 .github/workflows/jobs/ 的可复用 workflow
  # 实现 P2-6 CI 收敛：ci.yml 是唯一 lint/test/type-check 入口，
  # release.yml validate 也只调 jobs，不内联 step
  # ──────────────────────────────────────────────────────
  lint:
    name: Lint (Reusable)
    uses: ./.github/workflows/jobs/lint.yml
    secrets: inherit

  type-check:
    name: Type Check (Reusable)
    uses: ./.github/workflows/jobs/type-check.yml
    secrets: inherit

  test:
    name: Tests (Reusable)
    uses: ./.github/workflows/jobs/tests.yml
    with:
      python-version: "3.11"
    secrets: inherit

  doctor-gate:
    name: Gate Doctor (Reusable)
    uses: ./.github/workflows/jobs/doctor-gate.yml
    secrets: inherit

  pre-commit:
    name: Pre-commit (Reusable)
    uses: ./.github/workflows/jobs/pre-commit.yml
    secrets: inherit

  governance-audit:
    name: Governance Audit (Reusable)
    uses: ./.github/workflows/jobs/governance-audit.yml
    with:
      languages: "python,typescript,javascript,go,rust,java,cpp,csharp,ruby,php,swift,kotlin"
      timeout-minutes: 20
    secrets: inherit

  validate:
    name: Pre-release Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
    needs: [lint, type-check, test, doctor-gate, pre-commit, governance-audit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version consistency check
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          PY_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "//' | sed 's/"//')
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION pyproject=$PY_VERSION"
            exit 1
          fi
          echo "Version consistent: $TAG_VERSION"
      - name: Check CHANGELOG
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if ! grep -q "## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for $TAG_VERSION"
            exit 1
          fi
          echo "CHANGELOG entry found"

  # ──────────────────────────────────────────────────────
  # Build package
  # ──────────────────────────────────────────────────────
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install build
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Verify package
        run: |
          ls -la dist/
          python -m twine check dist/*
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 90

  # ──────────────────────────────────────────────────────
  # Publish to PyPI
  # ──────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ──────────────────────────────────────────────────────
  # Create GitHub Release
  # ──────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog
        id: changelog
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          # 提取指定版本的 changelog 区块（至下一个版本标题为止）。
          # 注意不能用 /start/,/end/ 区间：start 行自身满足 /^## \[/ 会立即关闭区间，只输出 1 行
          awk -v v="$TAG_VERSION" \
            '$0 ~ "^## \\[" v "\\]" {f=1; print; next} f && $0 ~ /^## \[/ {exit} f' \
            CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog found, using default"
            echo "Release $TAG_VERSION" > release_notes.md
          fi
          cat release_notes.md
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false

  # ──────────────────────────────────────────────────────
  # Update latest release alias
  # ──────────────────────────────────────────────────────
  update-latest:
    name: Update Latest Release Alias
    runs-on: ubuntu-latest
    needs: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      contents: write
    steps:
      - name: Update latest release tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const latestRelease = releases.find(r => !r.draft && !r.prerelease);
            if (latestRelease && latestRelease.tag_name === tag) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: latestRelease.id,
                make_latest: true,
              });
              console.log(`Marked ${tag} as latest release`);
            }
