name: Scheduled Governance Audit

on:
  schedule:
    # 每周一 09:00 UTC 运
    - cron: "0 9 * * 1"
    # 每月 1 号 10:00 UTC 运行效率报告
    - cron: "0 10 1 * *"
  workflow_dispatch:
    inputs:
      audit_type:
        description: "审计类型"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - weekly
          - monthly

concurrency:
  group: scheduled-governance-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  governance-audit:
    name: Governance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史: 治理审计跑测试套件, test_release 等依赖 git log 条数与既有 tag.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev,tools]"
          pip install ruff mypy pytest pytest-cov pyyaml bandit

      - name: Run full governance audit
        run: python .jcode/scripts/governance-auditor.py full --lang python

      - name: Run AI Quality Gate
        run: python .jcode/scripts/governance-auditor.py ai-quality-gate

      - name: Run link audit
        # --check 不是 link_auditor 的合法参数（合法的是 --check-all /
        # --fail-on-broken），此前拼错后又被 || true 吞掉，等于静默失效。
        run: python -m tools.scripts.link_auditor . --check-all

      - name: Run doc code refs check
        # D-02: 正文中仓库代码路径引用必须真实存在
        run: python -m tools.scripts.check_doc_code_refs

      - name: Run case validation
        run: python -m tools.scripts.validate_case_study --all

  weekly-scan:
    name: Weekly Knowledge Scan
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * 1' || github.event.inputs.audit_type == 'weekly'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan case studies
        run: python -m tools.scripts.validate_case_study --all
      - name: Update tool matrix
        run: python -m tools.scripts.update_ai_tool_matrix --check

  monthly-report:
    name: Monthly Efficiency Report
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 10 1 * *' || github.event.inputs.audit_type == 'monthly'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # 以下步骤是"尽力而为"的报告/采集类任务：失败不应让整条流水线变红，
      # 但必须让失败可见 —— 用 continue-on-error 而非 `|| true`，
      # 后者会让作业显示为全绿，把问题彻底掩盖。
      - name: Generate efficiency report
        continue-on-error: true
        run: python .jcode/scripts/workflow-optimizer.py report
      - name: Audit hallucination risks
        run: python .jcode/scripts/governance-auditor.py audit-hallucination-risks
      - name: Run pattern learner
        continue-on-error: true
        run: python -c "from tools.scripts.rules_engine.pattern_learner import run_pattern_learning; run_pattern_learning('.')"

  monthly-db-maintain:
    name: 'Monthly DB Maintenance & Trend Collection'
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 10 1 * *' || github.event.inputs.audit_type == 'monthly'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev,tools]"
          pip install ruff mypy pytest pytest-cov pyyaml bandit
      - name: Prune quality_runs history (90d retention)
        continue-on-error: true
        run: python -m tools.scripts.hooks_runner db-maintain --retention-days 90
      - name: Collect quality gate trend snapshot
        continue-on-error: true
        run: python -m tools.scripts.update_stats --json
