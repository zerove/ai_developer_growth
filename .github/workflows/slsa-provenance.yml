name: 'SLSA Provenance & Signing'

on:
  release:
    types: [published]
  workflow_dispatch:

# 最小默认权限；可复用 SLSA generator 需要在 job 级声明额外权限。
permissions:
  contents: read

concurrency:
  group: slsa-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build & Hash Artifacts'
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          pip install build twine

      - name: Build package
        run: |
          python -m build --wheel --sdist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign artifacts with cosign (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          # 对 dist 产物进行 keyless 签名（按实际产物扩展名匹配）
          shopt -s nullglob
          files=(dist/*.whl dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No dist artifacts found to sign"
            exit 1
          fi
          for f in "${files[@]}"; do
            cosign sign-blob --yes "$f" --bundle "${f}.bundle"
          done

      - name: Generate base64 subjects for SLSA
        id: hash
        run: |
          set -euo pipefail
          cd dist
          echo "digests=$(sha256sum *.whl *.tar.gz 2>/dev/null | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slsa-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.bundle
          retention-days: 90

      - name: Attest provenance to release
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  provenance:
    name: 'Generate SLSA Provenance'
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: false
