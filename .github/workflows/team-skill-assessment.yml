name: Team Skill Assessment

on:
  schedule:
    - cron: '0 9 * * 1'  # 每周一上午 9 点 (UTC)
  workflow_dispatch:
    inputs:
      team:
        description: 'Team name'
        required: true
        type: string
        default: 'all'
      mode:
        description: 'Assessment mode'
        type: choice
        options: [full, quick, demo]
        default: 'full'

jobs:
  team-assessment:
    name: Team Skill Assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            examples/capability-radar/requirements.txt
            tools/scripts/team-radar-collect.py

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Install capability-radar
        run: |
          pip install -e examples/capability-radar

      - name: Find changed case studies
        if: github.event_name == 'pull_request'
        id: changes
        run: |
          echo "CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD -- case-studies/ | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Validate changed case studies
        if: steps.changes.outputs.CHANGED != ''
        run: |
          for path in ${{ steps.changes.outputs.CHANGED }}; do
            case_root=$(dirname "$path")
            case_name=$(basename "$case_root")
            
            echo "🔍 Validating: $case_name ($path)"
            python tools/scripts/validate_case_study.py --path "$path" --strict
            
            if [ $? -ne 0 ]; then
              echo "❌ Validation failed for $case_name"
              exit 1
            else
              echo "✅ $case_name passed validation"
            fi
          done

      - name: Validate all case studies (on main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python tools/scripts/validate_case_study.py --all --strict

      - name: Run team skill assessment
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "🚀 Running team skill assessment..."
          python scripts/team-radar-collect.py "${{ github.event.inputs.team || 'all' }}" \
            --input-dir radar-data \
            --output-dir radar-reports \
            --strict

      - name: Upload radar reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-radar-reports
          path: radar-reports/
          retention-days: 30

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the latest report
            const reportsDir = 'radar-reports';
            if (!fs.existsSync(reportsDir)) {
              console.log('No radar reports found');
              return;
            }
            
            const files = fs.readdirSync(reportsDir)
              .filter(f => f.endsWith('.md'))
              .sort()
              .reverse();
            
            if (files.length === 0) {
              console.log('No markdown reports found');
              return;
            }
            
            const latestReport = files[0];
            const reportPath = path.join(reportsDir, latestReport);
            const report = fs.readFileSync(reportPath, 'utf8');
            
            // Extract summary
            const summaryMatch = report.match(/## 📊 团队雷达概览[\s\S]*?(?=##|$)/);
            const summary = summaryMatch ? summaryMatch[0] : 'Report generated successfully';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 团队能力雷达评估报告\n\n${summary}\n\n---\n*自动生成于 ${new Date().toLocaleString()}*`
            })

      - name: Post summary to issue (on schedule)
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const reportsDir = 'radar-reports';
            if (!fs.existsSync(reportsDir)) {
              console.log('No radar reports found');
              return;
            }
            
            const files = fs.readdirSync(reportsDir)
              .filter(f => f.endsWith('.md'))
              .sort()
              .reverse();
            
            if (files.length === 0) {
              console.log('No markdown reports found');
              return;
            }
            
            const latestReport = files[0];
            const reportPath = path.join(reportsDir, latestReport);
            const report = fs.readFileSync(reportPath, 'utf8');
            
            // Create or update tracking issue
            const issueTitle = `📊 Weekly Team Skill Assessment - ${new Date().toISOString().split('T')[0]}`;
            
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['skill-assessment', 'weekly']
            });
            
            let issueNumber;
            const existing = existingIssues.data.find(i => i.title.startsWith('📊 Weekly Team Skill Assessment'));
            
            if (existing) {
              issueNumber = existing.number;
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ${new Date().toLocaleDateString()} 评估报告\n\n${report.substring(0, 6000)}...`
              });
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: report,
                labels: ['skill-assessment', 'weekly', 'automated']
              });
              issueNumber = issue.data.number;
            }
            
            console.log(`Posted to issue #${issueNumber}`);