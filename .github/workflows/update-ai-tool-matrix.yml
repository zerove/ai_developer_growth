name: Update AI Tool Matrix

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-matrix:
    name: Check for Tool Matrix Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            tools/scripts/update_ai_tool_matrix.py

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run matrix update check
        run: |
          python tools/scripts/update_ai_tool_matrix.py --check

      - name: Create issue if updates found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 AI Tool Matrix Updates Available',
              body: 'The automated tool matrix update check has found available updates. Please review and update the matrix if appropriate.',
              labels: ['maintenance', 'tools']
            })