name: Validate Case Study

on:
  pull_request:
    paths:
      - 'case-studies/**'
      - 'docs/case-studies/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate case study format
        run: |
          python tools/scripts/validate_case_study.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check links
        run: |
          python tools/scripts/link_auditor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let body = '## 📋 案例验证结果\n\n';
            
            // Check if validation passed
            const validateExit = '${{ steps.validate.outcome }}';
            const linksExit = '${{ steps.check-links.outcome }}';
            
            if (validateExit === 'success' && linksExit === 'success') {
              body += '✅ **所有检查通过**\n\n';
              body += '案例格式正确，链接有效。等待社区催化剂审核。';
            } else {
              body += '❌ **检查失败**\n\n';
              
              if (validateExit === 'failure') {
                body += '- 案例格式验证失败，请检查模板要求\n';
              }
              if (linksExit === 'failure') {
                body += '- 链接检查失败，请修复断链\n';
              }
              
              body += '\n详细错误信息请查看 [Actions 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
