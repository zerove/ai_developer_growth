repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # jcode 治理检查
  - repo: local
    hooks:
      - id: jcode-governance
        name: jcode Governance Check
        entry: bash .jcode/hooks/pre-commit
        language: system
        files: '\.(py|md)$'
        pass_filenames: false
        stages: [pre-commit]

ci:
  autofix_prs: true
  autoupdate_schedule: monthly
  submodules: false
