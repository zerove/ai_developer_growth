# Pre-commit hooks for ai_developer_growth
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ── Ruff: lint + format ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --config=pyproject.toml]
      - id: ruff-format
        args: [--config=pyproject.toml]

  # ── MyPy: type checking ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [pyyaml, types-requests, types-pyyaml]
        args: [tools/scripts/]
        pass_filenames: false
        # mypy 配置统一由 pyproject.toml [tool.mypy] 提供
        # 不要在此处加 --strict / --ignore-missing-imports / --config-file（避免漂移）

  # ── Python: basic checks ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '\.github/ISSUE_TEMPLATE/.*\.yml$'
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-symlinks

  # ── Bandit: security lint ────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-r, tools/scripts/, -lll]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  # ── TruffleHog: secret scanning ──────────────────────────────────
  # Temporarily disabled - version compatibility issues with pre-commit
  # - repo: https://github.com/trufflesecurity/trufflehog
  #   rev: v3.96.0
  #   hooks:
  #     - id: trufflehog
  #       args: ["git", "file://.", "--since-commit=HEAD~1", "--json", "--fail"]
  #       verbose: true

  # ── ADG Governance: anti-patterns, security, naming ──────────────
  - repo: local
    hooks:
      - id: adg-governance
        name: ADG Governance Check
        entry: python -m tools.scripts.adg_cli check tools/scripts/ --lang python --severity error
        language: system
        pass_filenames: false
        always_run: true

  # ── Quality Gate: AI annotation, security patterns, type safety ──
  - repo: local
    hooks:
      - id: quality-gate
        name: AI Quality Gate
        entry: python tools/scripts/hooks_runner.py quality-gate --path tools/scripts --check-annotation --check-security --check-type --check-error --check-structure
        language: system
        pass_filenames: false
        always_run: true

  # ── Governance Audit: docs, AI-SDLC, hallucination ───────────────
  - repo: local
    hooks:
      - id: governance-audit
        name: Governance Audit
        entry: python tools/scripts/hooks_runner.py governance-audit --validate-docs --check-ai-sdlc --audit-hallucination
        language: system
        pass_filenames: false
        always_run: true

  # ── Markdown lint ────────────────────────────────────────────────
  # Disabled due to pre-existing issues in docs/examples/case-studies/templates
  # Only core root-level files (README.md, SECURITY.md, GOVERNANCE.md, CODE_OF_CONDUCT.md) are linted
  # - repo: https://github.com/igorshubovych/markdownlint-cli
  #   rev: v0.43.0
  #   hooks:
  #     - id: markdownlint
  #       args: ["--config", ".markdownlint.json"]
  #       files: \.(md|markdown)$
  #       exclude: ^(examples/|docs/|ai-dev-framework/|extensions/|case-studies/|templates/|ROADMAP.md|UBIQUITOUS_LANGUAGE.md|CODE_OF_CONDUCT.md|SECURITY.md|GOVERNANCE.md|CHANGELOG.md|CLAUDE.md|CONTRIBUTING_RULES.md|article-ai-developer-evolution.md|INDEX.md|FEEDBACK.md|MOC.md|CONTRIBUTING.md|RELEASE_NOTES_.*\.md|zed-config/)

  # ── Check for large files ────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']

  # ── Requirements.txt / uv.lock sync ──────────────────────────────
  - repo: local
    hooks:
      - id: uv-lock-sync
        name: Check uv.lock sync
        entry: bash -c 'uv lock --check'
        language: system
        pass_filenames: false
        always_run: true

  # ── Validate ADR index ───────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-adr-index
        name: Validate ADR Index
        entry: python tools/scripts/hooks_runner.py governance-audit --check-index
        language: system
        pass_filenames: false
        always_run: true

  # ── Validate example projects structure ──────────────────────────
  - repo: local
    hooks:
      - id: validate-examples
        name: Validate Example Projects
        entry: python tools/scripts/validate_example_projects.py
        language: system
        pass_filenames: false
        always_run: true

  # ── Case study validation ────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-case-studies
        name: Validate Case Studies
        entry: python tools/scripts/validate_case_study.py --all
        language: system
        pass_filenames: false
        always_run: true

  # ── JCode Hooks Runner: on_commit ───────────────────────────────
  - repo: local
    hooks:
      - id: jcode-on-commit
        name: JCode on_commit Hooks
        entry: python .jcode/scripts/hooks_runner.py on_commit
        language: system
        pass_filenames: false
        always_run: true

ci:
  autofix_commit_msg: "chore: pre-commit autofix"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
