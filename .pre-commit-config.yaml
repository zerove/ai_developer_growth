# Pre-commit hooks for ai_developer_growth
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ── Ruff: lint + format ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --config=pyproject.toml]
      - id: ruff-format
        args: [--config=pyproject.toml]

  # ── MyPy: type checking ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # files 而非 exclude: 把 hook 的检查范围**对齐 CI type-check**
        # （mypy tools .jcode ai-dev-framework/src）。
        # 原因: mypy 配置里的 exclude 只对"目录递归"生效, 对 pre-commit 显式
        # 传入的文件无效 —— 于是
        #   1) examples/ai-context-sync/tests/test_core.py 与
        #      ai-dev-framework/tests/test_core.py 同名 → mypy 报
        #      "Duplicate module named test_core" 并以 exit 2 失败;
        #   2) tests/ 与 scripts/ 从未被任何门禁类型检查, 但 strict 模式下会
        #      报出数千条无注解测试函数的错误 —— 反而把提交门禁变成噪声。
        files: ^(tools/|\.jcode/scripts/|ai-dev-framework/src/)
        additional_dependencies: [pyyaml, types-requests, types-pyyaml]
        # 增量检查: 只跑本次暂存的文件。原为 args=[tools/scripts/] +
        # pass_filenames=false, 每次提交都全量检查 209 个文件, 实测 18.13s,
        # 占整个提交门禁的一半以上。全量类型检查由 pre-push
        # (hooks_runner typecheck) 与 CI type-check job 兜底, 语义不变。
        # mypy 配置统一由 pyproject.toml [tool.mypy] 提供
        # 不要在此处加 --strict / --ignore-missing-imports / --config-file（避免漂移）

  # ── Python: basic checks ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # 排除三类文件（其余 YAML 必须能被单文档解析且无重复键）:
        #   1) GitHub Issue 模板（含 YAML 保留字占位）;
        #   2) Helm 模板 —— Go 模板 ({{- ... }}) 不是可直接解析的 YAML;
        #   3) 多文档 k8s/ArgoCD 清单（--- 分隔）—— check-yaml 只接受单文档。
        # 注意: Helm 的 values*.yaml **不在**排除范围内 —— 它们此前藏了重复
        # 顶层键（api: 写了两遍, 后者覆盖前者 → 生产副本数/资源被静默丢弃）,
        # 由本钩子的重复键检测发现并已修复。
        exclude: '(\.github/ISSUE_TEMPLATE/.*\.yml$|^helm/.*/templates/.*\.ya?ml$|^argocd/.*\.ya?ml$|^multi-cluster-.*\.ya?ml$)'
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-symlinks

  # ── Bandit: security lint ────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-r, tools/scripts/, -lll]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  # ── TruffleHog: secret scanning ──────────────────────────────────
  # Temporarily disabled - version compatibility issues with pre-commit
  # - repo: https://github.com/trufflesecurity/trufflehog
  #   rev: v3.96.0
  #   hooks:
  #     - id: trufflehog
  #       args: ["git", "file://.", "--since-commit=HEAD~1", "--json", "--fail"]
  #       verbose: true

  # ── ADG Governance: anti-patterns, security, naming ──────────────
  - repo: local
    hooks:
      - id: adg-governance
        name: ADG Governance Check
        entry: python -m tools.scripts.adg_cli check tools/scripts/ --lang python --severity error
        language: system
        pass_filenames: false
        always_run: true

  # ── Quality Gate: AI annotation, security patterns, type safety ──
  - repo: local
    hooks:
      - id: quality-gate
        name: AI Quality Gate
        entry: python -m tools.scripts.hooks_runner quality-gate --path tools/scripts --check-annotation --check-security --check-patterns --check-type --check-error --check-structure
        language: system
        pass_filenames: false
        always_run: true

  # ── Governance Audit: docs, AI-SDLC, hallucination ───────────────
  - repo: local
    hooks:
      - id: governance-audit
        name: Governance Audit
        entry: python -m tools.scripts.hooks_runner governance-audit --validate-docs --check-ai-sdlc --audit-hallucination
        language: system
        pass_filenames: false
        always_run: true

  # ── Markdown lint ────────────────────────────────────────────────
  # Disabled due to pre-existing issues in docs/examples/case-studies/templates
  # Only core root-level files (README.md, SECURITY.md, GOVERNANCE.md, CODE_OF_CONDUCT.md) are linted
  # - repo: https://github.com/igorshubovych/markdownlint-cli
  #   rev: v0.43.0
  #   hooks:
  #     - id: markdownlint
  #       args: ["--config", ".markdownlint.json"]
  #       files: \.(md|markdown)$
  #       exclude: ^(examples/|docs/|ai-dev-framework/|extensions/|case-studies/|templates/|ROADMAP.md|UBIQUITOUS_LANGUAGE.md|CODE_OF_CONDUCT.md|SECURITY.md|GOVERNANCE.md|CHANGELOG.md|CLAUDE.md|CONTRIBUTING_RULES.md|article-ai-developer-evolution.md|INDEX.md|FEEDBACK.md|MOC.md|CONTRIBUTING.md|RELEASE_NOTES_.*\.md|zed-config/)

  # ── Check for large files ────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']

  # ── Requirements.txt / uv.lock sync ──────────────────────────────
  - repo: local
    hooks:
      - id: uv-lock-sync
        name: Check uv.lock sync
        entry: bash -c 'uv lock --check'
        language: system
        pass_filenames: false
        always_run: true

  # ── Validate ADR index ───────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-adr-index
        name: Validate ADR Index
        entry: python -m tools.scripts.hooks_runner governance-audit --check-index
        language: system
        pass_filenames: false
        always_run: true

  # ── Validate example projects structure ──────────────────────────
  - repo: local
    hooks:
      - id: validate-examples
        name: Validate Example Projects
        entry: python -m tools.scripts.validate_example_projects
        language: system
        pass_filenames: false
        always_run: true

  # ── Case study validation ────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-case-studies
        name: Validate Case Studies
        entry: python -m tools.scripts.validate_case_study --all
        language: system
        pass_filenames: false
        always_run: true

  # ── JCode Hooks Runner: on_commit ───────────────────────────────
  - repo: local
    hooks:
      - id: jcode-on-commit
        name: JCode on_commit Hooks
        # 必须传 filenames：hooks_runner 依赖 --files 判断 condition，
        # 此前 pass_filenames: false 导致 changed_files=None，
        # governance-docs-check / rules-yml-integrity-check /
        # hooks-json-integrity-check 三个条件型 hook 每次提交都被静默跳过
        # （其中 hooks-json-integrity-check 校验的就是 hooks.json 自身）。
        entry: python .jcode/scripts/hooks_runner.py on_commit --files
        language: system
        pass_filenames: true
        always_run: true

ci:
  autofix_commit_msg: "chore: pre-commit autofix"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
