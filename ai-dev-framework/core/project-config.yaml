# Jcode Project Configuration
# 适用于任何项目的标准化配置

project:
  # 项目基本信息
  name: "${PROJECT_NAME}"
  type: "${PROJECT_TYPE}"  # library, webapp, api, cli, knowledge-base
  language: "${LANGUAGE}"  # python, typescript, rust, go, java, etc.
  framework: "${FRAMEWORK}"  # react, vue, fastapi, springboot, etc.

  # 目录结构约定
  directories:
    source: "${SOURCE_DIR}"  # src, lib, app
    tests: "${TESTS_DIR}"    # tests, test, __tests__
    docs: "${DOCS_DIR}"      # docs, documentation
    scripts: "${SCRIPTS_DIR}" # scripts, tools, bin

  # 质量门禁
  quality:
    min_test_coverage: ${MIN_COVERAGE}  # 默认 70%
    lint_tool: "${LINT_TOOL}"           # ruff, eslint, clippy
    type_checker: "${TYPE_CHECKER}"     # mypy, tsc, etc.
    security_scanner: "${SECURITY}"     # bandit, semgrep

# Agent 角色定义 (通用模板)
agents:
  # 代码质量守护者
  code-guardian:
    description: "维护代码质量、安全、风格一致性"
    responsibilities:
      - "执行 lint 检查"
      - "运行测试套件"
      - "安全扫描"
    tools: ["lint", "test", "security"]
    triggers:
      - "on_commit"
      - "on_pr"

  # 文档维护者
  doc-curator:
    description: "维护文档完整性、链接有效性、结构一致性"
    responsibilities:
      - "检查文档链接"
      - "验证文档格式"
      - "更新索引"
    tools: ["link-checker", "doc-validator"]
    triggers:
      - "on_merge"
      - "scheduled"

  # 流程优化师
  workflow-optimizer:
    description: "分析开发效率、优化工作流程"
    responsibilities:
      - "收集效率数据"
      - "分析瓶颈"
      - "推荐改进"
    tools: ["metrics", "analyzer"]
    triggers:
      - "scheduled"

# 工作流定义
workflows:
  # 标准开发流程
  standard:
    - step: "lint"
      agent: "code-guardian"
      description: "代码风格检查"
    - step: "test"
      agent: "code-guardian"
      description: "运行测试"
    - step: "security"
      agent: "code-guardian"
      description: "安全扫描"
    - step: "docs"
      agent: "doc-curator"
      description: "文档检查"

  # PR 审查流程
  pr-review:
    - step: "lint"
      agent: "code-guardian"
    - step: "test"
      agent: "code-guardian"
    - step: "security"
      agent: "code-guardian"
    - step: "link-check"
      agent: "doc-curator"
