# Next.js Framework Anti-Pattern Rules
framework: nextjs
language: typescript
config_version: '1.0'
anti_patterns:
- id: nextjs-client-fetch
  name: Client-side data fetching in server component
  severity: warning
  category: performance
  pattern: 'use client[\s\S]*?fetch\(|use client[\s\S]*?axios\.'
  message: 'Prefer server components for data fetching'
  fix_hint: 'Move data fetching to server component or use Server Actions'

- id: nextjs-no-use-client
  name: Missing use client directive
  severity: info
  category: architecture
  pattern: 'import\s+.*(?:useState|useEffect|useRouter)\s+from\s+[''"]react[''"]'
  message: 'React hooks require client component'
  fix_hint: "Add 'use client' at top of file"

- id: nextjs-eval
  name: eval() or dangerouslySetInnerHTML
  severity: error
  category: security
  pattern: 'dangerouslySetInnerHTML|eval\(|Function\('
  message: 'XSS vulnerability risk'
  fix_hint: 'Avoid dangerouslySetInnerHTML; sanitize input instead'

- id: nextjs-no-loading
  name: Missing loading state
  severity: info
  category: ux
  pattern: 'export default async function.*Page'
  message: 'Consider adding loading.tsx for better UX'
  fix_hint: 'Create loading.tsx in same directory'

- id: nextjs-no-error-boundary
  name: Missing error boundary
  severity: info
  category: error_handling
  pattern: 'export default function.*Page'
  message: 'Consider adding error.tsx for error handling'
  fix_hint: 'Create error.tsx in same directory'

- id: nextjs-hardcoded-secret
  name: Hardcoded secret
  severity: error
  category: security
  pattern: "(?:SECRET|PASSWORD|API_KEY|TOKEN)\\s*=\\s*[\"']"
  message: 'Secrets must not be hardcoded'
  fix_hint: 'Use environment variables: process.env.NEXT_PUBLIC_*'

- id: nextjs-server-action-auth
  name: Server Action without auth check
  severity: warning
  category: security
  pattern: "use server[\\s\\S]*?export async function"
  message: 'Server Actions should validate authentication'
  fix_hint: 'Add auth check at start of Server Action'

- id: nextjs-image-unoptimized
  name: Unoptimized external image
  severity: warning
  category: performance
  pattern: "<img\\s+[^>]*?src=[\"']https?://"
  message: 'Use next/image for external images'
  fix_hint: 'Import Image from "next/image" and use <Image />'

- id: nextjs-dynamic-import-missing
  name: Missing dynamic import for heavy components
  severity: info
  category: performance
  pattern: "import\\s+.*from\\s+['\"]@?\\w.*['\"]"
  message: 'Consider using next/dynamic for heavy components below the fold'
  fix_hint: 'Use const Component = dynamic(() => import("./Heavy"))'

- id: nextjs-no-metadata
  name: Missing page metadata
  severity: info
  category: seo
  pattern: 'export default function.*Page'
  message: 'Pages should export metadata for SEO'
  fix_hint: 'Export const metadata: Metadata = { title: "..." }'

naming:
  file:
    pattern: '^[a-z][a-z0-9-]*\.(ts|tsx|js|jsx)$'
    message: 'Next.js files should use kebab-case'
  function:
    pattern: '^[a-z][a-zA-Z0-9]*$'
    message: 'Functions should use camelCase'
  component:
    pattern: '^[A-Z][a-zA-Z0-9]*$'
    message: 'Components should use PascalCase'
  constant:
    pattern: '^[A-Z][A-Z0-9_]*$'
    message: 'Constants should use UPPER_SNAKE_CASE'

thresholds:
  max_function_length: 40
  max_file_length: 400
  max_line_length: 100
  max_nesting_depth: 4
  max_function_params: 5
  max_cyclomatic_complexity: 10

tooling:
  linter: eslint
  formatter: prettier
  type_checker: tsc
  test_runner: jest
  config_files:
    - .eslintrc.json
    - tsconfig.json
    - next.config.js
    - .prettierrc
