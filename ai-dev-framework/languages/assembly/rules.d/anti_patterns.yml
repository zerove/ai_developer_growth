language: assembly
version: '>=1.0'
config_version: '1.0'
anti_patterns:
- id: asm-hardcoded-address
  name: Hardcoded memory address
  severity: error
  category: code_quality
  pattern: 0x[0-9a-fA-F]{4,8}|\b\d{4,}\b\s*\(\s*%\s*(eax|ebx|ecx|edx|rsi|rdi|rax|rbx)\s*\)
  message: Avoid hardcoded memory addresses - use named constants or labels
  fix_hint: Define symbolic constants with EQU or use label references
- id: asm-missing-comments
  name: Missing comments on non-trivial instructions
  severity: warning
  category: readability
  pattern: ^\s*(mov|push|pop|call|jmp|je|jne|jg|jl|jge|jle|cmp|add|sub|mul|div|xor|and|or|ret)\s+[^;]*$
  message: Add comments explaining the purpose of non-trivial instructions
  fix_hint: Use ; comments to document register setup, memory layout, and algorithm
    steps
- id: asm-magic-number
  name: Magic number in instructions
  severity: warning
  category: code_quality
  pattern: (?:mov|add|sub|cmp|and|or|xor|test)\s+\$0x[0-9a-fA-F]{2,},
  message: Use named constants instead of magic numbers
  fix_hint: Define constants with .equ or EQU directives for clarity
- id: asm-unbounded-loop
  name: Unbounded loop without exit condition
  severity: error
  category: error_handling
  pattern: ^\.\w+:\s*$|^(?:loop|jmp)\s+\.\w+\s*$
  message: Loops must have a clearly defined exit condition
  fix_hint: Add comparison and conditional jump before each loop iteration
- id: asm-global-label-main
  name: Conflicting global label names
  severity: error
  category: code_quality
  pattern: ^\s*\.glob\s+(?:main|start|exit|read|write|open|close|malloc|free)\b
  message: Avoid overriding common system labels - use prefixed names
  fix_hint: Prefix your labels (e.g., myapp_main) to prevent symbol collisions
- id: asm-stack-imbalance
  name: Potential stack imbalance in procedure
  severity: error
  category: error_handling
  pattern: ^\s*ret\s*$
  message: Ensure every RET is preceded by balanced PUSH/POP pairs or stack frame
    restoration
  fix_hint: Use ENTER/LEAVE or manual push/pop symmetry with proper stack frame cleanup
- id: asm-div-zero-risk
  name: Division without zero check
  severity: warning
  category: error_handling
  pattern: (?:div|idiv)\s+\S+
  message: Division by zero will crash - verify divisor is non-zero before dividing
  fix_hint: Add a test/cmp and conditional branch to handle zero divisor case
- id: asm-shadow-register
  name: Implicit register clobbering in call
  severity: warning
  category: code_quality
  pattern: ^\s*call\s+\w+
  message: Document which registers the called function may clobber
  fix_hint: Save volatile registers (caller-saved) before CALL and note in comments
- id: as-hardcoded-config
  name: Hardcoded configuration
  severity: warning
  category: config
  pattern: (?:url|endpoint|host|port)\s*[=:]\s*["']https?://
  message: Use configuration for URLs/endpoints
  fix_hint: Move to config file
- id: as-todo
  name: Unresolved TODO
  severity: info
  category: code_quality
  pattern: TODO|FIXME|HACK|XXX
  message: Unresolved TODO/FIXME comments
  fix_hint: Create a ticket or resolve
- id: as-deep-nesting
  name: Deep nesting
  severity: warning
  category: complexity
  pattern: '    (?:if|for|while|case).*\n(?:        (?:if|for|while|case).*\n){2,}'
  message: Deep nesting reduces readability
  fix_hint: Extract helper functions
- id: as-long-line
  name: Long line
  severity: info
  category: code_quality
  pattern: ^.{121,}$
  message: Lines >120 chars
  fix_hint: Break at logical boundaries
- id: as-unsafe-input
  name: Unvalidated input
  severity: error
  category: security
  pattern: (?:read|gets?|input)\s*\(
  message: User input must be validated
  fix_hint: Add input validation
- id: as-log-sensitive
  name: Logging sensitive data
  severity: error
  category: security
  pattern: log(?:ger)?\.(?:info|debug|warn|error)\s*\(.*(?:password|secret|token|credential|api_key)
  message: Never log sensitive data (passwords, tokens, secrets)
  fix_hint: Use log filtering or redact sensitive fields
- id: as-log-print
  name: Using print for logging
  severity: warning
  category: logging
  pattern: ^\s*print\s*\(
  message: Use structured logging instead of print statements in production
  fix_hint: Use logging framework (loguru, structlog, etc.)
- id: as-file-leak
  name: Unclosed file handle
  severity: error
  category: resource_management
  pattern: (?:open|fopen)\s*\([^)]*\)\s*(?!.*\b(with|using|close|finally|defer)\b)
  message: File handles must be closed properly to avoid resource leaks
  fix_hint: Use with/using/defer block or ensure close() in finally
- id: as-connection-leak
  name: Unclosed connection
  severity: error
  category: resource_management
  pattern: (?:connect|new connection|getConnection)\s*\([^)]*\)\s*(?!.*\b(with|using|close|finally|defer)\b)
  message: Database/network connections must be released after use
  fix_hint: Use connection pool or ensure close() in finally
- id: as-shared-mutable
  name: Shared mutable state without sync
  severity: warning
  category: concurrency
  pattern: (?:global|static|thread_local)\s+\w+(?:\s*=\s*[^;]*)?\s*[;]?$
  message: Shared mutable state without synchronization can cause race conditions
  fix_hint: Use mutex/lock/atomic or thread-local storage
- id: as-large-alloc-loop
  name: Large allocation in loop
  severity: warning
  category: performance
  pattern: (?:for|while|loop)\s*\([^)]*\)\s*\{?\s*[^}]*\b(?:append|push|concat|new\s+(?:Array|List|StringBuilder))\b
  message: Repeated allocations inside loops impact performance
  fix_hint: Pre-allocate or use builder pattern outside the loop
- id: as-exception-leak
  name: Exception message leaks internal info
  severity: warning
  category: security
  pattern: (?:print|log|logger)\s*\(.*e(?:rror)?\.(?:message|to_String|getMessage)\s*\)
  message: Exception messages may leak internal implementation details
  fix_hint: Log a generic message, add exception details separately
- id: as-hardcoded-secret-in-ci
  name: Hardcoded secret in CI config
  severity: error
  category: security
  pattern: (?:GITHUB_TOKEN|API_KEY|SECRET|PASSWORD)\s*[=:]\s*[\"'][^\"']+[\"']
  message: CI/CD secrets should use GitHub Secrets or vault, not hardcoded strings
  fix_hint: Use ${{ secrets.MY_SECRET }} in GitHub Actions
- id: as-ci-disabled-check
  name: Disabled CI check
  severity: warning
  category: ci_cd
  pattern: continue-on-error:\s*true
  message: CI checks with continue-on-error silently ignore failures
  fix_hint: Remove continue-on-error or add explicit error handling
- id: as-docker-image-latest
  name: Using :latest tag
  severity: warning
  category: ci_cd
  pattern: FROM\s+\S+:\s*latest\b
  message: Using :latest tag makes builds non-reproducible
  fix_hint: Pin to specific version tag
- id: as-docker-exposed-port
  name: Exposed port without healthcheck
  severity: warning
  category: ci_cd
  pattern: EXPOSE\s+\d+
  message: Exposed ports should have corresponding healthcheck
  fix_hint: Add HEALTHCHECK instruction
- id: as-iac-hardcoded-secret
  name: Hardcoded secret in IaC
  severity: error
  category: security
  pattern: (?:password|secret_key|access_key)\s*[=:]\s*[\"'][^\"']+[\"']
  message: Infrastructure secrets should use vault or secret store
  fix_hint: Use AWS Secrets Manager, HashiCorp Vault, or SOPS
- id: as-iac-admin-exposed
  name: Admin service exposed to internet
  severity: error
  category: security
  pattern: '(?:adminer|phpmyadmin|pgadmin|kibana)\s*:'
  message: Admin tools should not be publicly accessible
  fix_hint: Restrict ingress to internal network only
- id: as-docker-root-user
  name: Running as root in container
  severity: error
  category: security
  pattern: FROM\s+\S+\s*(?:AS\s+\w+)?\s*\n(?!.*USER\s)
  message: Running containers as root is a security risk
  fix_hint: Add 'USER nobody' or create a non-root user
- id: as-pip-audit-missing
  name: Missing dependency audit
  severity: warning
  category: ci_cd
  pattern: pip install\b(?!.*pip-audit|.*safety)
  message: Package installation without vulnerability scanning
  fix_hint: Add 'pip-audit' or 'safety check' after install
naming:
  file:
    pattern: ^[a-z][a-z0-9_]*\.\w+$
    message: Assembly files should use lowercase with underscores
  function:
    pattern: ^[a-z][a-z0-9_]*$
    message: Labels should use lowercase with underscores
thresholds:
  max_function_length: 50
  max_file_length: 500
  max_line_length: 120
  max_nesting_depth: 4
