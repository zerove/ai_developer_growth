language: cpp
version: '>=17'
config_version: '1.0'
anti_patterns:
- id: cpp-raw-new
  name: Raw new/delete usage
  severity: error
  category: memory_safety
  pattern: \bnew\s+\w+|\bdelete\s+
  message: Raw new/delete causes memory leaks and undefined behavior
  fix_hint: 'Use smart pointers: std::unique_ptr or std::shared_ptr'
- id: cpp-null-pointer
  name: NULL pointer usage
  severity: warning
  category: type_safety
  pattern: \bNULL\b
  message: NULL is not type-safe in C++
  fix_hint: Use nullptr instead of NULL
- id: cpp-c-style-cast
  name: C-style cast
  severity: warning
  category: type_safety
  pattern: \(\s*(?:int|float|double|char|void|const|unsigned)\s*\)\s*\w
  message: C-style casts are unsafe and bypass type checking
  fix_hint: Use static_cast<>, dynamic_cast<>, const_cast<> instead
- id: cpp-raw-array
  name: Raw array allocation
  severity: warning
  category: memory_safety
  pattern: \w+\s*\*\s*\w+\s*=\s*new\s+\w+\[
  message: Raw array allocation is error-prone
  fix_hint: Use std::vector, std::array, or std::span
- id: cpp-using-namespace
  name: Using namespace in header
  severity: error
  category: code_quality
  pattern: using\s+namespace\s+\w+;
  message: using namespace pollutes the global namespace
  fix_hint: Use specific using declarations or fully qualified names
- id: cpp-cout-printf
  name: printf/cout for logging
  severity: info
  category: code_quality
  pattern: \bprintf\s*\(|std::cout\s*<<|std::cerr\s*<<
  message: Use a proper logging library instead of printf/cout
  fix_hint: Use spdlog, fmt, or similar logging library
- id: cpp-magic-number
  name: Magic number
  severity: info
  category: code_quality
  pattern: (?:if|while|for)\s*\(.*(?:==?|>=?|<=?)\s*\d{3,}
  message: Magic numbers should be named constants
  fix_hint: Define constexpr int MAX_SIZE = 1024;
- id: cpp-global-ctor
  name: Global constructor with side effects
  severity: warning
  category: design
  pattern: ^\s*\w+\s+\w+\s*\([^)]*\)\s*;
  message: Global constructors with side effects cause static initialization order
    fiasco
  fix_hint: Use function-local statics or lazy initialization
- id: cpp-exception-spec
  name: Dynamic exception specification
  severity: error
  category: modern_cpp
  pattern: throw\s*\([^)]*\)
  message: Dynamic exception specifications are removed in C++17
  fix_hint: Use noexcept for functions that do not throw
- id: cpp-uncaught-exception
  name: Throwing in destructor
  severity: error
  category: exception_safety
  pattern: ~\w+\s*\(\s*\)\s*(?:noexcept\s*\(\s*false\s*\))?\s*\{[^}]*\bthrow\b
  message: Throwing in destructors causes undefined behavior during stack unwinding
  fix_hint: Use try-catch in destructors or move dangerous operations to separate
    methods
- id: cpp-copy-loop
  name: Copying container in loop
  severity: warning
  category: performance
  pattern: for\s*\([^)]*\bauto\b\s+\w+\s*:\s*\w+
  message: Range-based for loops should use const reference to avoid copies
  fix_hint: 'Use: for (const auto& item : container)'
- id: cpp-uninitialized-var
  name: Uninitialized member variable
  severity: warning
  category: correctness
  pattern: ^\s*\w+\s+\w+;
  message: Member variables should be initialized
  fix_hint: Initialize in constructor or use default member initializers
- id: cpp-deprecated-cast
  name: const_cast to remove const
  severity: error
  category: correctness
  pattern: const_cast\s*<[^>]*>\s*\(
  message: const_cast is almost always a bug or design smell
  fix_hint: Redesign to avoid removing const qualification
- id: cpp-hardcoded-config
  name: Hardcoded configuration
  severity: warning
  category: config
  pattern: (?:url|endpoint|host|port)\s*[=:]\s*["']https?://
  message: Use configuration for URLs/endpoints
  fix_hint: Move to config file
- id: cpp-todo
  name: Unresolved TODO
  severity: info
  category: code_quality
  pattern: TODO|FIXME|HACK|XXX
  message: Unresolved TODO/FIXME comments
  fix_hint: Create a ticket or resolve
- id: cpp-deep-nesting
  name: Deep nesting
  severity: warning
  category: complexity
  pattern: '    (?:if|for|while|case).*\n(?:        (?:if|for|while|case).*\n){2,}'
  message: Deep nesting reduces readability
  fix_hint: Extract helper functions
- id: cpp-long-line
  name: Long line
  severity: info
  category: code_quality
  pattern: ^.{121,}$
  message: Lines >120 chars
  fix_hint: Break at logical boundaries
- id: cpp-unsafe-input
  name: Unvalidated input
  severity: error
  category: security
  pattern: (?:read|gets?|input)\s*\(
  message: User input must be validated
  fix_hint: Add input validation
- id: cpp-log-sensitive
  name: Logging sensitive data
  severity: error
  category: security
  pattern: log(?:ger)?\.(?:info|debug|warn|error)\s*\(.*(?:password|secret|token|credential|api_key)
  message: Never log sensitive data (passwords, tokens, secrets)
  fix_hint: Use log filtering or redact sensitive fields
- id: cpp-log-print
  name: Using print for logging
  severity: warning
  category: logging
  pattern: ^\s*print\s*\(
  message: Use structured logging instead of print statements in production
  fix_hint: Use logging framework (loguru, structlog, etc.)
- id: cpp-file-leak
  name: Unclosed file handle
  severity: error
  category: resource_management
  pattern: (?:open|fopen)\s*\([^)]*\)\s*(?!.*\b(with|using|close|finally|defer)\b)
  message: File handles must be closed properly to avoid resource leaks
  fix_hint: Use with/using/defer block or ensure close() in finally
- id: cpp-connection-leak
  name: Unclosed connection
  severity: error
  category: resource_management
  pattern: \b(?:connect|new connection|getConnection)\s*\([^)]*\)\s*(?!.*\b(with|using|close|finally|defer)\b)
  message: Database/network connections must be released after use
  fix_hint: Use connection pool or ensure close() in finally
- id: cpp-shared-mutable
  name: Shared mutable state without sync
  severity: warning
  category: concurrency
  pattern: (?:global|static|thread_local)\s+\w+(?:\s*=\s*[^;]*)?\s*[;]?$
  message: Shared mutable state without synchronization can cause race conditions
  fix_hint: Use mutex/lock/atomic or thread-local storage
- id: cpp-large-alloc-loop
  name: Large allocation in loop
  severity: warning
  category: performance
  pattern: (?:for|while|loop)\s*\([^)]*\)\s*\{?\s*[^}]*\b(?:append|push|concat|new\s+(?:Array|List|StringBuilder))\b
  message: Repeated allocations inside loops impact performance
  fix_hint: Pre-allocate or use builder pattern outside the loop
- id: cpp-exception-leak
  name: Exception message leaks internal info
  severity: warning
  category: security
  pattern: (?:print|log|logger)\s*\(.*e(?:rror)?\.(?:message|to_String|getMessage)\s*\)
  message: Exception messages may leak internal implementation details
  fix_hint: Log a generic message, add exception details separately
- id: cpp-hardcoded-secret-in-ci
  name: Hardcoded secret in CI config
  severity: error
  category: security
  pattern: (?:GITHUB_TOKEN|API_KEY|SECRET|PASSWORD)\s*[=:]\s*[\"'][^\"']+[\"']
  message: CI/CD secrets should use GitHub Secrets or vault, not hardcoded strings
  fix_hint: Use ${{ secrets.MY_SECRET }} in GitHub Actions
- id: cpp-ci-disabled-check
  name: Disabled CI check
  severity: warning
  category: ci_cd
  pattern: continue-on-error:\s*true
  message: CI checks with continue-on-error silently ignore failures
  fix_hint: Remove continue-on-error or add explicit error handling
- id: cpp-docker-image-latest
  name: Using :latest tag
  severity: warning
  category: ci_cd
  pattern: FROM\s+\S+:\s*latest\b
  message: Using :latest tag makes builds non-reproducible
  fix_hint: Pin to specific version tag
- id: cpp-docker-exposed-port
  name: Exposed port without healthcheck
  severity: warning
  category: ci_cd
  pattern: EXPOSE\s+\d+
  message: Exposed ports should have corresponding healthcheck
  fix_hint: Add HEALTHCHECK instruction
- id: cpp-iac-hardcoded-secret
  name: Hardcoded secret in IaC
  severity: error
  category: security
  pattern: (?:password|secret_key|access_key)\s*[=:]\s*[\"'][^\"']+[\"']
  message: Infrastructure secrets should use vault or secret store
  fix_hint: Use AWS Secrets Manager, HashiCorp Vault, or SOPS
- id: cpp-iac-admin-exposed
  name: Admin service exposed to internet
  severity: error
  category: security
  pattern: '(?:adminer|phpmyadmin|pgadmin|kibana)\s*:'
  message: Admin tools should not be publicly accessible
  fix_hint: Restrict ingress to internal network only
- id: cpp-docker-root-user
  name: Running as root in container
  severity: error
  category: security
  pattern: FROM\s+\S+\s*(?:AS\s+\w+)?\s*\n(?!.*USER\s)
  message: Running containers as root is a security risk
  fix_hint: Add 'USER nobody' or create a non-root user
- id: cpp-pip-audit-missing
  name: Missing dependency audit
  severity: warning
  category: ci_cd
  pattern: pip install\b(?!.*pip-audit|.*safety)
  message: Package installation without vulnerability scanning
  fix_hint: Add 'pip-audit' or 'safety check' after install
naming:
  file:
    pattern: ^[a-z][a-z0-9_]*\.(cpp|cc|cxx)$|^[A-Z][a-zA-Z0-9]*\.h$
    message: C++ source files use snake_case, headers use PascalCase
  function:
    pattern: ^[a-z][a-z0-9_]*$
    message: Functions should use snake_case
  class:
    pattern: ^[A-Z][a-zA-Z0-9]*$
    message: Classes should use PascalCase
  constant:
    pattern: ^[A-Z][A-Z0-9_]*$
    message: Constants should use UPPER_SNAKE_CASE
  namespace:
    pattern: ^[a-z][a-z0-9_]*$
    message: Namespaces should use snake_case
thresholds:
  max_function_length: 50
  max_file_length: 500
  max_line_length: 120
  max_nesting_depth: 4
  max_function_params: 7
  max_cyclomatic_complexity: 10
tooling:
  linter: clang-tidy
  formatter: clang-format
  type_checker: null
  test_runner: gtest
  config_files:
  - CMakeLists.txt
  - .clang-tidy
  - .clang-format
