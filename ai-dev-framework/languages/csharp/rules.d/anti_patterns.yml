# C# Language Rules - Machine-Readable Configuration

language: csharp
version: '>=10.0'
config_version: '1.0'
anti_patterns:
- id: cs-sql-injection
  name: SQL injection via string concatenation
  severity: error
  category: security
  pattern: "(?:ExecuteNonQuery|ExecuteReader|ExecuteScalar)\s*\(.*(?:\\+|\\.Format|\\$)"
  message: 'String concatenation in SQL enables injection'
  fix_hint: 'Use parameterized queries: command.Parameters.AddWithValue("@id", id)'
- id: cs-empty-catch
  name: Empty catch block
  severity: error
  category: error_handling
  pattern: 'catch\s*(?:\([^)]*\))?\s*\{\s*\}'
  message: 'Empty catch blocks silently swallow errors'
  fix_hint: 'Log the exception or re-throw it'
- id: cs-catch-exception
  name: Catching generic Exception
  severity: warning
  category: error_handling
  pattern: 'catch\s*\(\s*Exception\b'
  message: 'Catching generic Exception masks specific errors'
  fix_hint: 'Catch specific exceptions or use when clause'
- id: cs-thread-sleep
  name: Thread.Sleep usage
  severity: error
  category: async
  pattern: 'Thread\.Sleep\s*\('
  message: 'Thread.Sleep blocks the thread - use async/await'
  fix_hint: 'Use await Task.Delay() for async waiting'
- id: cs-empty-string
  name: Comparing to empty string
  severity: info
  category: code_quality
  pattern: '==\s*""|!=\s*""|\.Length\s*==\s*0'
  message: 'Use string.IsNullOrEmpty() or string.IsNullOrWhiteSpace()'
  fix_hint: 'string.IsNullOrEmpty(value)'
- id: cs-var-any
  name: Using var with anonymous types excessively
  severity: info
  category: type_safety
  pattern: 'var\s+\w+\s*=\s*new\s+\{'
  message: 'Excessive var usage reduces code readability'
  fix_hint: 'Use explicit types for complex objects'
- id: cs-magic-number
  name: Magic number
  severity: info
  category: code_quality
  pattern: '(?:if|while|for)\s*\(.*(?:==?|>=?|<=?)\s*\d{2,}'
  message: 'Magic numbers should be named constants'
  fix_hint: 'Define const int MaxRetries = 3;'
- id: cs-null-check-pattern
  name: Redundant null check after as
  severity: warning
  category: code_quality
  pattern: 'as\s+\w+;\s*\n\s*if\s*\(\w+\s*!=\s*null\)'
  message: 'Use is pattern matching instead of as + null check'
  fix_hint: 'if (obj is MyType typed) { ... }'
- id: cs-disposable-not-disposed
  name: IDisposable not disposed
  severity: warning
  category: resource_management
  pattern: 'new\s+(?:SqlConnection|HttpClient|StreamReader|StreamWriter)'
  message: 'IDisposable objects should be disposed properly'
  fix_hint: 'Use using statement: using var conn = new SqlConnection(...)'
- id: cs-no-async
  name: Synchronous I/O in async context
  severity: warning
  category: async
  pattern: '\.Result\b|\.Wait\(\)|\.GetAwaiter\(\)\.GetResult\(\)'
  message: 'Blocking on async code causes deadlocks'
  fix_hint: 'Use await instead of .Result or .Wait()'
- id: cs-async-void
  name: async void method
  severity: error
  category: async
  pattern: 'async\s+void\s+'
  message: 'async void methods cannot be awaited and swallow exceptions'
  fix_hint: 'Use async Task instead of async void (except for event handlers)'
- id: cs-string-interpolation-sql
  name: String interpolation in SQL
  severity: error
  category: security
  pattern: "(?:Execute|Command)\s*\\(\\s*\\$\""
  message: 'String interpolation in SQL commands enables injection'
  fix_hint: 'Use parameterized queries with SqlCommand.Parameters'
- id: cs-linq-heavy
  name: Excessive LINQ chains
  severity: info
  category: performance
  pattern: '\.Where\(.*\.Select\(.*\.Where\('
  message: 'Deeply chained LINQ can be hard to debug and optimize'
  fix_hint: 'Break complex queries into named variables or methods'

naming:
  file:
    pattern: '^[A-Z][a-zA-Z0-9]*\.cs$'
    message: 'C# files should use PascalCase'
  function:
    pattern: '^[A-Z][a-zA-Z0-9]*$'
    message: 'Methods should use PascalCase'
  class:
    pattern: '^[A-Z][a-zA-Z0-9]*$'
    message: 'Classes should use PascalCase'
  constant:
    pattern: '^[A-Z][a-zA-Z0-9]*$'
    message: 'C# constants use PascalCase'
  interface:
    pattern: '^I[A-Z][a-zA-Z0-9]*$'
    message: 'Interfaces should start with I prefix'

thresholds:
  max_function_length: 50
  max_file_length: 500
  max_line_length: 120
  max_nesting_depth: 4
  max_function_params: 5
  max_cyclomatic_complexity: 10

tooling:
  linter: dotnet-format
  formatter: dotnet-format
  type_checker: null
  test_runner: xunit
  config_files:
    - *.csproj
    - .editorconfig
    - Directory.Build.props
