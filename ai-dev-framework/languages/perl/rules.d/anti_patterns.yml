language: perl
version: '>=1.0'
config_version: '1.0'
anti_patterns:
- id: pl-bare-global
  name: Bare global variable
  severity: error
  category: code_quality
  pattern: ^\s*(?:my\s+)?\$(?!\w*::)\w+
  message: Always declare variables with my/our and use strictures
  fix_hint: Add 'use strict; use warnings;' and declare with my() or our()
- id: pl-indirect-object
  name: Indirect object syntax
  severity: warning
  category: code_quality
  pattern: \bnew\s+[A-Z]\w+\b|\bnew\s+\{\s*\}
  message: Indirect object syntax is ambiguous and fragile
  fix_hint: 'Use direct method call: ClassName->new() instead of new ClassName'
- id: pl-two-arg-open
  name: Two-argument open
  severity: error
  category: security
  pattern: \bopen\s*\(\s*\w+\s*,\s*[^)]*[^,;]\s*\)
  message: Two-argument open can be exploited via shell metacharacters
  fix_hint: 'Use three-argument open: open(my $fh, ''<'', $filename)'
- id: pl-eval-string
  name: String eval
  severity: error
  category: security
  pattern: \beval\s+['"]|\beval\s+\{\}
  message: String eval is a severe security risk
  fix_hint: Replace eval with named subroutines or use perlcritic modules
- id: pl-no-strictures
  name: Missing strictures
  severity: error
  category: code_quality
  pattern: ^(?!.*use\s+strict).*\$\w+
  message: All Perl scripts must begin with use strict and use warnings
  fix_hint: Add 'use strict; use warnings;' at the top of every file
- id: pl-auto-deref
  name: Implicit dereferencing
  severity: warning
  category: type_safety
  pattern: \bkeys\s+\$\w+\b|\beach\s+\$\w+\b|\bprint\s+\$\w+\b(?!\{)
  message: Implicit dereferencing is deprecated since Perl 5.24
  fix_hint: 'Use explicit dereference: @{$arrayref} or %{$hashref}'
- id: pl-reversed-args
  name: Reversed system/exec arguments
  severity: error
  category: security
  pattern: \bsystem\s*\(\s*['"]|\bexec\s*\(\s*['"]
  message: system() with string arg invokes a shell - use list form
  fix_hint: Use system(@cmd_list) or exec(@cmd_list) with list context
- id: pl-regex-no-anchor
  name: Unanchored regex in pattern match
  severity: warning
  category: code_quality
  pattern: if\s*\(/\^?[^/]*\$/\)
  message: Regex without anchors may match unintended substrings
  fix_hint: Use \A and \z anchors instead of ^ and $ for string matching
- id: pl-hardcoded-config
  name: Hardcoded configuration
  severity: warning
  category: config
  pattern: (?:url|endpoint|host|port)\s*[=:]\s*["']https?://
  message: Use configuration for URLs/endpoints
  fix_hint: Move to config file
- id: pl-todo
  name: Unresolved TODO
  severity: info
  category: code_quality
  pattern: TODO|FIXME|HACK|XXX
  message: Unresolved TODO/FIXME comments
  fix_hint: Create a ticket or resolve
- id: pl-deep-nesting
  name: Deep nesting
  severity: warning
  category: complexity
  pattern: '    (?:if|for|while|case).*\n(?:        (?:if|for|while|case).*\n){2,}'
  message: Deep nesting reduces readability
  fix_hint: Extract helper functions
- id: pl-long-line
  name: Long line
  severity: info
  category: code_quality
  pattern: ^.{121,}$
  message: Lines >120 chars
  fix_hint: Break at logical boundaries
- id: pl-unsafe-input
  name: Unvalidated input
  severity: error
  category: security
  pattern: (?:read|gets?|input)\s*\(
  message: User input must be validated
  fix_hint: Add input validation
- id: pl-log-sensitive
  name: Logging sensitive data
  severity: error
  category: security
  pattern: log(?:ger)?\.(?:info|debug|warn|error)\s*\(.*(?:password|secret|token|credential|api_key)
  message: Never log sensitive data (passwords, tokens, secrets)
  fix_hint: Use log filtering or redact sensitive fields
- id: pl-log-print
  name: Using print for logging
  severity: warning
  category: logging
  pattern: ^\s*print\s*\(
  message: Use structured logging instead of print statements in production
  fix_hint: Use logging framework (loguru, structlog, etc.)
- id: pl-file-leak
  name: Unclosed file handle
  severity: error
  category: resource_management
  pattern: (?:open|fopen)\s*\([^)]*\)\s*(?!.*\b(with|using|close|finally|defer)\b)
  message: File handles must be closed properly to avoid resource leaks
  fix_hint: Use with/using/defer block or ensure close() in finally
- id: pl-connection-leak
  name: Unclosed connection
  severity: error
  category: resource_management
  pattern: \b(?:connect|new connection|getConnection)\s*\([^)]*\)\s*(?!.*\b(with|using|close|finally|defer)\b)
  message: Database/network connections must be released after use
  fix_hint: Use connection pool or ensure close() in finally
- id: pl-shared-mutable
  name: Shared mutable state without sync
  severity: warning
  category: concurrency
  pattern: (?:global|static|thread_local)\s+\w+(?:\s*=\s*[^;]*)?\s*[;]?$
  message: Shared mutable state without synchronization can cause race conditions
  fix_hint: Use mutex/lock/atomic or thread-local storage
- id: pl-large-alloc-loop
  name: Large allocation in loop
  severity: warning
  category: performance
  pattern: (?:for|while|loop)\s*\([^)]*\)\s*\{?\s*[^}]*\b(?:append|push|concat|new\s+(?:Array|List|StringBuilder))\b
  message: Repeated allocations inside loops impact performance
  fix_hint: Pre-allocate or use builder pattern outside the loop
- id: pl-exception-leak
  name: Exception message leaks internal info
  severity: warning
  category: security
  pattern: (?:print|log|logger)\s*\(.*e(?:rror)?\.(?:message|to_String|getMessage)\s*\)
  message: Exception messages may leak internal implementation details
  fix_hint: Log a generic message, add exception details separately
- id: pl-hardcoded-secret-in-ci
  name: Hardcoded secret in CI config
  severity: error
  category: security
  pattern: (?:GITHUB_TOKEN|API_KEY|SECRET|PASSWORD)\s*[=:]\s*[\"'][^\"']+[\"']
  message: CI/CD secrets should use GitHub Secrets or vault, not hardcoded strings
  fix_hint: Use ${{ secrets.MY_SECRET }} in GitHub Actions
- id: pl-ci-disabled-check
  name: Disabled CI check
  severity: warning
  category: ci_cd
  pattern: continue-on-error:\s*true
  message: CI checks with continue-on-error silently ignore failures
  fix_hint: Remove continue-on-error or add explicit error handling
- id: pl-docker-image-latest
  name: Using :latest tag
  severity: warning
  category: ci_cd
  pattern: FROM\s+\S+:\s*latest\b
  message: Using :latest tag makes builds non-reproducible
  fix_hint: Pin to specific version tag
- id: pl-docker-exposed-port
  name: Exposed port without healthcheck
  severity: warning
  category: ci_cd
  pattern: EXPOSE\s+\d+
  message: Exposed ports should have corresponding healthcheck
  fix_hint: Add HEALTHCHECK instruction
- id: pl-iac-hardcoded-secret
  name: Hardcoded secret in IaC
  severity: error
  category: security
  pattern: (?:password|secret_key|access_key)\s*[=:]\s*[\"'][^\"']+[\"']
  message: Infrastructure secrets should use vault or secret store
  fix_hint: Use AWS Secrets Manager, HashiCorp Vault, or SOPS
- id: pl-iac-admin-exposed
  name: Admin service exposed to internet
  severity: error
  category: security
  pattern: '(?:adminer|phpmyadmin|pgadmin|kibana)\s*:'
  message: Admin tools should not be publicly accessible
  fix_hint: Restrict ingress to internal network only
- id: pl-docker-root-user
  name: Running as root in container
  severity: error
  category: security
  pattern: FROM\s+\S+\s*(?:AS\s+\w+)?\s*\n(?!.*USER\s)
  message: Running containers as root is a security risk
  fix_hint: Add 'USER nobody' or create a non-root user
- id: pl-pip-audit-missing
  name: Missing dependency audit
  severity: warning
  category: ci_cd
  pattern: pip install\b(?!.*pip-audit|.*safety)
  message: Package installation without vulnerability scanning
  fix_hint: Add 'pip-audit' or 'safety check' after install
naming:
  file:
    pattern: ^[a-z][a-z0-9_]*\.pl$
    message: Perl scripts should use snake_case
  function:
    pattern: ^[a-z][a-z0-9_:]*$
    message: Perl subroutines should use snake_case
thresholds:
  max_function_length: 50
  max_file_length: 500
  max_line_length: 120
  max_nesting_depth: 4
