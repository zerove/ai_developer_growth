language: swift
version: '>=5.7'
config_version: '1.0'
anti_patterns:
- id: sw-force-unwrap
  name: Force unwrap (!)
  severity: error
  category: error_handling
  pattern: \w+!(?!\.)
  message: Force unwrap can crash at runtime
  fix_hint: Use optional binding (if let) or guard let instead
- id: sw-hardcoded-secret
  name: Hardcoded secret
  severity: error
  category: security
  pattern: (?:password|secret|api_key|token)\s*=\s*"[^"]+"
  message: Hardcoded secrets are a security vulnerability
  fix_hint: Use Keychain or environment variables
- id: sw-print-debug
  name: print() in production code
  severity: info
  category: code_quality
  pattern: \bprint\(|debugPrint\(|dump\(
  message: Use os_log or Logger for production logging
  fix_hint: import os; let logger = Logger()
- id: sw-try-force
  name: try! (force try)
  severity: error
  category: error_handling
  pattern: \btry!
  message: try! crashes if the throwing function throws
  fix_hint: Use try with do-catch or try? for optional handling
- id: sw-catch-all
  name: Generic catch clause
  severity: warning
  category: error_handling
  pattern: catch\s*\{\s*\n\s*\}
  message: Empty catch block silently swallows errors
  fix_hint: Log the error or rethrow with proper handling
- id: sw-retain-cycle
  name: Potential retain cycle in closure
  severity: warning
  category: performance
  pattern: \{\s*\[?(?!\s*weak|\s*unowned).*\]\s*in
  message: Closures capturing self strongly can cause retain cycles
  fix_hint: Use [weak self] or [unowned self] in escaping closures
- id: sw-nested-deep
  name: Deeply nested code
  severity: warning
  category: code_quality
  pattern: (?:if|guard|for|while|switch).*(?:if|guard|for|while|switch).*(?:if|guard|for|while|switch)
  message: Deep nesting reduces readability
  fix_hint: Extract into helper functions or use early returns
- id: sw-global-var
  name: Global mutable variable
  severity: warning
  category: code_quality
  pattern: ^var\s+\w+\s*.*=\s*(?!\s*$)
  message: Global mutable state is hard to test and reason about
  fix_hint: Use dependency injection or singleton pattern
- id: sw-force-cast
  name: Force cast (as!)
  severity: error
  category: type_safety
  pattern: \bas!
  message: Force cast can crash at runtime
  fix_hint: Use conditional cast (as?) with if-let binding
- id: sw-nspointer
  name: Using NSObject/NSCoding patterns
  severity: info
  category: modern_swift
  pattern: \bNSObject\b|\bNSCoding\b
  message: Prefer Swift-native protocols (Codable) over NSObject patterns
  fix_hint: Use Codable for serialization instead of NSCoding
- id: sw-log-sensitive
  name: Logging sensitive data
  severity: error
  category: security
  pattern: log(?:ger)?\.(?:info|debug|warn|error)\s*\(.*(?:password|secret|token|credential|api_key)
  message: Never log sensitive data (passwords, tokens, secrets)
  fix_hint: Use log filtering or redact sensitive fields
- id: sw-log-print
  name: Using print for logging
  severity: warning
  category: logging
  pattern: ^\s*print\s*\(
  message: Use structured logging instead of print statements in production
  fix_hint: Use logging framework (loguru, structlog, etc.)
- id: sw-file-leak
  name: Unclosed file handle
  severity: error
  category: resource_management
  pattern: (?:open|fopen)\s*\([^)]*\)\s*(?!.*\b(with|using|close|finally|defer)\b)
  message: File handles must be closed properly to avoid resource leaks
  fix_hint: Use with/using/defer block or ensure close() in finally
- id: sw-connection-leak
  name: Unclosed connection
  severity: error
  category: resource_management
  pattern: (?:connect|new connection|getConnection)\s*\([^)]*\)\s*(?!.*\b(with|using|close|finally|defer)\b)
  message: Database/network connections must be released after use
  fix_hint: Use connection pool or ensure close() in finally
- id: sw-missing-await
  name: Missing await on async call
  severity: error
  category: concurrency
  pattern: (?:async\s+def|async\s+fn)\s+\w+\s*\([^)]*\)\s*\{?\s*$
  message: Async function called without await may cause race conditions
  fix_hint: Add await/async keyword or handle the future properly
- id: sw-shared-mutable
  name: Shared mutable state without sync
  severity: warning
  category: concurrency
  pattern: (?:global|static|thread_local)\s+\w+(?:\s*=\s*[^;]*)?\s*[;]?$
  message: Shared mutable state without synchronization can cause race conditions
  fix_hint: Use mutex/lock/atomic or thread-local storage
- id: sw-large-alloc-loop
  name: Large allocation in loop
  severity: warning
  category: performance
  pattern: (?:for|while|loop)\s*\([^)]*\)\s*\{?\s*[^}]*\b(?:append|push|concat|new\s+(?:Array|List|StringBuilder))\b
  message: Repeated allocations inside loops impact performance
  fix_hint: Pre-allocate or use builder pattern outside the loop
- id: sw-n-plus-one
  name: Potential N+1 query pattern
  severity: warning
  category: performance
  pattern: (?:for|while|loop|each|map)\s*[^)]*\)?\s*\{?[^}]*\b(?:query|find|get|fetch|load)\b[^}]*\}
  message: Query inside a loop may cause N+1 performance problem
  fix_hint: Use batch loading, eager loading, or JOIN query
- id: sw-cors-allow-all
  name: Overly permissive CORS
  severity: error
  category: security
  pattern: (?:Access-Control-Allow-Origin|origins?)\s*[=:]\s*["\']?\*["\']?
  message: Wildcard CORS exposes API to any origin
  fix_hint: Restrict CORS to specific allowed origins
- id: sw-no-input-validation
  name: Missing input validation on API
  severity: warning
  category: security
  pattern: (?:@\w+Mapping|def\s+\w+\([^)]*request|route|endpoint|api_view)
  message: API endpoints should validate all input parameters
  fix_hint: Add input validation or use schema validation library
- id: sw-hardcoded-origin
  name: Hardcoded origin/domain
  severity: warning
  category: config
  pattern: (?:allowed_origins|trusted_origins|ALLOWED_HOSTS)\s*[=:]\s*\["\'\]https?://
  message: Hardcoded origins in config should be environment variables
  fix_hint: Use environment variables for allowed origins
- id: sw-exception-leak
  name: Exception message leaks internal info
  severity: warning
  category: security
  pattern: (?:print|log|logger)\s*\(.*e(?:rror)?\.(?:message|to_String|getMessage)\s*\)
  message: Exception messages may leak internal implementation details
  fix_hint: Log a generic message, add exception details separately
naming:
  file:
    pattern: ^[A-Z][a-zA-Z0-9]*\.swift$
    message: Swift files should use PascalCase
  function:
    pattern: ^[a-z][a-zA-Z0-9]*$
    message: Functions should use camelCase
  class:
    pattern: ^[A-Z][a-zA-Z0-9]*$
    message: Classes should use PascalCase
  constant:
    pattern: ^[a-z][a-zA-Z0-9]*$
    message: Swift constants use camelCase (lowercase let)
thresholds:
  max_function_length: 40
  max_file_length: 500
  max_line_length: 120
  max_nesting_depth: 3
  max_function_params: 5
  max_cyclomatic_complexity: 10
tooling:
  linter: swiftlint
  formatter: swift-format
  type_checker: swiftc
  test_runner: xctest
  config_files:
  - Package.swift
  - .swiftlint.yml
