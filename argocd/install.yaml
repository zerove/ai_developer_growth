apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: jcode-platform
---
apiVersion: argoproj.io/v1alpha1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd
spec:
  server:
    replicas: 2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - argocd.example.com
      tls:
        - secretName: argocd-tls
          hosts:
            - argocd.example.com
    rbac:
      defaultPolicy: "role:readonly"
      policy: |
        g, argocd:admins, role:admin
        g, argocd:developers, role:developer
    extraConfig:
      application.instanceLabelKey: argocd.argoproj.io/instance
  repository:
    credentials:
      - url: https://github.com
        usernameSecret:
          name: github-credentials
          key: username
        passwordSecret:
          name: github-credentials
          key: password
  ha:
    enabled: true
    replicas: 2
  redis:
    ha:
      enabled: true
  redis:
    enabled: true
    architecture: replication
    master:
      persistence:
        enabled: true
        size: 5Gi
    replication:
      replicas: 2
  repo:
    replicas: 2
  server:
    replicas: 2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
  dex:
    enabled: true
    config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $GITHUB_CLIENT_ID
            clientSecret: $GITHUB_CLIENT_SECRET
            orgs:
              - name: your-org
                team: argocd-admins
              - name: your-org
                team: argocd-developers
  notifications:
    enabled: true
    subscriptions:
      - recipients:
          - slack:#argocd-alerts
        triggers:
          - on-deployed
          - on-sync-failed
          - on-sync-running
      triggers:
        - name: on-deployed
          trigger: on-deployed
        - name: on-sync-failed
          trigger: on-sync-failed
      notifications:
        - name: slack
          args:
            webhook-url: $SLACK_WEBHOOK_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: github-credentials
  namespace: argocd
type: Opaque
stringData:
  username: "your-github-username"
  password: "your-github-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-tls
  namespace: argocd
type: kubernetes.io/tls
stringData:
  tls.crt: |
    # Your TLS certificate
  tls.key: |
    # Your TLS private key
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: argocd
type: Opaque
stringData:
  admin-password: "your-grafana-admin-password"