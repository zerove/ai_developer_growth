# 统一语言配置
# 所有支持语言的配置集中管理

supported:
  # 主要支持语言 (有完整解析器支持)
  - python
  - javascript
  - typescript
  - rust
  - go

# 次要支持语言 (基础检查)
secondary:
  - java
  - cpp
  - csharp
  - ruby
  - php
  - swift
  - kotlin
  - scala
  - dart
  - zig
  - elixir
  - clojure
  - haskell
  - fsharp
  - lua
  - shell
  - sql

# 语言别名映射
aliases:
  js: javascript
  ts: typescript
  py: python
  rs: rust
  go: go
  py3: python

# 文件扩展名映射
extensions:
  python: [".py"]
  javascript: [".js", ".jsx", ".mjs", ".cjs"]
  typescript: [".ts", ".tsx", ".mts", ".cts"]
  rust: [".rs"]
  go: [".go"]
  java: [".java"]
  cpp: [".cpp", ".cc", ".cxx", ".hpp", ".hh", ".hxx", ".c", ".h"]
  csharp: [".cs"]
  ruby: [".rb"]
  php: [".php"]
  swift: [".swift"]
  kotlin: [".kt", ".kts"]
  scala: [".scala"]
  dart: [".dart"]
  zig: [".zig"]
  elixir: [".ex", ".exs"]
  clojure: [".clj", ".cljs"]
  haskell: [".hs"]
  fsharp: [".fs", ".fsx"]
  lua: [".lua"]
  shell: [".sh", ".bash", ".zsh"]
  sql: [".sql"]

# CI 中实际运行的语言矩阵 (按需裁剪)
ci_matrix:
  governance_audit:
    - python
    - shell
  # 其他语言可按需启用
  # - javascript
  # - typescript
  # - rust
  # - go