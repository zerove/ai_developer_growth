# 统一阈值配置
# 所有质量门禁阈值集中管理，CI/workflow 通过模板渲染或运行时读取

# 覆盖率门禁
coverage:
  fail_under: 80
  branch_fail_under: 75
  diff_cover_fail_under: 80

# 复杂度阈值
complexity:
  python:
    max_cyclomatic: 10
    max_cognitive: 15
    max_nesting: 4
    max_function_length: 50
  javascript:
    max_cyclomatic: 10
    max_cognitive: 15
    max_nesting: 4
    max_function_length: 50
  typescript:
    max_cyclomatic: 10
    max_cognitive: 15
    max_nesting: 4
    max_function_length: 50
  rust:
    max_cyclomatic: 10
    max_cognitive: 15
    max_nesting: 4
    max_function_length: 50
  go:
    max_cyclomatic: 10
    max_cognitive: 15
    max_nesting: 4
    max_function_length: 50

# 代码行数阈值
lines:
  max_file_lines: 500
  max_function_lines: 50
  max_class_lines: 200

# 质量门禁
quality_gates:
  gate1_lint: true
  gate2_format: true
  gate3_typecheck: true
  gate4_test: true
  gate5_coverage: true
  gate6_security: true
  gate7_governance_docs: true
  gate8_ai_sdlc: true
  gate9_ai_quality: true
  gate10_hallucination: true
  gate11_links: true
  gate12_cases: true
  gate13_complexity: true

# AI 质量门禁阈值
ai_quality:
  human_review_ratio_min: 0.1
  unsafe_code_ratio_max: 0.05
  absolute_claims_max: 3
  comment_density_min: 0.15

# 安全扫描
security:
  bandit_severity: high
  secret_scan_depth: 10  # HEAD~10

# 依赖检查
dependencies:
  max_age_days: 90
  allow_dev_dependencies: true