<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Developer Growth{% endblock %}</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        nav { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 0; position: sticky; top: 0; z-index: 100; }
        nav .container { display: flex; justify-content: space-between; align-items: center; }
        nav a { text-decoration: none; color: var(--primary); font-weight: 600; }
        nav a.brand { font-size: 1.1em; color: var(--text); }
        nav .links { display: flex; gap: 16px; align-items: center; }
        nav .links a { color: var(--text-muted); font-weight: 400; }
        nav .links a:hover { color: var(--primary); }
        .btn { display: inline-block; padding: 8px 16px; border-radius: var(--radius); text-decoration: none; font-size: 14px; cursor: pointer; border: none; font-weight: 500; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
        .card h2 { margin-bottom: 16px; font-size: 1.2em; }
        .grid { display: grid; gap: 16px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .stat-card { text-align: center; padding: 20px; }
        .stat-card .number { font-size: 2em; font-weight: 700; color: var(--primary); }
        .stat-card .label { color: var(--text-muted); font-size: 0.9em; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
            font-size: 14px; font-family: inherit;
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .alert { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 14px; }
        .alert-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-progress { background: #dbeafe; color: #1e40af; }
        .badge-done { background: #dcfce7; color: #166534; }
        .badge-submitted { background: #e0e7ff; color: #3730a3; }
        .badge-reviewed { background: #fef3c7; color: #92400e; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { font-weight: 600; color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
        .slider-group { display: flex; align-items: center; gap: 12px; }
        .slider-group input[type=range] { flex: 1; }
        .slider-group .value { min-width: 40px; text-align: center; font-weight: 600; color: var(--primary); }
        .hero { text-align: center; padding: 60px 20px; }
        .hero h1 { font-size: 2.5em; margin-bottom: 16px; }
        .hero p { font-size: 1.1em; color: var(--text-muted); max-width: 600px; margin: 0 auto 24px; }
        .hero .actions { display: flex; gap: 12px; justify-content: center; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; padding: 40px 0; }
        .feature { text-align: center; }
        .feature h3 { margin-bottom: 8px; }
        .feature p { color: var(--text-muted); font-size: 14px; }
        footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 40px; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; align-items: center; }
        .gap-8 { gap: 8px; }
        .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="brand">🌱 AI Developer Growth</a>
            <div class="links">
                {% if request.cookies.get('access_token') %}
                    <a href="/dashboard">Dashboard</a>
                    <a href="/assess">Assessment</a>
                    <a href="/progress">Progress</a>
                    <a href="/contribute">Contribute</a>
                    <a href="/auth/logout">Logout</a>
                {% else %}
                    <a href="/auth/login">Login</a>
                    <a href="/auth/register">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container" style="padding-top: 24px; padding-bottom: 40px;">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="container">
            AI Developer Growth &copy; 2026 | Built with FastAPI
        </div>
    </footer>
</body>
</html>
