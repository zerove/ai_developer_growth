{% extends "base.html" %}
{% block title %}New Contribution - AI Developer Growth{% endblock %}
{% block content %}
<div class="card">
    <h2>📝 New Contribution</h2>
    <form method="post" action="/contribute">
        <div class="form-group">
            <label>Document Path</label>
            <input type="text" name="doc_path" placeholder="e.g. mindset/new-article.md" required>
        </div>
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="doc_title" placeholder="My Awesome Contribution" required>
        </div>
        <div class="form-group">
            <label>Content (Markdown)</label>
            <textarea name="content" rows="15" required placeholder="# Your content here...

Write your documentation or article content in Markdown format."></textarea>
        </div>
        <div style="display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="/contribute" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
