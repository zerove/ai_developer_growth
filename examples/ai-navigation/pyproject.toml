[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-navigation"
version = "1.0.0"
description = "RAG-based AI knowledge navigation system with personalized learning paths"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    # vector_search.py 顶层硬导入，经 hybrid_search -> chat_interface -> src/__init__
    # 传递依赖 numpy，缺失时整个包无法 import。
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0", "pytest-cov>=4.0"]
# sentence_transformers 在 vector_search.py 内惰性加载且被 try 包裹，属可选能力。
# 它会连带拉入 torch，故不进默认依赖。
semantic = ["sentence-transformers>=2.7.0"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ai_navigation*", "main*", "cli*"]
