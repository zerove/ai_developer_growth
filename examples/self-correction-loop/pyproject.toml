[project]
name = "self-correction-loop"
version = "1.0.0"
description = "AI-powered self-correction loop: test → detect failure → fix → verify"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PLC", "PLE", "PLW"]
ignore = ["PLR0913"]
