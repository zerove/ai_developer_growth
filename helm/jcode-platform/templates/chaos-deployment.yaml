{{- if .Values.chaos.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jcode-platform.fullname" . }}-chaos
  labels:
    {{- include "jcode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: chaos
spec:
  replicas: {{ .Values.chaos.replicaCount }}
  selector:
    matchLabels:
      {{- include "jcode-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chaos
  template:
    metadata:
      labels:
        {{- include "jcode-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chaos
      annotations:
        {{- if .Values.global.commonLabels }}
        {{- toYaml .Values.global.commonLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jcode-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.security.podSecurityStandards | nindent 8 }}
      containers:
        - name: chaos
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.repository }}/chaos:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
      {{- with .Values.chaos.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chaos.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chaos.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jcode-platform.fullname" . }}-chaos
  labels:
    {{- include "jcode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: chaos
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "jcode-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chaos
{{- end }}