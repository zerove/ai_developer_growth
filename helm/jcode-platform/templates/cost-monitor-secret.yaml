apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jcode-platform.fullname" . }}-cost-credentials
  namespace: monitoring
  labels:
    {{- include "jcode-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # AWS 成本管理
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_COST_EXPLORER_ARN: ""

  # GCP 成本管理 (如果使用 GCP)
  GCP_PROJECT_ID: ""
  GCP_CREDENTIALS_JSON: ""

  # Azure 成本管理
  AZURE_SUBSCRIPTION_ID: ""
  AZURE_TENANT_ID: ""
  AZURE_CLIENT_ID: ""
  AZURE_CLIENT_SECRET: ""

  # Kubecost
  KUBECOST_API_TOKEN: ""
  KUBECOST_URL: ""

  # Prometheus/Grafana
  PROMETHEUS_URL: "http://prometheus-operated.monitoring:9090"
  GRAFANA_API_KEY: ""

  # Slack 通知
  SLACK_WEBHOOK_URL: ""
  SLACK_CHANNEL: "#cost-alerts"

  # Email 通知
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  EMAIL_FROM: "cost-monitor@example.com"
  EMAIL_TO: "team@example.com"

  # Confluence
  CONFLUENCE_URL: "https://confluence.example.com"
  CONFLUENCE_USERNAME: ""
  CONFLUENCE_API_TOKEN: ""
  CONFLUENCE_SPACE_KEY: "COST"