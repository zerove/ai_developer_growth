{{- if and .Values.global.secrets (index .Values.global.secrets "create") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jcode-platform.fullname" . }}-secrets
  labels:
    {{- include "jcode-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database
  {{- if and .Values.postgresql (index .Values.postgresql "enabled") }}
  postgresql-password: {{ (index .Values.postgresql "password" | default "") | b64enc }}
  {{- end }}
  
  # Redis
  {{- if and .Values.redis (index .Values.redis "enabled") }}
  redis-password: {{ (index .Values.redis "password" | default "") | b64enc }}
  {{- end }}
  
  # Registry
  registry-username: {{ .Values.global.imageRegistryUsername | default "" | b64enc }}
  registry-password: {{ .Values.global.imageRegistryPassword | default "" | b64enc }}
  
  # External Services
  slack-webhook-url: {{ (index .Values.global.secrets "slackWebhookUrl" | default "") | b64enc }}
  github-token: {{ (index .Values.global.secrets "githubToken" | default "") | b64enc }}
  gitlab-token: {{ (index .Values.global.secrets "gitlabToken" | default "") | b64enc }}
  
  # AI/LLM
  openai-api-key: {{ (index .Values.global.secrets "openaiApiKey" | default "") | b64enc }}
  anthropic-api-key: {{ (index .Values.global.secrets "anthropicApiKey" | default "") | b64enc }}
  
  # External Secrets Operator (如果使用)
  vault-token: {{ (index .Values.global.secrets "vaultToken" | default "") | b64enc }}
{{- end }}
