# Production Environment Overrides
#
# helm upgrade --install jcode-platform ./helm/jcode-platform \
#   -f values.yaml -f values-prod.yaml \
#   --namespace production --create-namespace

global:
  imageRegistry: "registry.example.com"
  resources:
    limits:
      cpu: "4000m"
      memory: "8Gi"
    requests:
      cpu: "1000m"
      memory: "2Gi"

# ──────────────────────────────────────────────────────────
# 生产环境特有配置：高可用、资源充足、严格安全
# ──────────────────────────────────────────────────────────

api:
  replicaCount: 3
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    minReplicas: 3
    maxReplicas: 20
  ingress:
    enabled: true
    hosts:
      - host: api.jcode.example.com
        paths:
          - path: /
            pathType: Prefix


orchestrator:
  replicaCount: 3
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

qualityGate:
  replicaCount: 3
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

semantic:
  replicaCount: 2
  resources:
    limits:
      cpu: "4000m"
      memory: "4Gi"
    requests:
      cpu: "1000m"
      memory: "1Gi"
  persistence:
    size: 50Gi
    storageClass: fast-ssd

chaos:
  enabled: false

monitoring:
  prometheus:
    prometheusSpec:
      retention: 90d
      retentionSize: 200GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: fast-ssd
            resources:
              requests:
                storage: 500Gi
  grafana:
    persistence:
      size: 50Gi
    ingress:
      enabled: true
      hosts:
        - grafana.jcode.example.com


loki:
  loki:
    limits_config:
      retention_period: 90d

tempo:
  tempo:
    persistence:
      size: 200Gi

# ──────────────────────────────────────────────────────────
# 生产环境域名与 TLS
# ──────────────────────────────────────────────────────────

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: jcode-platform-tls-prod
      hosts:
        - api.jcode.example.com
        - grafana.jcode.example.com

# ──────────────────────────────────────────────────────────
# 生产环境安全加固
# ──────────────────────────────────────────────────────────

security:
  podSecurityStandards: restricted
  networkPolicies:
    enabled: true
    defaultDeny: true
  runtimeSecurity:
    enabled: true
    falco:
      enabled: true

# ──────────────────────────────────────────────────────────
# 生产环境高级扩缩容
# ──────────────────────────────────────────────────────────

autoscaling:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max

# ──────────────────────────────────────────────────────────
# 生产环境数据库/缓存 (外部托管)
# ──────────────────────────────────────────────────────────

postgresql:
  enabled: true
  primary:
    resources:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
  persistence:
    size: 100Gi
    storageClass: fast-ssd

redis:
  enabled: true
  architecture: replication
  master:
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "250m"
        memory: "512Mi"
  replica:
    replicaCount: 2
    resources:
      limits:
        cpu: "500m"
        memory: "1Gi"
      requests:
        cpu: "100m"
        memory: "256Mi"
