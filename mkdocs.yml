site_name: AI Developer Growth
site_description: Language-agnostic AI developer growth framework with 21 language rules
site_url: https://1jehuang.github.io/ai_developer_growth/
repo_url: https://github.com/1jehuang/ai_developer_growth
repo_name: 1jehuang/ai_developer_growth

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Language Rules:
    - Reference: language-rules-reference.md
  - Efficiency:
    - Full Cycle Workflow: efficiency/full-cycle-workflow.md
    - Context Engineering: efficiency/context-engineering.md
    - AI Coding Efficiency: efficiency/ai-coding-efficiency.md
    - Prompt Engineering: efficiency/prompt-engineering.md
  - Governance:
    - Language Rules Map: governance/MAP.md
    - Coding Standards: governance/coding-standards.md
    - Security Standards: governance/security-standards.md
  - Agent Development:
    - Prompt Template: agent-dev/agent-prompt-template.md
    - Context Management: agent-dev/context-management.md
    - Quality Gates: agent-dev/quality-gates.md
  - ADRs:
    - ADR: adr/ADR.md
    - Language Rules Architecture: adr/001-language-rules-engine-architecture.md
  - Tools:
    - IDE Best Practices: tools/ide-best-practices.md
    - Tool Matrix: tools/ai-tool-matrix.md
  - API Reference:
    - Rules Engine: api/rules-engine.md
    - CLI: api/cli.md
  - Meta:
    - MOC: MOC.md
    - Capability Levels: capability-levels.md
