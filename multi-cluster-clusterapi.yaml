apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: production-us-east-1
  namespace: cluster-api-system
  labels:
    cluster.x-k8s.io/cluster-name: production-us-east-1
    environment: production
    region: us-east-1
    tier: production
spec:
  clusterNetwork:
    services:
      cidrBlocks: ["10.96.0.0/12"]
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    serviceDomain: "cluster.local"
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: production-us-east-1-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AWSCluster
    name: production-us-east-1
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: production-us-east-1-control-plane
  namespace: cluster-api-system
spec:
  replicas: 3
  version: "1.28.4"
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AWSMachineTemplate
    name: production-us-east-1-control-plane
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        extraArgs:
          audit-policy-file: /etc/kubernetes/audit-policy.yaml
          audit-log-path: /var/log/kubernetes/audit.log
          audit-log-maxage: "30"
          audit-log-maxbackup: "10"
          audit-log-maxsize: "100"
      controllerManager:
        extraArgs:
          bind-address: "0.0.0.0"
      scheduler:
        extraArgs:
          bind-address: "0.0.0.0"
      etcd:
        local:
          dataDir: /var/lib/etcd
      networking:
        dnsDomain: cluster.local
        podSubnet: 10.244.0.0/16
        serviceSubnet: 10.96.0.0/12
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: aws
          max-pods: "110"
          container-runtime: containerd
          container-runtime-endpoint: unix:///run/containerd/containerd.sock
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: aws
          max-pods: "110"
          container-runtime: containerd
          container-runtime-endpoint: unix:///run/containerd/containerd.sock
  rolloutStrategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AWSCluster
metadata:
  name: production-us-east-1
  namespace: cluster-api-system
spec:
  region: us-east-1
  networkSpec:
    vpc:
      id: vpc-0123456789abcdef0
      cidrBlock: 10.0.0.0/16
    subnets:
      - id: subnet-0123456789abcdef0
        type: public
        zone: us-east-1a
        cidrBlock: 10.0.1.0/24
      - id: subnet-0123456789abcdef1
        type: public
        zone: us-east-1b
        cidrBlock: 10.0.2.0/24
      - id: subnet-0123456789abcdef2
        type: public
        zone: us-east-1c
        cidrBlock: 10.0.3.0/24
      - id: subnet-0123456789abcdef3
        type: private
        zone: us-east-1a
        cidrBlock: 10.0.11.0/24
      - id: subnet-0123456789abcdef4
        type: private
        zone: us-east-1b
        cidrBlock: 10.0.12.0/24
      - id: subnet-0123456789abcdef5
        type: private
        zone: us-east-1c
        cidrBlock: 10.0.13.0/24
      - id: subnet-0123456789abcdef6
        type: database
        zone: us-east-1a
        cidrBlock: 10.0.21.0/24
      - id: subnet-0123456789abcdef7
        type: database
        zone: us-east-1b
        cidrBlock: 10.0.22.0/24
      - id: subnet-0123456789abcdef8
        type: database
        zone: us-east-1c
        cidrBlock: 10.0.23.0/24
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AWSMachineTemplate
metadata:
  name: production-us-east-1-control-plane
  namespace: cluster-api-system
spec:
  template:
    spec:
      ami:
        id: ami-0123456789abcdef0
      instanceType: m6i.xlarge
      iamInstanceProfile: control-plane.cluster-api-provider-aws.sigs.k8s.io
      sshKeyName: cluster-api-ssh-key
      additionalSecurityGroups:
        - sg-0123456789abcdef0
      iamInstanceProfile: control-plane.cluster-api-provider-aws.sigs.k8s.io
      rootVolume:
        size: 50
        type: gp3
        encrypted: true
        iops: 3000
        throughput: 125
      additionalTags:
        environment: production
        tier: production
        cluster: production-us-east-1
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: production-us-east-1-md-0
  namespace: cluster-api-system
spec:
  clusterName: production-us-east-1
  replicas: 3
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: production-us-east-1
  template:
    spec:
      clusterName: production-us-east-1
      version: "1.28.4"
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: production-us-east-1-md-0
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AWSMachineTemplate
        name: production-us-east-1-md-0
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: production-us-east-1-md-0
  namespace: cluster-api-system
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: aws
            max-pods: "110"
            container-runtime: containerd
            container-runtime-endpoint: unix:///run/containerd/containerd.sock
          taints:
            - key: "node-role.kubernetes.io/worker"
              effect: "NoSchedule"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AWSMachineTemplate
metadata:
  name: production-us-east-1-md-0
  namespace: cluster-api-system
spec:
  template:
    spec:
      ami:
        id: ami-0123456789abcdef0
      instanceType: m6i.xlarge
      iamInstanceProfile: nodes.cluster-api-provider-aws.sigs.k8s.io
      sshKeyName: cluster-api-ssh-key
      additionalSecurityGroups:
        - sg-0123456789abcdef0
      iamInstanceProfile: nodes.cluster-api-provider-aws.sigs.k8s.io
      rootVolume:
        size: 50
        type: gp3
        encrypted: true
        iops: 3000
        throughput: 125
      additionalTags:
        environment: production
        tier: production
        cluster: production-us-east-1
        node-pool: md-0