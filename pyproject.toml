[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-developer-growth"
version = "2.24.0"
description = "Open-source knowledge base for developer growth in the AI era"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "loguru>=0.7"]

[project.scripts]
adg = "tools.scripts.adg_cli:main"
# 注意：不要命名为 jcode —— 会遮蔽 Rust 版 jcode TUI（~/.local/bin/jcode）
jcode-cli = "tools.scripts.jcode_cli:main"
validate-language-rules = "tools.scripts.rules_engine.validators.cli:main"

[project.optional-dependencies]
search = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jieba>=0.42",
]
# Phase 3: 分层 extras（CI 可按 job 最小安装；`dev` 保持向后兼容全量）
dev-core = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.1.0",
    "ruff==0.15.17",
    "mypy>=1.0.0",
    "pyyaml>=6.0",
]
dev-semantic = [
    # AST 语义检查硬依赖（ast_parser 对 12 个语言包全有全无式导入）
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-ruby",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-kotlin",
    "tree-sitter-php",
    "tree-sitter-swift",
]
dev-integration = [
    "hypothesis",  # property/chaos tests
    "PyGithub",  # sync_issues (mocked but import required)
    "kubernetes",  # chaos runner tests
    "httpx",
    "starlette",
    "fastapi>=0.110",
    "jieba>=0.42",
]
dev-observability = [
    "mutmut>=2.4.0,<3",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation",
]
# 向后兼容：保持 `dev` 为完整依赖列表（lint.yml 等会直接解析该列表）
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.1.0",
    "ruff==0.15.17",
    "mypy>=1.0.0",
    "pyyaml>=6.0",
    "mutmut>=2.4.0,<3",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-ruby",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-kotlin",
    "tree-sitter-php",
    "tree-sitter-swift",
    "httpx",
    "hypothesis",
    "PyGithub",
    "kubernetes",
    "starlette",
    "fastapi>=0.110",
    "jieba>=0.42",
]
tools = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["tools*"]
exclude = ["tests*", "examples*", "docs*"]

# pytest 配置统一在 pytest.ini 中维护, 此段保留为空以避免 setuptools 警告
# (避免 pyproject + pytest.ini 重复导致 pytest WARNING "ignoring pytest config in pyproject.toml!")

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["examples/**"]

[tool.coverage.run]
# 与本地 (hooks/basic_checks.py) 及 CI (jobs/tests.yml) 实际传入的 --cov 口径一致。
# 此前此处写的是 ["tools", "tools.lsp"] —— tools.lsp 是 tools 的子集, 冗余;
# 而真正被两个调用方度量、却未在此声明的 .jcode/scripts 反而缺席, 导致
# `coverage report` 的 source 与门禁口径不一致。
source = ["tools", ".jcode/scripts"]
omit = ["*/tests/*", "*/__pycache__/*", "*/lsp_server.py"]
branch = true

[tool.coverage.report]
# 覆盖率阈值的唯一来源是 [tool.adg] cov_min: 本地由 hooks/basic_checks.py 以
# --cov-fail-under 传入, CI 由 jobs/tests.yml 读取同一键做 XML 校验。
# 此处曾重复写一份 fail_under, 两者可各自漂移且无人察觉, 故不再重复声明。
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise AssertionError",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# UP042: 迁移到 StrEnum 会破坏 279 处类型契约 —— str+Enum 的成员可参与
# str 推断，项目大量调用方直接传裸 str；改用 StrEnum 后 mypy 全面报错。
# 属刻意的类型设计，不是待修的缺陷。
ignore = ["E501", "N999", "UP017", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
# examples/ 下每个示例都是独立 pip 包, 自带 pyproject.toml 与独立的
# ruff/mypy/pytest 配置, 目录名带连字符不合 Python 包命名, 且多个示例都
# 以 src/ 作包根 —— 根项目统一检查时必然出现 "not a valid Python package
# name" 与 "Duplicate module named src"。根 ruff 已 exclude examples/**,
# 此处保持同一口径; CI 的 type-check 作业同样只查 tools/scripts 与
# ai-dev-framework/src, 三者一致。
exclude = ["ai-dev-framework/build/", "examples/"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# 模块级覆盖（合并自原 mypy.ini）
# pygls 是 lsp_server.py 的可选依赖 (Requires: pip install lsprotocol pygls)
# ignore_missing_imports 防止未安装时 mypy 检查失败
# mypy 警告 "unused section(s)" 是因为 pygls 未安装, 不是配置错误
[[tool.mypy.overrides]]
module = ["pygls.*"]
ignore_missing_imports = true

[tool.adg]
# ADG - AI Developer Governance Configuration
# All settings can be overridden by .adg/config.yml or CLI args

# Rules configuration
rules_dir = ""  # Empty = auto-discover (project/.adg → env var → ~/.jcode/governance → built-in)
custom_rules = ".adg/rules.yml"  # Project-specific rules file
domains = []  # e.g., ["finance", "hipaa", "gaming"]

# Architecture enforcement
architecture_config = ".adg/architecture.yml"
enable_layer_check = true
enable_cycle_detection = true
hub_threshold = 15

# Context-aware severity
context_aware = true

# Skip patterns: 唯一权威源在 .adg/config.yml（pre_push.py 直读；此处历史副本
# 无任何消费者，已于配置整合中删除——该副本是 config.yml 列表的真子集，删除不缩减有效跳过范围）

# Feedback system
feedback_enabled = true
feedback_db = "~/.cache/adg/feedback.json"
fp_downgrade_threshold = 0.6  # Auto-downgrade when FP rate > 60%
fp_min_reports = 5

# Output formats
default_format = "human"  # human, json, sarif
sarif_output = "adg-results.sarif"

# Performance
jobs = 4  # Parallel workers
cache_enabled = true
cache_dir = ".cache/adg"

# Test suite acceleration & gates (hooks_runner / basic_checks.run_tests)
# 插件缺失时自动降级，不会导致门禁误报
test_workers = "auto"  # pytest-xdist 并行数: "auto"/整数; 0 = 禁用并行
# flaky 重试次数；依赖 pytest-rerunfailures，插件缺失时 basic_checks 会静默降级
# 为不加 --reruns（该配置此前因插件未声明依赖而完全未生效）
test_reruns = 2        # 0 = 禁用
timeouts = { lint = 300, format = 300, typecheck = 300, security = 300, test = 1800, test_incremental = 300 }  # 按类别超时秒数; test 放宽因全量并行耗时更长

# 覆盖率门禁（真正生效的值：basic_checks.run_tests 会把它作为 --cov-fail-under
# 传给 pytest-cov，从而覆盖 [tool.coverage.report] 的 fail_under）
cov_min = 80
# 分支覆盖率门禁：CI 两处读取同一键；基线约 81.2%，阈值保留余量。
branch_cov_min = 75

# CI/CD integration
ci_mode = false  # Auto-detected in CI environments
fail_on_error = true
fail_on_warning = false
trend_enabled = true
trend_db = "~/.cache/adg/trend.db"

# Notifications
notify_webhook = ""  # slack://... or dingtalk://...
notify_on_new_errors = true
notify_on_trend_regression = true

# LSP Server
lsp_enabled = true
lsp_port = 0  # 0 = stdio

# Marketplace
marketplace_enabled = true
rules_index = "~/.jcode/governance/rules_index.json"
auto_sync = true
sync_interval_hours = 24

# LLM 配置（adr_generator, ai_context_manager）
llm_provider = "openai"
llm_model = "gpt-4o"
openai_api_key = ""  # 优先环境变量 OPENAI_API_KEY
openai_api_base = "https://api.openai.com/v1"

# 额外排除目录（合并到 DEFAULT_EXCLUDED_DIRS）
exclude = [
    ".venv-*",
    "*.egg-info",
    ".mypy_cache-*",
]

[tool.mutmut]
paths_to_mutate = "tools/scripts/rules_engine"
backup = false
runner = "python -m pytest tests/ -x --tb=short -q"

[tool.bandit]
exclude_dirs = [".venv", "examples", "tests", ".jcode/scratch"]
