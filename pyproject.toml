[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-developer-growth"
version = "2.13.16"
description = "Open-source knowledge base for developer growth in the AI era"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "loguru>=0.7"]

[project.scripts]
adg = "tools.scripts.adg_cli:main"
# 注意：不要命名为 jcode —— 会遮蔽 Rust 版 jcode TUI（~/.local/bin/jcode）
jcode-cli = "tools.scripts.jcode_cli:main"
validate-language-rules = "tools.scripts.validators.cli:main"

[project.optional-dependencies]
search = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jieba>=0.42",
]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.15.17",
    "mypy>=1.0.0",
    "pyyaml>=6.0",
    "mutmut>=2.4.0,<3",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation",
]
tools = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["tools*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Example projects have their own test configurations in their respective pyproject.toml
# Run tests from each example's directory: cd examples/<project> && python -m pytest tests/

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["examples/**"]

[tool.coverage.run]
source = ["tools.scripts", "tools.lsp"]
omit = ["*/tests/*", "*/__pycache__/*", "*/lsp_server.py"]
branch = true

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise AssertionError",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N999", "UP017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# 模块级覆盖（合并自原 mypy.ini）
[[tool.mypy.overrides]]
module = ["pygls.*"]
ignore_missing_imports = true

[tool.adg]
# ADG - AI Developer Governance Configuration
# All settings can be overridden by .adg/config.yml or CLI args

# Rules configuration
rules_dir = ""  # Empty = auto-discover (project/.adg → env var → ~/.jcode/governance → built-in)
custom_rules = ".adg/rules.yml"  # Project-specific rules file
domains = []  # e.g., ["finance", "hipaa", "gaming"]

# Architecture enforcement
architecture_config = ".adg/architecture.yml"
enable_layer_check = true
enable_cycle_detection = true
hub_threshold = 15

# Context-aware severity
context_aware = true
severity_overrides = {test = "down-1", prototype = "down-2", legacy = "down-1", config = "down-2", demo = "down-2"}

# Skip patterns for test/demo files
skip_patterns = [
    "**/test_*.py",
    "**/*_test.py",
    "**/tests/**/*.py",
    "**/demo*.py",
    "**/*_demo.py",
]

# Feedback system
feedback_enabled = true
feedback_db = "~/.cache/adg/feedback.json"
fp_downgrade_threshold = 0.6  # Auto-downgrade when FP rate > 60%
fp_min_reports = 5

# Output formats
default_format = "human"  # human, json, sarif
sarif_output = "adg-results.sarif"

# Performance
jobs = 4  # Parallel workers
cache_enabled = true
cache_dir = ".cache/adg"

# Test suite acceleration & gates (hooks_runner / basic_checks.run_tests)
# 插件缺失时自动降级，不会导致门禁误报
test_workers = "auto"  # pytest-xdist 并行数: "auto"/整数; 0 = 禁用并行
test_reruns = 2        # flaky 重试次数 (pytest-rerunfailures); 0 = 禁用
cov_min = 65           # 覆盖率门禁百分比; 0 = 禁用
timeouts = { lint = 300, format = 300, typecheck = 300, security = 300, test = 900 }  # 按类别超时秒数; test 放宽因全量并行耗时更长

# CI/CD integration
ci_mode = false  # Auto-detected in CI environments
fail_on_error = true
fail_on_warning = false
trend_enabled = true
trend_db = "~/.cache/adg/trend.db"

# Notifications
notify_webhook = ""  # slack://... or dingtalk://...
notify_on_new_errors = true
notify_on_trend_regression = true

# LSP Server
lsp_enabled = true
lsp_port = 0  # 0 = stdio

# Marketplace
marketplace_enabled = true
rules_index = "~/.jcode/governance/rules_index.json"
auto_sync = true
sync_interval_hours = 24

# LLM 配置（adr_generator, ai_context_manager）
llm_provider = "openai"
llm_model = "gpt-4o"
openai_api_key = ""  # 优先环境变量 OPENAI_API_KEY
openai_api_base = "https://api.openai.com/v1"

# 额外排除目录（合并到 DEFAULT_EXCLUDED_DIRS）
exclude = [
    ".venv-*",
    "*.egg-info",
    ".mypy_cache-*",
]

[tool.mutmut]
source_paths = ["tools/scripts/rules_engine"]
pytest_add_cli_args_test_selection = ["tests"]
backup = false
runner = "python -m pytest tests/ -x --tb=short -q"

[tool.bandit]
exclude_dirs = [".venv", "examples", "tests", ".jcode/scratch"]
