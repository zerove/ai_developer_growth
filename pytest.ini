[pytest]
testpaths =
    tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning

markers =
    slow: 标记耗时较长的测试；默认仍会执行，需要显式 -m "not slow" 跳过
    integration: 集成测试

# 单测试超时上限（秒）。此前没有任何超时约束，CI job 也未设 timeout-minutes，
# 一旦有测试挂死会一直占用 GitHub 默认的 360 分钟 runner 配额。
# 300s 对当前最慢的测试（子进程导入契约检查）仍有大量余量。
timeout = 300
# 用 thread 而非默认 signal：signal 方案在多线程/subprocess 场景下可能无法
# 按时打断，且会与 pytest-xdist 组合出难查的挂死。
timeout_method = thread

addopts =
    -v
    --tb=short
    --strict-markers
