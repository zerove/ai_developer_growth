[pytest]
testpaths =
    tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning

markers =
    slow: 标记耗时较长的测试；默认仍会执行，需要显式 -m "not slow" 跳过
    integration: 集成测试

# 注意: 这里刻意不设单测试超时。该配置依赖 pytest-timeout 插件, 而该插件既未列入
# CI 的 pip install, 也未在本地安装 —— 配置写了也只是产生
# "PytestConfigWarning: Unknown config option: timeout" 后被静默忽略, 属于
# 虚假保障。真实生效的上限是 CI job 级 timeout-minutes (jobs/tests.yml, 30 分钟);
# 本地运行当前无超时约束, 需自行用 `timeout` 命令包裹。
addopts =
    -v
    --tb=short
    --strict-markers
