[pytest]
testpaths =
    tests
    ai-dev-framework/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning

markers =
    slow: 标记耗时较长的测试；默认仍会执行，需要显式 -m "not slow" 跳过
    integration: 集成测试

# 单测试超时由 pytest-timeout 插件强制约束（已在 requirements-dev.txt 声明并在 CI 安装）。
# 每个测试最大 300 秒；CI job 级 timeout-minutes (jobs/tests.yml, 30 分钟) 仍作为兜底。
timeout = 300
addopts =
    -v
    --tb=short
    --strict-markers
